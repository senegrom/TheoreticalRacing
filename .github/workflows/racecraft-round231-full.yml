name: Round 231 checkpoint full validation
on:
  push:
    branches: [codex/racecraft-own-progress]
    paths:
      - .github/workflows/racecraft-round231-full.yml
      - docs/experiments/round231/checkpoint-candidate.patch
      - docs/experiments/round231/checkpoint-production.patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: round231-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fleet:
    name: ${{ matrix.mode }} / ${{ matrix.slots }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        mode: [legacy, informed, scatter]
        slots: [odd, even, all]
        shard: [regular, nordschleife]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build measured policy
        env:
          ASSIGNMENT: ${{ matrix.slots }}
        run: |
          PATCH=docs/experiments/round231/checkpoint-candidate.patch
          if [ "$ASSIGNMENT" = all ]; then
            PATCH=docs/experiments/round231/checkpoint-production.patch
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          sh build_main.sh
          mkdir -p results
          java --version > results/java-version.txt 2>&1
          sha256sum theoreticRacing.jar "$PATCH" > results/build-sha256.txt
      - name: Prepare exact profile and disjoint track shard
        env:
          MODE: ${{ matrix.mode }}
          ASSIGNMENT: ${{ matrix.slots }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          slots = {'odd':'1,3,5,7', 'even':'2,4,6,8', 'all':'1,2,3,4,5,6,7,8'}[os.environ['ASSIGNMENT']]
          props = Path('tracks/lap_bench.properties').read_text()
          props += '\naiStartPlacement=' + os.environ['MODE'] + '\ncandidateSlots=' + slots + '\n'
          Path('results/profile.properties').write_text(props)
          tracks = sorted(p.stem for p in Path('tracks').glob('*.track'))
          selected = [t for t in tracks if (t == 'nordschleife') == (os.environ['SHARD'] == 'nordschleife')]
          assert len(selected) == (1 if os.environ['SHARD'] == 'nordschleife' else 83)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RACING_TRACKS=' + ' '.join(selected) + '\n')
          PY
      - name: Full fleet on fresh seeds 21-30
        env:
          RACING_PROPS: ${{ github.workspace }}/results/profile.properties
          RACING_HEAP: ${{ matrix.shard == 'nordschleife' && '-Xmx8g -XX:ActiveProcessorCount=2' || '-Xmx4g -XX:ActiveProcessorCount=2' }}
        run: sh tracks/fleet_grid.sh 21-30 ${{ matrix.shard == 'nordschleife' && '1' || '2' }} results/fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round231-full-${{ matrix.mode }}-${{ matrix.slots }}-${{ matrix.shard }}
          path: results
          if-no-files-found: error
          retention-days: 14
  core-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: git apply docs/experiments/round231/checkpoint-production.patch
      - run: sh build_main.sh
      - run: sh run_tests.sh
      - run: python tests/golden_races.py
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
  pins:
    name: AI pins / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: git apply docs/experiments/round231/checkpoint-production.patch
      - run: sh build_main.sh
      - name: Check unchanged regression expectations
        env:
          PIN_GROUP: ${{ matrix.group }}
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tests = sorted(Path('tests').glob('ai1_*_regression.py'))
          assert len(tests) == 23
          selected = [p for i,p in enumerate(tests) if i % 4 == int(os.environ['PIN_GROUP'])]
          out = Path('results'); out.mkdir()
          results = []
          for test in selected:
              with (out/(test.stem+'.txt')).open('w') as log:
                  run = subprocess.run([sys.executable, str(test)], stdout=log, stderr=subprocess.STDOUT, timeout=1200)
              results.append({'test':str(test), 'returncode':run.returncode})
              print(str(test) + ': ' + str(run.returncode), flush=True)
          (out/'summary.json').write_text(json.dumps(results, indent=2)+'\n')
          sys.exit(any(r['returncode'] for r in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round231-pins-${{ matrix.group }}
          path: results
          if-no-files-found: error
          retention-days: 14
