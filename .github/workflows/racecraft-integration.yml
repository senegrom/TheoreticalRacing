name: Validate racecraft integration on current champion
on:
  push:
    branches: [work/racecraft-integrate-20260912]
permissions:
  contents: read
concurrency:
  group: racecraft-integration-20260912
  cancel-in-progress: false
env:
  JAVA_TOOL_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''
  _JAVA_OPTIONS: ''
jobs:
  verify:
    name: Integrated racecraft JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d6412d6adf45fcf72cb5d2ee3af6446e2085e882
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Integrate exact prepared source without reverting round 237
        run: |
          git show "$GITHUB_SHA":.github/integrate-racecraft.sh > "$RUNNER_TEMP/integrate.sh"
          bash "$RUNNER_TEMP/integrate.sh"
      - name: Strict build and physical proof tests
        run: |
          sh run_tests.sh
          sh build_main.sh
          python tests/cross_era_referee_regression.py
      - name: Python and real policy-cohort contracts
        if: matrix.java == '25'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/promotion_pair_regression.py
          python tests/headless_smoke.py
          python tests/query_replay_regression.py
          python tests/lap_progress_regression.py
          python tests/selfplay_profile_regression.py
      - name: Unchanged current-master goldens and all champion pins
        if: matrix.java == '25'
        shell: bash
        run: |
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do echo "==> $test"; python "$test"; done
      - name: Assert source and golden inputs were preserved
        run: git diff --exit-code
  prepare:
    name: Prepare validated integration commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d6412d6adf45fcf72cb5d2ee3af6446e2085e882
          fetch-depth: 0
      - name: Commit exactly the validated source without helper files
        run: |
          git show "$GITHUB_SHA":.github/integrate-racecraft.sh > "$RUNNER_TEMP/integrate.sh"
          bash "$RUNNER_TEMP/integrate.sh"
          git commit -m 'Fix physical endgames and integrate bounded three-move racecraft' -m 'Preserve round 237 two-move champion and all its pins. Enumerate physical opponent replies, retain exact memo states and enforce projected timeouts in the older deep solver. Add the third-own-move proof only for selected real decisions, preserving shorter certificates.' -m 'The initial six full-course mirrored fleets completed 10080 races; their comparison was against the earlier one-move cohort, not the newly promoted champion. Keep the third move opt-in. Validate the exact combined source on JDK 25/26, all current goldens and champion pins, Python and real-JVM policy-cohort contracts. Retain original reports and checksums; no rules, maps, courses, user settings or golden expectations changed.'
          test "$(git rev-parse HEAD^)" = d6412d6adf45fcf72cb5d2ee3af6446e2085e882
          test "$(git rev-parse HEAD^{tree})" = e11b4bccaa2cab3852f691cc792581d5ca2a98c8
          git push origin HEAD:refs/heads/work/racecraft-integrate-20260912-prepared
          echo "Prepared commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
