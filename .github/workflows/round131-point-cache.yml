name: Round 131 exact point-containment cache

on:
  push:
    branches:
      - agent/ai-racing-speed-131-point-containment-cache
    paths:
      - .github/workflows/round131-point-cache.yml
      - tracks/round131_apply.py
      - tracks/round131_compare.py
      - tracks/round131_runtime.py
      - tracks/round131_publish.py

permissions:
  contents: write

concurrency:
  group: round131-point-containment-cache
  cancel-in-progress: true

env:
  ROUND131_BASE: cf709da7288c740e5594cb0418ab8c910ca72051

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish workflow run locator
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round131-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'status_at_locator': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round131-status.json
          git commit -m 'Round 131: record exact gate run' || exit 0
          git push

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build immutable baseline and candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          test "$BASE" = "$ROUND131_BASE"
          printf '%s\n' "$BASE" > round131-base-sha.txt
          git worktree add /tmp/round131-work "$BASE"
          cd /tmp/round131-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round131-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round131_apply.py"
          git diff --name-only | sort > /tmp/round131-changed.txt
          printf '%s\n' \
            'src/tr/logic/RaceGame.java' \
            'tests/tr/logic/CoreTests.java' \
            | sort > /tmp/round131-expected.txt
          diff -u /tmp/round131-expected.txt /tmp/round131-changed.txt
          test "$(grep -c 'final PointContainmentCache pointContainmentCache' src/tr/logic/RaceGame.java)" = 1
          test "$(grep -c 'testPointContainmentCache()' tests/tr/logic/CoreTests.java)" = 2
          git diff --check
          git diff -- src/tr/logic/RaceGame.java tests/tr/logic/CoreTests.java \
            > "$GITHUB_WORKSPACE/round131.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round131-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round131-build
          path: |
            round131-baseline.jar
            round131-candidate.jar
            round131-base-sha.txt
            round131.patch
          if-no-files-found: error
          retention-days: 30

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        track:
          - circle
          - triangle
          - curve
          - hairpin
          - chicane
          - sprint
          - bigoval
          - slalom
          - gear
          - coil
          - zigzag
          - the_long_loop
          - monaco
          - hungaroring
          - interlagos
          - lemans
          - spa
          - silverstone
          - monza
          - zandvoort
          - nurburgring
          - spielberg
          - serpentine
          - serpentine2
          - spiral
          - cog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round131-build
          path: .
      - name: Require exact byte identity
        env:
          TRACK: ${{ matrix.track }}
        shell: bash
        run: |
          set -euxo pipefail
          case "$TRACK" in
            serpentine|serpentine2|spiral|cog) END_SEED=50 ;;
            *) END_SEED=150 ;;
          esac
          python tracks/round131_compare.py \
            --baseline round131-baseline.jar \
            --candidate round131-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round131-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round131-result-${{ matrix.track }}
          path: round131-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round131-result-*
          path: round131-results
          merge-multiple: true
      - name: Enforce exact no-change policy
        id: gate
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = [json.loads(path.read_text())
                  for path in sorted(Path('round131-results').glob('*.json'))]
          summary = {
              'baseline_sha': 'cf709da7288c740e5594cb0418ab8c910ca72051',
              'candidate': 'exact_point_containment_cache',
              'tracks': len(rows),
              'pairs': sum(row['pairs'] for row in rows),
              'mismatches': sum(len(row['mismatches']) for row in rows),
              'byte_identical_tracks': sum(1 for row in rows if row['identical']),
              'runtime_ratios_from_exact_jobs': {
                  row['track']: row['runtime_ratio'] for row in rows
              },
          }
          summary['viable'] = (
              summary['tracks'] == 26
              and summary['pairs'] == 3500
              and summary['mismatches'] == 0
              and summary['byte_identical_tracks'] == 26
          )
          Path('round131-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if summary['viable'] else 'false'), file=out)
          assert summary['viable'], summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round131-summary
          path: round131-summary.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round131-build
          path: .
      - name: Measure alternating warm incremental speed
        shell: bash
        run: |
          set -euxo pipefail
          python tracks/round131_runtime.py \
            --baseline round131-baseline.jar \
            --candidate round131-candidate.jar \
            --pairs 3 --out round131-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: round131-runtime
          path: round131-runtime.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, summarize, runtime]
    if: needs.summarize.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round131-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round131-summary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round131-runtime
          path: .
      - name: Verify evidence and immutable parent
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          summary = json.load(open('round131-summary.json'))
          runtime = json.load(open('round131-runtime.json'))
          assert summary['baseline_sha'] == 'cf709da7288c740e5594cb0418ab8c910ca72051', summary
          assert summary['pairs'] == 3500 and summary['mismatches'] == 0 and summary['viable'], summary
          assert runtime['viable'] and runtime['aggregate_ratio'] <= 0.90, runtime
          PY
          EXPECTED=$(cat round131-base-sha.txt)
          test "$EXPECTED" = "$ROUND131_BASE"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
      - name: Materialize and replay production checkout
        shell: bash
        run: |
          set -euxo pipefail
          cp tracks/round131_apply.py /tmp/round131_apply.py
          cp tracks/round131_publish.py /tmp/round131_publish.py
          git checkout -B round131-production origin/master
          python /tmp/round131_apply.py
          git diff --name-only | sort > /tmp/round131-changed.txt
          printf '%s\n' \
            'src/tr/logic/RaceGame.java' \
            'tests/tr/logic/CoreTests.java' \
            | sort > /tmp/round131-expected.txt
          diff -u /tmp/round131-expected.txt /tmp/round131-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
          python /tmp/round131_publish.py
          git diff --check
          git diff --name-only | sort > /tmp/round131-final-changed.txt
          printf '%s\n' \
            'AI_DEVELOPMENT.md' \
            'racing-memory.md' \
            'src/tr/logic/RaceGame.java' \
            'tests/tr/logic/CoreTests.java' \
            | sort > /tmp/round131-final-expected.txt
          diff -u /tmp/round131-final-expected.txt /tmp/round131-final-changed.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_DEVELOPMENT.md racing-memory.md src/tr/logic/RaceGame.java tests/tr/logic/CoreTests.java
          git commit -m 'Round 131: cache exact point containment'
          git push origin HEAD:master
          LOCAL=$(git rev-parse HEAD)
          printf '%s\n' "$LOCAL" > round131-commit.txt
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$LOCAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round131-promotion-evidence
          path: |
            round131-summary.json
            round131-runtime.json
            round131.patch
            round131-commit.txt
          if-no-files-found: warn
          retention-days: 30
