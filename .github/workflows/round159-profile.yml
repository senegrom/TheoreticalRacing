name: Round 159 post-157 JFR profile

on:
  push:
    branches:
      - agent/ai-racing-speed-159-post157-profile
    paths:
      - .github/workflows/round159-profile.yml

permissions:
  contents: write

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record profile run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round159-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round159-status.json
          git commit -m 'Round 159: record profile run' || exit 0
          git push

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { track: monaco, seeds: '1-20' }
          - { track: zandvoort, seeds: '31-40' }
          - { track: sprint, seeds: '1-150' }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build current master
        shell: bash
        run: |
          git fetch origin master
          git checkout --detach origin/master
          sh ./run_tests.sh
          sh ./build_main.sh
      - name: Record JFR profile
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
          SEEDS: ${{ matrix.seeds }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=[]
          for line in Path('tracks/bench.properties').read_text().splitlines():
              if re.match(r'^player[1-8]Kind=', line):
                  line=line.split('=',1)[0]+'=AI2'
              lines.append(line)
          Path('round159.properties').write_text('\n'.join(lines)+'\n')
          PY
          mkdir -p round159-cache
          RACING_REACH_CACHE="$PWD/round159-cache" \
          java -Djava.awt.headless=true \
            -XX:StartFlightRecording="filename=round159-${TRACK}.jfr,settings=profile,dumponexit=true" \
            -jar theoreticRacing.jar --auto --track "$TRACK" \
            --props round159.properties --log "round159-${TRACK}.log" --seed "$SEEDS"
          jfr summary "round159-${TRACK}.jfr" > "round159-${TRACK}-summary.txt"
          jfr view hot-methods "round159-${TRACK}.jfr" > "round159-${TRACK}-hot-methods.txt" || true
          jfr view allocation-by-site "round159-${TRACK}.jfr" > "round159-${TRACK}-allocations.txt" || true
          jfr print --events jdk.ExecutionSample "round159-${TRACK}.jfr" > "round159-${TRACK}-samples.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round159-profile-${{ matrix.track }}
          path: |
            round159-${{ matrix.track }}.jfr
            round159-${{ matrix.track }}-summary.txt
            round159-${{ matrix.track }}-hot-methods.txt
            round159-${{ matrix.track }}-allocations.txt
            round159-${{ matrix.track }}-samples.txt
          if-no-files-found: error
          retention-days: 30
