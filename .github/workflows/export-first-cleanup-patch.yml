name: Export first correctness cleanup patch

on:
  push:
    branches:
      - agent/ai-racing-speed-78
    paths:
      - .github/workflows/export-first-cleanup-patch.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact cleanup commit
        run: |
          git show --format= --binary 3dca8292c8145af43e377036cd25d417c888eb17 > first-cleanup.patch
          git show --stat --oneline 3dca8292c8145af43e377036cd25d417c888eb17 > first-cleanup-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: first-correctness-cleanup-patch
          path: |
            first-cleanup.patch
            first-cleanup-stat.txt
          retention-days: 2
      - name: Remove temporary exporter
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/export-first-cleanup-patch.yml
          git commit -m "Remove temporary first-cleanup exporter"
          git push origin HEAD:agent/ai-racing-speed-78
