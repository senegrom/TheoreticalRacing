name: Round 96 field-certified finish frontier

on:
  push:
    branches:
      - agent/ai-racing-speed-96-scored-finish-frontier
    paths:
      - .github/workflows/round96-field-finish-frontier.yml

permissions:
  contents: read

jobs:
  targeted:
    name: Field-certified ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        track:
          - zigzag
          - the_long_loop
          - coil
          - gear
          - spa
          - silverstone
          - monaco
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply AI1-only field-certified finish frontier
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round96-field.patch
          printf '%s  %s\n' '4da0d7452a45b97f910838e68a58218e5e252b8e3f579fcfaf21aad8de9f188b' /tmp/round96-field.patch | sha256sum -c -
          git apply --check /tmp/round96-field.patch
          git apply /tmp/round96-field.patch
      - name: Verify and build
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
      - name: Compare AI1 candidate against champion AI2, seeds 1-15
        env:
          TRACK: ${{ matrix.track }}
        run: python tracks/bench_ai.py --seeds 15 "$TRACK" | tee "round96-field-${TRACK}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round96-field-${{ matrix.track }}
          path: round96-field-${{ matrix.track }}.txt
          if-no-files-found: error
