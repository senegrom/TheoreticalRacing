name: Round 110 Spa-11 Pareto diagnostic

on:
  push:
    branches:
      - agent/ai-racing-speed-110-pareto-field-proof
    paths:
      - .github/workflows/round110-spa11-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact baseline and diagnostic candidate
        run: |
          git fetch origin master
          git worktree add /tmp/round110-spa11 origin/master
          cd /tmp/round110-spa11
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round110_apply_pareto_field.py"
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/candidate.jar"
      - name: Replay Spa seed 11 with candidate diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('tracks/bench.properties').read_text()
          text = re.sub(r'^(player[1-8]Kind)=.*$', r'\1=AI1', text, flags=re.M)
          Path('AI1.properties').write_text(text)
          PY
          java -Djava.awt.headless=true -jar baseline.jar --auto --track spa \
            --props AI1.properties --log spa11-baseline.log --seed 11 \
            > spa11-baseline.stdout 2> spa11-baseline.stderr
          java -Djava.awt.headless=true -Dai.debug.djs=true -jar candidate.jar \
            --auto --track spa --props AI1.properties --log spa11-candidate.log \
            --seed 11 > spa11-candidate.stdout 2> spa11-candidate.stderr
      - name: Extract mechanism report
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          move_re = re.compile(r'^(\d+) p(\d+) ')

          def moves(path):
              return [line for line in Path(path).read_text().splitlines()
                      if move_re.match(line)]

          def result(path):
              counts = {}
              finish = {}
              crashes = []
              for line in Path(path).read_text().splitlines():
                  match = move_re.match(line)
                  if not match:
                      continue
                  player = int(match.group(2))
                  counts[player] = counts.get(player, 0) + 1
                  if 'FINISH' in line:
                      finish[player] = counts[player]
                  elif 'CRASH' in line:
                      crashes.append(player)
              return {
                  'finishes': finish,
                  'crashes': crashes,
                  'sum': sum(finish.values()),
                  'order': [p for p, _ in sorted(finish.items(),
                            key=lambda item: (item[1], item[0]))],
              }

          baseline = moves('spa11-baseline.log')
          candidate = moves('spa11-candidate.log')
          first = None
          for index in range(max(len(baseline), len(candidate))):
              left = baseline[index] if index < len(baseline) else None
              right = candidate[index] if index < len(candidate) else None
              if left != right:
                  first = {
                      'index': index,
                      'baseline': left,
                      'candidate': right,
                      'baseline_context': baseline[max(0, index-3):index+5],
                      'candidate_context': candidate[max(0, index-3):index+5],
                  }
                  break

          stderr = Path('spa11-candidate.stderr').read_text().splitlines()
          pareto = [line for line in stderr if 'AIDBG PARETO-FIELD' in line]
          field = [line for line in stderr if 'AIDBG FIELD-ACCEL' in line]
          report = {
              'case': 'spa-11',
              'baseline': result('spa11-baseline.log'),
              'candidate': result('spa11-candidate.log'),
              'first_difference': first,
              'pareto_events': pareto,
              'existing_field_events': field,
              'debug_event_count': len(stderr),
          }
          Path('round110-spa11-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-110-pareto-field-proof
          git add round110-spa11-diagnostic.json
          git commit -m 'Record Spa seed 11 Pareto counterexample'
          git push origin HEAD:agent/ai-racing-speed-110-pareto-field-proof
