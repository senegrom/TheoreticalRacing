name: Round 103 AI2 field-acceleration gate

on:
  push:
    branches:
      - agent/ai-racing-speed-103-ai2-field-gate
    paths:
      - .github/workflows/round103-ai2-field-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact AI2 baseline
        run: |
          sh ./build_main.sh
          cp theoreticRacing.jar round103-ai2-baseline.jar
      - name: Apply and mirror stable field acceleration
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/senegrom/TheoreticalRacing/agent/ai-racing-speed-101-guarded-field-v3/tracks/round101_guarded_field_v3.patch \
            -o /tmp/round103-field.patch
          printf '%s  %s\n' \
            2231c6bf5cd53469c33e83d2055e92e6f140f76562ce52e5fe644a4603da48be \
            /tmp/round103-field.patch | sha256sum -c -
          git apply --check /tmp/round103-field.patch
          git apply /tmp/round103-field.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tr/logic/RaceAi.java')
          source = path.read_text()

          anchor = '\tprivate final static int\t\tAI1_TRUE_CONFIRM_ROUNDS\t= 4;'
          assert source.count(anchor) == 1
          source = source.replace(
              anchor,
              anchor + '\n\tprivate final static int\t\tAI1_TRUE_CONFIRM_MIN_RIVALS\t= 4;'
              '\t// round 103: minimum confirmation roster',
              1,
          )
          chosen_old = '''\t\t\t\t\t\t\tsimFinishVanish, exactSelf, exactRivals, true, scorerSelf, true,\n\t\t\t\t\t\t\tscorerCap, null, null, null) < 0;'''
          chosen_new = '''\t\t\t\t\t\t\tsimFinishVanish, exactSelf, exactRivals, true, scorerSelf, true,\n\t\t\t\t\t\t\tMath.max(scorerCap, AI1_TRUE_CONFIRM_MIN_RIVALS), null, null, null) < 0;'''
          target_old = '''\t\t\t\t\t\t\tAI1_TRUE_CONFIRM_ROUNDS, simFinishVanish, exactSelf, exactRivals, true,\n\t\t\t\t\t\t\tscorerSelf, true, scorerCap, null, null, null) >= 0;'''
          target_new = '''\t\t\t\t\t\t\tAI1_TRUE_CONFIRM_ROUNDS, simFinishVanish, exactSelf, exactRivals, true,\n\t\t\t\t\t\t\tscorerSelf, true, Math.max(scorerCap, AI1_TRUE_CONFIRM_MIN_RIVALS),\n\t\t\t\t\t\t\tnull, null, null) >= 0;'''
          assert source.count(chosen_old) == 1
          assert source.count(target_old) == 1
          source = source.replace(chosen_old, chosen_new, 1).replace(target_old, target_new, 1)

          staged = ('\t\t\tchosen = stagedPaceOverride(pos, vel, playerNum, chosen, scoreByDir, scoreNSByDir,\n'
                    '\t\t\t\t\ttrapByDir, uncByDir, poTByDir);\n')
          guarded = ('\t\t\tchosen = guardedFieldPaceOverride(pos, vel, playerNum, chosen,\n'
                     '\t\t\t\t\ttrapByDir, uncByDir, poTByDir);\n')
          assert source.count(staged) == 2
          assert source.count(guarded) == 1
          second = source.rfind(staged) + len(staged)
          source = source[:second] + guarded + source[second:]
          assert source.count(guarded) == 2
          path.write_text(source)
          PY
      - name: Verify and build AI2 candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar round103-ai2-candidate.jar
          python tests/headless_smoke.py
          python - <<'PY'
          from pathlib import Path
          import sys, tempfile
          sys.path.insert(0, str(Path.cwd() / 'tracks'))
          import bench_ai
          with tempfile.TemporaryDirectory(prefix='round103-ai2-coil-') as directory:
              bench_ai.configure_runtime(directory)
              bench_ai.set_nplayers(8)
              bench_ai.set_all_to('AI2')
              result = bench_ai.run_track('coil', timeout=1200, seed=9)
          expected = (7, 0, [58, 59, 60, 61, 61, 62, 62])
          if result != expected:
              raise SystemExit(f'AI2 Coil seed-9 regression: {result}, expected {expected}')
          print('Round103AI2FieldRegression: OK')
          PY
          python -m compileall -q tracks tests
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: round103-ai2-jars
          path: |
            round103-ai2-baseline.jar
            round103-ai2-candidate.jar
          if-no-files-found: error
          retention-days: 3

  differential:
    needs: verify
    name: AI2 differential ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { track: circle, end: 100 }
          - { track: triangle, end: 100 }
          - { track: curve, end: 100 }
          - { track: hairpin, end: 100 }
          - { track: chicane, end: 100 }
          - { track: sprint, end: 100 }
          - { track: bigoval, end: 100 }
          - { track: slalom, end: 100 }
          - { track: gear, end: 100 }
          - { track: coil, end: 100 }
          - { track: zigzag, end: 100 }
          - { track: the_long_loop, end: 100 }
          - { track: monaco, end: 100 }
          - { track: hungaroring, end: 100 }
          - { track: interlagos, end: 100 }
          - { track: lemans, end: 100 }
          - { track: spa, end: 100 }
          - { track: silverstone, end: 100 }
          - { track: monza, end: 100 }
          - { track: zandvoort, end: 100 }
          - { track: nurburgring, end: 100 }
          - { track: spielberg, end: 100 }
          - { track: serpentine, end: 25 }
          - { track: serpentine2, end: 25 }
          - { track: spiral, end: 25 }
          - { track: cog, end: 25 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round103-ai2-jars
          path: .
      - name: Install exact parser
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/senegrom/TheoreticalRacing/agent/ai-racing-speed-101-guarded-field-v3/tracks/round101_compare_exact.py \
            -o tracks/round101_compare_exact.py
      - name: Compare exact AI2 baseline against candidate
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end }}
        run: |
          python tracks/round103_compare_kind.py \
            --baseline round103-ai2-baseline.jar \
            --candidate round103-ai2-candidate.jar \
            --kind AI2 --track "$TRACK" --end "$END_SEED" \
            --out "round103-ai2-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round103-ai2-result-${{ matrix.track }}
          path: round103-ai2-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round103-ai2-jars
          path: .
      - name: Alternating-order AI2 Coil benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, re, statistics, subprocess, tempfile, time
          root = Path.cwd()
          props_text = (root / 'tracks' / 'bench.properties').read_text()
          props_text = re.sub(r'^(player[1-8]Kind=).*$', r'\1AI2', props_text, flags=re.MULTILINE)
          cache = Path(os.environ['RUNNER_TEMP']) / 'round103-ai2-cache'
          cache.mkdir()
          def run(jar, label):
              with tempfile.TemporaryDirectory(prefix=f'r103-ai2-{label}-') as directory:
                  directory = Path(directory)
                  props = directory / 'bench.properties'
                  props.write_text(props_text)
                  log = directory / 'race.log'
                  env = os.environ.copy()
                  env['RACING_REACH_CACHE'] = str(cache)
                  started = time.perf_counter()
                  result = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar), '--auto',
                      '--track', 'coil', '--props', str(props), '--log', str(log), '--seed', '9'
                  ], cwd=root, env=env, text=True, capture_output=True, timeout=1200)
                  if result.returncode:
                      raise SystemExit(result.stderr[-4000:])
                  return time.perf_counter() - started
          run('round103-ai2-baseline.jar', 'warm-base')
          run('round103-ai2-candidate.jar', 'warm-cand')
          baseline, candidate = [], []
          for i in range(6):
              order = [('round103-ai2-baseline.jar', baseline, 'base'),
                       ('round103-ai2-candidate.jar', candidate, 'cand')]
              if i % 2:
                  order.reverse()
              for jar, bucket, label in order:
                  bucket.append(run(jar, label))
          report = {
              'baseline': baseline, 'candidate': candidate,
              'median_ratio': statistics.median(candidate) / statistics.median(baseline),
              'mean_ratio': statistics.fmean(candidate) / statistics.fmean(baseline),
          }
          Path('round103-ai2-runtime.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if report['median_ratio'] > 1.25 or report['mean_ratio'] > 1.25:
              raise SystemExit('AI2 runtime regression exceeds 25%')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round103-ai2-runtime
          path: round103-ai2-runtime.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    if: always()
    needs: [differential, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: round103-ai2-result-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: round103-ai2-runtime
          path: results
      - name: Aggregate AI2 verdict
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          summaries = [json.loads(path.read_text())
                       for path in sorted(Path('results').glob('round103-ai2-*.json'))
                       if path.name != 'round103-ai2-runtime.json']
          if len(summaries) != 26:
              raise SystemExit(f'expected 26 summaries, found {len(summaries)}')
          keys = ('pairs', 'identical', 'faster', 'slower', 'safety_gain',
                  'safety_regression', 'redistribution', 'net_moves')
          total = {key: sum(item[key] for item in summaries) for key in keys}
          events = [dict(track=item['track'], **event)
                    for item in summaries for event in item.get('events', [])]
          runtime = json.loads(Path('results/round103-ai2-runtime.json').read_text())
          report = {'total': total, 'events': events, 'runtime': runtime}
          Path('round103-ai2-summary.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if total['slower'] or total['safety_regression'] or total['redistribution']:
              raise SystemExit('AI2 candidate contains a regression')
          if total['faster'] + total['safety_gain'] < 1:
              raise SystemExit('AI2 candidate produced no verified improvement')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round103-ai2-summary
          path: round103-ai2-summary.json
          if-no-files-found: error
          retention-days: 90
