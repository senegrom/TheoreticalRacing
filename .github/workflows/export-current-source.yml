name: Export current source once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-current-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Package repository
        run: git archive --format=zip --output=/tmp/theoretical-racing-current.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: theoretical-racing-current-source
          path: /tmp/theoretical-racing-current.zip
          retention-days: 1

      - name: Remove one-off workflow
        run: |
          rm .github/workflows/export-current-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-off source export workflow'
          git push origin HEAD:master
