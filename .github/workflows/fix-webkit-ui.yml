name: Fix narrow WebKit UI
on:
  push:
    branches: [master]
    paths: ['.github/workflows/fix-webkit-ui.yml']
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Constrain Advanced setup and test mobile Install
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('web/app.css')
          s = css.read_text()
          marker = '/* WebKit narrow-form intrinsic-size guard. */'
          assert marker not in s
          block = (
              '\n\n/* WebKit narrow-form intrinsic-size guard. */\n'
              '#setup-form,\n'
              '#setup .setup-grid,\n'
              '#setup .setup-grid > section,\n'
              '.advanced-setup,\n'
              '.advanced-setup-body,\n'
              '.advanced-setup label {\n'
              '  min-width: 0;\n'
              '  max-width: 100%;\n'
              '}\n'
              '.advanced-setup { width: 100%; }\n'
              '#ai-start-policy {\n'
              '  width: 0;\n'
              '  min-width: 100%;\n'
              '  max-width: 100%;\n'
              '}\n'
          )
          css.write_text(s + block)

          test = Path('web/tests/browser_e2e.py')
          s = test.read_text()
          anchor = "def select_ai_start_policy(page, value):\n    # The policy selector intentionally lives in the collapsed Advanced setup.\n    # Open that disclosure before interacting with the real form control.\n    page.locator('.advanced-setup').evaluate('(element) => { element.open = true; }')\n    page.locator('#ai-start-policy').select_option(value)\n\n\n"
          helper = anchor + "def click_install(page):\n    # Desktop exposes Install directly; phone layouts intentionally move it\n    # into More. Exercise whichever real control is visible.\n    if page.locator('#install').is_visible():\n        page.locator('#install').click()\n    else:\n        page.locator('#header-more').evaluate('(element) => { element.open = true; }')\n        page.locator('#more-install').click()\n\n\n"
          assert s.count(anchor) == 1
          assert s.count("page.locator('#install').click()") == 1
          s = s.replace(anchor, helper)
          s = s.replace("page.locator('#install').click()", "click_install(page)")
          assert s.count('click_install(page)') == 2
          test.write_text(s)
          PY
          python3 -m py_compile web/tests/browser_e2e.py
          git diff --check
          rm .github/workflows/fix-webkit-ui.yml
          git add web/app.css web/tests/browser_e2e.py .github/workflows/fix-webkit-ui.yml
      - name: Commit without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'master advanced; refusing to overwrite'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(browser): fit advanced setup and mobile install on WebKit"
          git push origin HEAD:master
          curl --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/browser.yml/dispatches -d '{"ref":"master"}'
