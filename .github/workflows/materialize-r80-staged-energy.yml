name: Materialize Round 80 energy-capped rollout

on:
  push:
    branches: [agent/ai-racing-speed-80-staged-energy]
    paths:
      - .github/workflows/materialize-r80-staged-energy.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and apply the checksum-pinned patch
        shell: bash
        run: |
          set -euo pipefail
          echo '527794d5339b63350d63e911df74ef2a97cafe50cd9d690569d5999485ed570d  src/tr/logic/RaceAi.java' | sha256sum -c -
          echo 'f4364c5dad47eb108a2e2b34951ec4c9d10fc4d74e8de7fee278e789cd0d3980  .r80/staged-energy.patch' | sha256sum -c -
          git apply --check .r80/staged-energy.patch
          git apply .r80/staged-energy.patch
          echo 'ccfdfc9a21b9e0422180116cdfafd8b5e57f408f262cf3b7b637da7275f55998  src/tr/logic/RaceAi.java' | sha256sum -c -
          git diff --check
      - name: Verify source and deterministic boundaries
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
      - name: Commit only the verified candidate and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java tests/ai1_staged_pace_regression.py
          git rm .r80/staged-energy.patch .github/workflows/materialize-r80-staged-energy.yml
          git commit -m 'Round 80: cap staged pace by energy and uncertainty'
          git push origin HEAD:agent/ai-racing-speed-80-staged-energy
