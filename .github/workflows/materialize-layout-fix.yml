name: Preserve tested layout and startup objects
on:
  push:
    branches: [master]
    paths: [.github/workflows/materialize-layout-fix.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 004fe9146342c8afaca7616dac4d76ae585a96c9
          persist-credentials: false
      - name: Verify and store source objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          chunks = ['95948d9f57d72f3bcc8155a3a3b727908d0e8375', '7cf17cb69ccf1290aea24f1627945703c86a9f5c', 'a285e7f5b9fb9876358d72500004bc3a3cb28e35', '21fcf7b42aaa9f91f2efa82f8c53d60a5ddecd0e']
          parts = []
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(root + 'blobs/' + sha, headers=headers), timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              parts.append(raw)
          patch = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == 'effe72b03ad350501e2eb711dae349ef180119667603bb4837c6b02daf28233a'
          pathlib.Path('/tmp/layout.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '/tmp/layout.patch'], check=True)
          expected = '1f8275000c93cbba2bf7eb7ffa92c43d52121ced'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          entries = []
          for name in subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines():
              assert name.startswith('web/') and '..' not in pathlib.PurePosixPath(name).parts
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append(dict(path=name, mode=mode, type='blob', content=pathlib.Path(name).read_text()))
          request = urllib.request.Request(root + 'trees', method='POST', headers=headers, data=json.dumps(dict(base_tree='dfbb270a6f95505a7ed077d21d52e81d75c393f1', tree=entries)).encode())
          with urllib.request.urlopen(request, timeout=60) as response:
              stored = json.load(response)['sha']
          assert stored == expected, stored
          pathlib.Path('layout-source-tree.json').write_text(json.dumps(dict(base='004fe9146342c8afaca7616dac4d76ae585a96c9', tree=stored, patch_sha256=hashlib.sha256(patch).hexdigest(), files=[e['path'] for e in entries]), indent=2))
          print('Verified tested source tree:', stored)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tested-layout-source-tree
          path: layout-source-tree.json
          retention-days: 7
