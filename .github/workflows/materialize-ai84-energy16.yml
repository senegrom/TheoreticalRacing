name: Materialize AI84 energy candidate

on:
  push:
    branches:
      - agent/ai-racing-speed-84
    paths:
      - .github/workflows/materialize-ai84-energy16.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact energy-cap experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tr/logic/RaceAi.java')
          text = path.read_text()
          old = 'private final static int\t\tAI1_STAGED_MAX_SPEED2_GAIN\t= 9;'
          new = 'private final static int\t\tAI1_STAGED_MAX_SPEED2_GAIN\t= 16;'
          if text.count(old) != 1:
              raise SystemExit('expected exact Round 83 energy constant once')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/materialize-ai84-energy16.yml
          git diff --check
      - name: Verify candidate before commit
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
          python -m unittest discover -s tests -p 'test_*.py'
          sh -n build_main.sh run_tests.sh run_golden_tests.sh
      - name: Commit verified experiment
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java .github/workflows/materialize-ai84-energy16.yml
          git commit -m 'Round 84: widen certified staged energy'
          git push origin HEAD:agent/ai-racing-speed-84
