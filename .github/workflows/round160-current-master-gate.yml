name: Round 160 direct blocked-bitset current-master gate

on:
  push:
    branches:
      - agent/ai-racing-speed-160-direct-blocked-bitset
    paths:
      - .github/workflows/round160-current-master-gate.yml

permissions:
  contents: write

concurrency:
  group: round160-direct-bitset-current-master-gate
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record exhaustive run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round160-gate-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round160-gate-status.json
          git commit -m 'Round 160: record exhaustive gate run' || exit 0
          git push

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build immutable current-master pair
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round160-base-sha.txt
          git worktree add /tmp/round160-gate "$BASE"
          cd /tmp/round160-gate
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round160-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round160_apply.py"
          git diff --name-only | sort > /tmp/round160-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceAi.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round160-expected.txt
          diff -u /tmp/round160-expected.txt /tmp/round160-changed.txt
          test "$(grep -c 'final long\[\] direct = search.blockedBits' src/tr/logic/RaceAi.java)" = 1
          test "$(grep -c 'private static void testDirectBlockedLookup()' tests/tr/logic/CoreTests.java)" = 1
          git diff --check
          git diff -- \
            src/tr/logic/RaceAi.java \
            tests/tr/logic/CoreTests.java \
            > "$GITHUB_WORKSPACE/round160.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round160-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round160-build
          path: |
            round160-baseline.jar
            round160-candidate.jar
            round160-base-sha.txt
            round160.patch
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round160-build
          path: .
      - name: Reconfirm seven-pair dual-order batch speed
        id: gate
        shell: bash
        run: |
          python tracks/round160_runtime.py \
            --baseline round160-baseline.jar \
            --candidate round160-candidate.jar \
            --pairs 7 --aggregate-limit 0.95 --case-limit 1.05 \
            --out round160-runtime.json
          python - <<'PY'
          import json, os
          result = json.load(open('round160-runtime.json'))
          viable = bool(result.get('viable'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if viable else 'false'), file=out)
          assert viable, result
          assert result['aggregate_ratio'] <= 0.95, result
          assert all(row['ratio'] <= 1.05 for row in result['cases']), result
          assert all(row['byte_identical'] for row in result['cases']), result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round160-runtime
          path: round160-runtime.json
          if-no-files-found: error
          retention-days: 30

  differential:
    needs: [prepare, runtime]
    if: needs.runtime.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        track:
          - circle
          - triangle
          - curve
          - hairpin
          - chicane
          - sprint
          - bigoval
          - slalom
          - gear
          - coil
          - zigzag
          - the_long_loop
          - monaco
          - hungaroring
          - interlagos
          - lemans
          - spa
          - silverstone
          - monza
          - zandvoort
          - nurburgring
          - spielberg
          - serpentine
          - serpentine2
          - spiral
          - cog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round160-build
          path: .
      - name: Require exact byte identity
        env:
          TRACK: ${{ matrix.track }}
        shell: bash
        run: |
          set -euxo pipefail
          case "$TRACK" in
            serpentine|serpentine2|spiral|cog) END_SEED=50 ;;
            *) END_SEED=150 ;;
          esac
          python tracks/round160_compare.py \
            --baseline round160-baseline.jar \
            --candidate round160-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round160-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round160-result-${{ matrix.track }}
          path: round160-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: [runtime, differential]
    if: needs.runtime.outputs.viable == 'true'
    runs-on: ubuntu-latest
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round160-build
          path: round160-build
      - uses: actions/download-artifact@v4
        with:
          pattern: round160-result-*
          path: round160-results
          merge-multiple: true
      - name: Enforce exact no-change policy
        id: gate
        shell: bash
        run: |
          set -euxo pipefail
          cp round160-build/round160-base-sha.txt .
          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = [
              json.loads(path.read_text())
              for path in sorted(Path('round160-results').glob('*.json'))
          ]
          summary = {
              'baseline_sha': Path('round160-base-sha.txt').read_text().strip(),
              'candidate': 'direct_blocked_bitsets',
              'tracks': len(rows),
              'pairs': sum(row['pairs'] for row in rows),
              'mismatches': sum(len(row['mismatches']) for row in rows),
              'byte_identical_tracks': sum(1 for row in rows if row['identical']),
              'runtime_ratios_from_exact_jobs': {
                  row['track']: row['runtime_ratio'] for row in rows
              },
          }
          summary['viable'] = (
              summary['tracks'] == 26
              and summary['pairs'] == 3500
              and summary['mismatches'] == 0
              and summary['byte_identical_tracks'] == 26
          )
          Path('round160-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if summary['viable'] else 'false'), file=out)
          assert summary['viable'], summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round160-summary
          path: round160-summary.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, runtime, summarize]
    if: needs.runtime.outputs.viable == 'true' && needs.summarize.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round160-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round160-summary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round160-runtime
          path: .
      - name: Verify evidence and immutable parent
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('round160-base-sha.txt').read_text().strip()
          summary = json.load(open('round160-summary.json'))
          runtime = json.load(open('round160-runtime.json'))
          assert summary['baseline_sha'] == base, summary
          assert summary['candidate'] == 'direct_blocked_bitsets', summary
          assert summary['pairs'] == 3500 and summary['mismatches'] == 0, summary
          assert summary['byte_identical_tracks'] == 26 and summary['viable'], summary
          assert runtime['aggregate_ratio'] <= 0.95 and runtime['viable'], runtime
          assert all(
              row['ratio'] <= 1.05 and row['byte_identical']
              for row in runtime['cases']
          ), runtime
          PY
          EXPECTED=$(cat round160-base-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
      - name: Materialize and replay clean production checkout
        shell: bash
        run: |
          set -euxo pipefail
          cp tracks/round160_apply.py /tmp/round160_apply.py
          cp tracks/round160_publish.py /tmp/round160_publish.py
          BASE=$(cat round160-base-sha.txt)
          git checkout -B round160-production "$BASE"
          python /tmp/round160_apply.py
          git diff --name-only | sort > /tmp/round160-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceAi.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round160-expected.txt
          diff -u /tmp/round160-expected.txt /tmp/round160-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
          python /tmp/round160_publish.py
          git diff --check
          git diff --name-only | sort > /tmp/round160-final-changed.txt
          printf '%s\n' \
            AI_DEVELOPMENT.md \
            racing-memory.md \
            src/tr/logic/RaceAi.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round160-final-expected.txt
          diff -u /tmp/round160-final-expected.txt /tmp/round160-final-changed.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            AI_DEVELOPMENT.md \
            racing-memory.md \
            src/tr/logic/RaceAi.java \
            tests/tr/logic/CoreTests.java
          git commit -m 'Round 160: use direct blocked-cell bitsets in mobility search'
          git push origin HEAD:master
          LOCAL=$(git rev-parse HEAD)
          printf '%s\n' "$LOCAL" > round160-commit.txt
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$LOCAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round160-promotion-evidence
          path: |
            round160-summary.json
            round160-runtime.json
            round160.patch
            round160-base-sha.txt
            round160-commit.txt
          if-no-files-found: warn
          retention-days: 30
