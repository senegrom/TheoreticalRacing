name: Round 145 combined exact speed screen

on:
  push:
    branches:
      - agent/ai-racing-speed-145-combined-screen
    paths:
      - .github/workflows/round145-combined-screen.yml
      - tracks/round145_bloom_apply.py
      - tracks/round145_hash_apply.py
      - tracks/round145_runtime.py

permissions:
  contents: write

concurrency:
  group: round145-combined-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round145-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round145-status.json
          git commit -m 'Round 145: record combined screen run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [bloom, hash]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master baseline and exact candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > "round145-${VARIANT}-base-sha.txt"
          git worktree add "/tmp/round145-${VARIANT}" "$BASE"
          cd "/tmp/round145-${VARIANT}"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round145-${VARIANT}-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round145_${VARIANT}_apply.py"
          git diff --name-only | sort > /tmp/round145-changed.txt
          printf '%s\n' src/tr/logic/RaceAi.java src/tr/logic/RaceGame.java src/tr/logic/TrackGeometry.java | sort > /tmp/round145-expected.txt
          diff -u /tmp/round145-expected.txt /tmp/round145-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round145-${VARIANT}-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Run five-pair dual-order warm screen
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python tracks/round145_runtime.py \
            --baseline "round145-${VARIANT}-baseline.jar" \
            --candidate "round145-${VARIANT}-candidate.jar" \
            --variant "$VARIANT" --pairs 5 \
            --out "round145-${VARIANT}-runtime.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round145-${{ matrix.variant }}-screen
          path: |
            round145-${{ matrix.variant }}-base-sha.txt
            round145-${{ matrix.variant }}-runtime.json
          if-no-files-found: warn
          retention-days: 30
