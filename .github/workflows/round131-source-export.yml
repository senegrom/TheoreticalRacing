name: Round 131 exact champion export

on:
  push:
    branches:
      - agent/ai-racing-speed-131-point-containment-cache
    paths:
      - .github/workflows/round131-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Export and build immutable Round 130 parent
        shell: bash
        run: |
          set -euxo pipefail
          parent=cf709da7288c740e5594cb0418ab8c910ca72051
          git merge-base --is-ancestor "$parent" HEAD
          mkdir -p export
          git archive --format=tar.gz --output=export/round131-master-source.tar.gz "$parent"
          printf '%s\n' "$parent" > export/parent.sha
          git worktree add --detach baseline "$parent"
          cd baseline
          chmod +x build_main.sh
          ./build_main.sh
          test -s theoreticRacing.jar
          cp theoreticRacing.jar ../export/round131-master-jdk25.jar
      - uses: actions/upload-artifact@v4
        with:
          name: round131-master-export
          path: export/
          if-no-files-found: error
          retention-days: 14
      - name: Publish run locator
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round131-export-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'status_at_locator': os.environ['RUN_STATUS'],
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round131-export-status.json
          git commit -m "Round 131: record source export run" || exit 0
          git push
