name: Round 153 exact finish-side reject screen

on:
  push:
    branches:
      - agent/ai-racing-speed-153-finish-side-reject
    paths:
      - .github/workflows/round153-finish-side-screen.yml
      - tracks/round153_apply.py
      - tracks/round153_runtime.py

permissions:
  contents: write

concurrency:
  group: round153-finish-side-reject
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round153-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round153-status.json
          git commit -m 'Round 153: record finish-side screen run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round153-base-sha.txt
          git worktree add /tmp/round153-work "$BASE"
          cd /tmp/round153-work
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round153-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round153_apply.py"
          git diff --name-only | sort > /tmp/round153-changed.txt
          printf '%s\n' src/tr/logic/RaceGame.java tests/tr/logic/CoreTests.java | sort > /tmp/round153-expected.txt
          diff -u /tmp/round153-expected.txt /tmp/round153-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round153-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Run five-pair dual-order warm screen
        shell: bash
        run: |
          python tracks/round153_runtime.py \
            --baseline round153-baseline.jar \
            --candidate round153-candidate.jar \
            --pairs 5 --out round153-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round153-finish-side-screen
          path: |
            round153-base-sha.txt
            round153-runtime.json
          if-no-files-found: warn
          retention-days: 30
