name: Round 118 exact-seven-ahead acceleration census

on:
  push:
    branches:
      - agent/ai-racing-speed-118-seven-ahead-screen
    paths:
      - .github/workflows/round118-seven-ahead-screen.yml
      - tracks/round118_apply.py
      - tracks/round118_compare.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round118-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round118-run-id.txt
          git commit -m 'Record Round 118 census run'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Build exact champion and census candidate
        run: |
          BASE=261b71735a1d413527e68a829111a10d51a363b3
          git cat-file -e "$BASE^{commit}"
          printf '%s\n' "$BASE" > round118-base-sha.txt
          git worktree add /tmp/round118 "$BASE"
          cd /tmp/round118
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round118-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round118_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'sevenAheadFrontier' src/tr/logic/RaceAi.java)" = 4
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round118-candidate.jar"
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round118.patch"
      - name: Run permanent regression suite
        working-directory: /tmp/round118
        run: |
          for test in \
            tests/headless_smoke.py \
            tests/golden_races.py \
            tests/ai1_pace_regression.py \
            tests/ai1_mixed_safety_regression.py \
            tests/ai1_field_neutral_regression.py \
            tests/ai1_staged_pace_regression.py \
            tests/ai1_energy_pace_regression.py \
            tests/ai1_cross_model_pace_regression.py \
            tests/ai1_finish_frontier_regression.py \
            tests/ai1_thread_fragility_regression.py \
            tests/ai1_esc_true_confirm_regression.py \
            tests/ai1_graduated_field_accel_regression.py \
            tests/ai1_six_ahead_accel_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round118-build
          path: |
            round118-baseline.jar
            round118-candidate.jar
            round118-base-sha.txt
            round118.patch
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { track: circle, end_seed: 150 }
          - { track: triangle, end_seed: 150 }
          - { track: curve, end_seed: 150 }
          - { track: hairpin, end_seed: 150 }
          - { track: chicane, end_seed: 150 }
          - { track: sprint, end_seed: 150 }
          - { track: bigoval, end_seed: 150 }
          - { track: slalom, end_seed: 150 }
          - { track: gear, end_seed: 150 }
          - { track: coil, end_seed: 150 }
          - { track: zigzag, end_seed: 150 }
          - { track: the_long_loop, end_seed: 150 }
          - { track: monaco, end_seed: 150 }
          - { track: hungaroring, end_seed: 150 }
          - { track: interlagos, end_seed: 150 }
          - { track: lemans, end_seed: 150 }
          - { track: spa, end_seed: 150 }
          - { track: silverstone, end_seed: 150 }
          - { track: monza, end_seed: 150 }
          - { track: zandvoort, end_seed: 150 }
          - { track: nurburgring, end_seed: 150 }
          - { track: spielberg, end_seed: 150 }
          - { track: serpentine, end_seed: 50 }
          - { track: serpentine2, end_seed: 50 }
          - { track: spiral, end_seed: 50 }
          - { track: cog, end_seed: 50 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round118-build
          path: .
      - name: Compare exact seeded outcomes
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end_seed }}
        run: |
          python tracks/round118_compare.py \
            --baseline round118-baseline.jar \
            --candidate round118-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round118-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round118-result-${{ matrix.track }}
          path: round118-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round118-result-*
          path: round118-results
          merge-multiple: true
      - name: Aggregate exact census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': '261b71735a1d413527e68a829111a10d51a363b3',
              'candidate': 'broad_exact_seven_ahead_high_energy',
              'pairs': 0,
              'counts': {},
              'net_moves': 0,
              'events': [],
              'runtime_ratios': {},
          }
          for path in sorted(Path('round118-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          assert summary['pairs'] == 3500, summary
          Path('round118-seven-ahead-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round118-summary
          path: round118-seven-ahead-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish census summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add round118-seven-ahead-summary.json
          git commit -m 'Record Round 118 seven-ahead census'
          git push origin HEAD:"$GITHUB_REF_NAME"
