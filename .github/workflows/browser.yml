name: Browser app
on:
  push:
    branches: [browser]
  pull_request:
    branches: [browser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive corresponding source
        run: git archive --format=tar.gz --output=/tmp/browser-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: browser-source
          path: /tmp/browser-source.tar.gz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original core tests
        run: sh run_tests.sh
      - name: Build the same engine for browsers
        run: sh web/build.sh
      - name: Complete native parity and existing goldens
        run: python3 web/tests/parity.py
      - name: HTTP byte-range transport
        run: python3 web/tests/server_test.py
      - name: Publishing transport contracts
        run: python3 -m unittest discover -s web/tests -p 'test_*.py'
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: browser-webapp
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-native-parity
          path: web/build/parity/
          retention-days: 7
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sh web/build.sh
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Real browser JVM golden race and UI
        run: python3 web/tests/browser_e2e.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence
          path: web/build/browser-tests/
          retention-days: 7
  publish:
    name: Publish GitHub Pages
    needs: [parity, browsers]
    if: github.ref == 'refs/heads/browser' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: browser-webapp
          path: site
      - name: Publish the verified build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web/scripts/publish_pages.py site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-publication
          path: pages-publication.json
          if-no-files-found: error
      - name: Install live-site test browser
        if: steps.publish.outputs.published == 'true'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify gameplay on the public site
        if: steps.publish.outputs.published == 'true'
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: python3 web/tests/browser_e2e.py --browser chromium --url "$PAGE_URL"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outputs.published == 'true'
        with:
          name: live-pages-evidence
          path: web/build/browser-tests/
          retention-days: 7
