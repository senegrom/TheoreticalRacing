name: Browser app
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - '*.sh'
      - '.gitattributes'
      - '.gitignore'
      - '.github/dependabot.yml'
      - 'tracks/*.track'
      - 'LICENSE'
      - '.github/workflows/browser.yml'
  pull_request:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - '*.sh'
      - '.gitattributes'
      - '.gitignore'
      - '.github/dependabot.yml'
      - 'tracks/*.track'
      - 'LICENSE'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive corresponding source
        run: git archive --format=tar.gz --output=/tmp/browser-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: browser-source
          path: /tmp/browser-source.tar.gz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Original core tests
        run: sh run_tests.sh
      - name: Install icon build dependencies
        run: python3 -m pip install -r web/requirements-icons.txt
      - name: Build the same engine for browsers
        run: sh web/build.sh
      - name: Complete native parity and existing goldens
        run: python3 web/tests/parity.py
      - name: HTTP byte-range transport
        run: python3 web/tests/server_test.py
      - name: Publishing transport contracts
        run: python3 -m unittest discover -s web/tests -p 'test_*.py'
      - name: Non-destructive engine watchdog tests
        run: node --test web/tests/engine.test.mjs
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: browser-webapp
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-native-parity
          path: web/build/parity/
          retention-days: 7
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install icon build dependencies
        run: python3 -m pip install -r web/requirements-icons.txt
      - run: sh web/build.sh
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Worker responsiveness and cancellation
        run: python3 web/tests/worker_e2e.py --browser ${{ matrix.browser }}
      - name: UI interaction and layout regressions
        if: ${{ !cancelled() }}
        run: python3 web/tests/ui_e2e.py --browser ${{ matrix.browser }}
      - name: Real browser JVM golden race and UI
        if: ${{ !cancelled() }}
        run: python3 web/tests/browser_e2e.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence
          path: web/build/browser-tests/
          retention-days: 7
  publish:
    name: Publish GitHub Pages
    needs: [parity, browsers]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Empty the publication staging directory
        run: |
          rm -rf -- "$RUNNER_TEMP/racing-pages"
          mkdir -p "$RUNNER_TEMP/racing-pages"
      - uses: actions/download-artifact@v4
        with:
          name: browser-webapp
          path: ${{ runner.temp }}/racing-pages
      - name: Verify the entire tested artifact and attach matching source
        run: python3 web/scripts/site_artifact.py prepare "$RUNNER_TEMP/racing-pages" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/racing-pages
      - name: Refuse superseded workflow reruns
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web/scripts/deployment_guard.py --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.allowed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Install live-site test browser
        if: steps.current.outputs.allowed == 'true'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify gameplay on the public site
        if: steps.current.outputs.allowed == 'true'
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 web/tests/browser_e2e.py --browser chromium --url "$PAGE_URL" --expected-sha "$GITHUB_SHA" --expected-repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-evidence
          path: web/build/browser-tests/
          retention-days: 7
