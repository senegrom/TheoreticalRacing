name: Browser app
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive corresponding source
        run: git archive --format=tar.gz --output=/tmp/browser-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: browser-source
          path: /tmp/browser-source.tar.gz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install icon build dependencies
        run: python3 -m pip install -r web/requirements-icons.txt
      - name: Build the same engine for browsers
        run: sh web/build.sh
      - name: Complete native parity and existing goldens
        run: python3 web/tests/parity.py
      - name: HTTP byte-range transport
        run: python3 web/tests/server_test.py
      - name: Publishing transport contracts
        run: python3 -m unittest discover -s web/tests -p 'test_*.py'
      - name: Non-destructive engine watchdog tests
        run: node --test web/tests/engine.test.mjs
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: browser-webapp
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-native-parity
          path: web/build/parity/
          retention-days: 7
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install icon build dependencies
        run: python3 -m pip install -r web/requirements-icons.txt
      - run: sh web/build.sh
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Worker responsiveness and cancellation
        run: python3 web/tests/worker_e2e.py --browser ${{ matrix.browser }}
      - name: UI interaction and layout regressions
        if: ${{ !cancelled() }}
        run: python3 web/tests/ui_e2e.py --browser ${{ matrix.browser }}
      - name: Real browser JVM golden race and UI
        if: ${{ !cancelled() }}
        run: python3 web/tests/browser_e2e.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence
          path: web/build/browser-tests/
          retention-days: 7
