name: Browser app
on:
  push:
    branches: [browser]
  pull_request:
    branches: [browser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original core tests
        run: sh run_tests.sh
      - name: Build the same engine for browsers
        run: sh web/build.sh
      - name: Complete native parity and existing goldens
        run: python3 web/tests/parity.py
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: browser-webapp
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-native-parity
          path: web/build/parity/
          retention-days: 7
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sh web/build.sh
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Real browser JVM golden race and UI
        run: python3 web/tests/browser_e2e.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence
          path: web/build/browser-tests/
          retention-days: 7
