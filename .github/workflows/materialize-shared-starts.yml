name: Preserve shared starting analysis
on:
  push:
    branches: [master]
    paths: ['.github/workflows/materialize-shared-starts.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abdfb4bd6c02674ad7b7599e53b20a829ee0bde7
          persist-credentials: false
      - name: Preserve hash-verified source without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'bf83165e4dee49b04584fcb4ed5c290207eec6b888b25f681e56914917d8b06c'
          pathlib.Path('/tmp/shared-starts.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '/tmp/shared-starts.patch'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'b7db574df34214f504d4e0802638a422979724f0', tree
          entries = []
          for name in subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines():
              assert name.startswith(('src/', 'tests/', 'web/')) and '..' not in pathlib.PurePosixPath(name).parts
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append(dict(path=name, mode=mode, type='blob', content=pathlib.Path(name).read_text()))
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          request = urllib.request.Request('https://api.github.com/repos/senegrom/TheoreticalRacing/git/trees', method='POST', headers=headers,
              data=json.dumps(dict(base_tree='14f70c522f307dddf05c823f38253ed716da73e5', tree=entries)).encode())
          with urllib.request.urlopen(request, timeout=60) as response:
              stored = json.load(response)['sha']
          assert stored == tree
          print('Preserved exact source tree:', tree)
          PY
