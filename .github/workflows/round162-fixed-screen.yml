name: Round 162 repaired shared point-containment screen

on:
  push:
    branches:
      - agent/ai-racing-speed-162-shared-point-containment
    paths:
      - .github/workflows/round162-fixed-screen.yml

permissions:
  contents: write

concurrency:
  group: round162-shared-point-containment-fixed-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record repaired screen run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round162-fixed-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'screen-started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round162-fixed-status.json
          git commit -m 'Round 162: record repaired screen run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round162-base-sha.txt
          git worktree add /tmp/round162-fixed "$BASE"
          cd /tmp/round162-fixed
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round162-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round162_apply_fixed.py"
          git diff --name-only | sort > /tmp/round162-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceGame.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round162-expected.txt
          diff -u /tmp/round162-expected.txt /tmp/round162-changed.txt
          test "$(grep -c 'PointContainmentCache.shared(' src/tr/logic/RaceGame.java)" = 1
          test "$(grep -c 'private static void testSharedPointContainmentCache()' tests/tr/logic/CoreTests.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round162-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Measure seven-pair dual-order warm speed
        shell: bash
        run: |
          set +e
          python tracks/round162_runtime.py \
            --baseline round162-baseline.jar \
            --candidate round162-candidate.jar \
            --pairs 7 --aggregate-limit 0.95 --case-limit 1.05 \
            --out round162-runtime.json
          RC=$?
          set -e
          test -s round162-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round162-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          if [ "$RC" -ne 0 ]; then
            echo 'Round 162 did not clear the five-percent aggregate threshold.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round162-shared-point-fixed-screen
          path: |
            round162-base-sha.txt
            round162-runtime.json
          if-no-files-found: warn
          retention-days: 30
