name: Validate integrated repairs and measured corpus
on:
  push:
    branches: [work/master-fixes-20260915-final-validation]
permissions:
  contents: read
concurrency:
  group: master-corpus-validation-20260915
  cancel-in-progress: false
env:
  JAVA_TOOL_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''
  _JAVA_OPTIONS: ''
jobs:
  correctness:
    name: Final source JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 094f242214b7bc5176a2a236df8bb1cac4d04b86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact integrated source and measured expectations
        run: |
          git show "$GITHUB_SHA":.github/prepare-master-corpus-20260915.sh > "$RUNNER_TEMP/prepare.sh"
          bash "$RUNNER_TEMP/prepare.sh"
          mkdir evidence
      - name: Strict build and all Java correctness contracts
        shell: bash
        run: |
          set -o pipefail
          sh run_tests.sh 2>&1 | tee evidence/java.txt
          sh build_main.sh 2>&1 | tee evidence/build.txt
          sha256sum theoreticRacing.jar | tee evidence/jar.sha256
          python tests/cross_era_referee_regression.py 2>&1 | tee evidence/referee.txt
          python tests/query_replay_regression.py 2>&1 | tee evidence/replay.txt
      - name: Reference JDK binary identity and complete CLI contracts
        if: matrix.java == '25'
        shell: bash
        run: |
          set -o pipefail
          echo 'ac8e0b77eb01b5c791435a6a444cde2dac97067862b26f73366026f5590e515e  theoreticRacing.jar' | sha256sum -c -
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee evidence/python.txt
          python tests/headless_smoke.py 2>&1 | tee evidence/headless.txt
          python tests/lap_progress_regression.py 2>&1 | tee evidence/lap-progress.txt
          python tests/selfplay_profile_regression.py 2>&1 | tee evidence/profile.txt
          python tests/promotion_pair_regression.py 2>&1 | tee evidence/cohorts.txt
      - name: Source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bfix-final-correctness-${{ matrix.java }}
          path: evidence/
          retention-days: 14
  corpus:
    name: All 12 goldens and all 24 champion scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 094f242214b7bc5176a2a236df8bb1cac4d04b86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reconstruct the checksum-bound source tree
        run: |
          git show "$GITHUB_SHA":.github/prepare-master-corpus-20260915.sh > "$RUNNER_TEMP/prepare.sh"
          bash "$RUNNER_TEMP/prepare.sh"
          sh build_main.sh
          mkdir evidence
      - name: Normal strict golden and champion regressions
        shell: bash
        run: |
          set -o pipefail
          python tests/golden_races.py 2>&1 | tee evidence/goldens.txt
          count=0
          for script in tests/ai1_*_regression.py; do
            echo "==> $script"
            python "$script" 2>&1 | tee "evidence/$(basename "$script" .py).txt"
            count=$((count + 1))
          done
          test "$count" = 24
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bfix-final-corpus
          path: evidence/
          retention-days: 30
  parity:
    name: Complete native browser parity and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 094f242214b7bc5176a2a236df8bb1cac4d04b86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reconstruct identical tested source
        run: |
          git show "$GITHUB_SHA":.github/prepare-master-corpus-20260915.sh > "$RUNNER_TEMP/prepare.sh"
          bash "$RUNNER_TEMP/prepare.sh"
          mkdir evidence
      - name: All browser adapter and transport contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r web/requirements-icons.txt
          sh web/build.sh
          python web/tests/parity.py 2>&1 | tee evidence/parity.txt
          python web/tests/server_test.py 2>&1 | tee evidence/ranges.txt
          python -m unittest discover -s web/tests -p 'test_*.py' 2>&1 | tee evidence/tooling.txt
          node --test web/tests/engine.test.mjs 2>&1 | tee evidence/worker.txt
          for f in web/*.js; do node --check "$f"; done
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bfix-final-native-parity
          path: |
            evidence/
            web/build/parity/
          retention-days: 14
  browsers:
    name: Real browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 094f242214b7bc5176a2a236df8bb1cac4d04b86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reconstruct identical tested source
        run: |
          git show "$GITHUB_SHA":.github/prepare-master-corpus-20260915.sh > "$RUNNER_TEMP/prepare.sh"
          bash "$RUNNER_TEMP/prepare.sh"
      - name: Build and install browser
        run: |
          python -m pip install -r web/requirements-icons.txt
          sh web/build.sh
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Worker responsiveness and cancellation
        run: python web/tests/worker_e2e.py --browser ${{ matrix.browser }}
      - name: UI interaction and layout
        if: ${{ !cancelled() }}
        run: python web/tests/ui_e2e.py --browser ${{ matrix.browser }}
      - name: Real browser JVM races
        if: ${{ !cancelled() }}
        run: python web/tests/browser_e2e.py --browser ${{ matrix.browser }}
      - name: Source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bfix-final-browser-${{ matrix.browser }}
          path: web/build/browser-tests/
          retention-days: 14
  prepare:
    name: Prepare clean tested source without publishing master
    needs: [correctness, corpus, parity, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 094f242214b7bc5176a2a236df8bb1cac4d04b86
          fetch-depth: 0
      - name: Preserve exact test tree and repair ancestry
        shell: bash
        run: |
          git show "$GITHUB_SHA":.github/prepare-master-corpus-20260915.sh > "$RUNNER_TEMP/prepare.sh"
          bash "$RUNNER_TEMP/prepare.sh"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message='Integrate simulation correctness repairs and measured corpus (pending fleet clearance)'
          commit=$(printf '%s\n' "$message" | git commit-tree 65d1d57f5d001c6f391c5d19a4c091c1ea36e2a3 -p 094f242214b7bc5176a2a236df8bb1cac4d04b86 -p 8d18dbd3cd720977dfb649e8f585fbaa80200740)
          git push origin "$commit":refs/heads/work/master-fixes-20260915-prepared
          echo "Prepared $commit; no master update. Full-fleet clearance and final ledger are still required." >> "$GITHUB_STEP_SUMMARY"
