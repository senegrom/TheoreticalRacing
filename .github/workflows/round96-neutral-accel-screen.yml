name: Round 96 neutral acceleration screen

on:
  push:
    branches:
      - agent/ai-racing-speed-96-neutral-accel
    paths:
      - .github/workflows/round96-neutral-accel-screen.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply AI1-only neutral-acceleration gate
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round96-neutral.patch
          printf '%s  %s\n' 'd81baf1b0bbc138160936f29404bebbdf498a7375fd45ef1cb4c77903b7154d0' /tmp/round96-neutral.patch | sha256sum -c -
          git apply --check /tmp/round96-neutral.patch
          git apply /tmp/round96-neutral.patch
      - name: Verify candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: round96-neutral-jar
          path: theoreticRacing.jar
          if-no-files-found: error

  screen:
    needs: verify
    name: Screen ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        track:
          - silverstone
          - monza
          - spa
          - monaco
          - spielberg
          - nurburgring
          - lemans
          - interlagos
          - zandvoort
          - hungaroring
          - circle
          - the_long_loop
          - sprint
          - hairpin
          - triangle
          - chicane
          - bigoval
          - curve
          - zigzag
          - coil
          - slalom
          - gear
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round96-neutral-jar
      - name: Compare AI1 candidate against champion AI2, seeds 1-15
        env:
          TRACK: ${{ matrix.track }}
        run: python tracks/bench_ai.py --seeds 15 "$TRACK" | tee "round96-neutral-${TRACK}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round96-neutral-${{ matrix.track }}
          path: round96-neutral-${{ matrix.track }}.txt
          if-no-files-found: error
