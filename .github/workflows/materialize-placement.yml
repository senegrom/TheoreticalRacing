name: Preserve tested placement source objects
on:
  push:
    branches: [master]
    paths: [.github/workflows/materialize-placement.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8db66b3b87bcd3957e5fc595de09641699308879
          persist-credentials: false
      - name: Verify and store reviewed source objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          chunks = ['5d01d54ee92e0a260b30de2e8f213c79da94f7a2', '1dc936c58887cbd90e0cc58a74a6273110142f8f', '9f55fa0b3d24bc9c2ad32c460b8804cbb82127e0']
          parts = []
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(root + 'blobs/' + sha, headers=headers), timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              parts.append(raw)
          patch = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '0f89134b2c5127ed675c83c2f9e7ba4e926329097c72d23eec88482966effda5'
          pathlib.Path('/tmp/placement.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '/tmp/placement.patch'], check=True)
          expected = '4986368164afc36c61cff1368af001d5b9d754f6'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert not subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--', 'tracks', 'src/tr/logic/RaceAi.java', 'tests/golden_races.json'], text=True).strip()
          entries = []
          for name in subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM'], text=True).splitlines():
              assert name == 'README.md' or name.startswith(('src/', 'tests/', 'web/'))
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append(dict(path=name, mode=mode, type='blob', content=pathlib.Path(name).read_text()))
          request = urllib.request.Request(root + 'trees', method='POST', headers=headers, data=json.dumps(dict(base_tree='1f8275000c93cbba2bf7eb7ffa92c43d52121ced', tree=entries)).encode())
          with urllib.request.urlopen(request, timeout=60) as response:
              stored = json.load(response)['sha']
          assert stored == expected, stored
          pathlib.Path('placement-source-tree.json').write_text(json.dumps(dict(base='8db66b3b87bcd3957e5fc595de09641699308879', tree=stored, patch_sha256=hashlib.sha256(patch).hexdigest(), files=[e['path'] for e in entries]), indent=2))
          print('Verified source tree:', stored)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: placement-source-tree
          path: placement-source-tree.json
          retention-days: 7
