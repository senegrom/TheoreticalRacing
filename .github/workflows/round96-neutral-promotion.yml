name: Round 96 neutral acceleration promotion battery

on:
  push:
    branches:
      - agent/ai-racing-speed-96-neutral-accel
    paths:
      - .github/workflows/round96-neutral-promotion.yml

permissions:
  actions: read
  contents: read

jobs:
  battery:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - label: 8-car seeds 1-5
            command: python tracks/bench_ai.py --seed-start 1 --seeds 5
            artifact: r96-promotion-8car-s1-5
          - label: 8-car seeds 6-10
            command: python tracks/bench_ai.py --seed-start 6 --seeds 5
            artifact: r96-promotion-8car-s6-10
          - label: 8-car seeds 11-15
            command: python tracks/bench_ai.py --seed-start 11 --seeds 5
            artifact: r96-promotion-8car-s11-15
          - label: 4v4 mixed seeds 1-5
            command: python tracks/bench_ai.py --h2h --seed-start 1 --seeds 5
            artifact: r96-promotion-h2h-s1-5
          - label: 4v4 mixed seeds 6-10
            command: python tracks/bench_ai.py --h2h --seed-start 6 --seeds 5
            artifact: r96-promotion-h2h-s6-10
          - label: 4v4 mixed seeds 11-15
            command: python tracks/bench_ai.py --h2h --seed-start 11 --seeds 5
            artifact: r96-promotion-h2h-s11-15
          - label: 2v2 mixed seeds 1-5
            command: python tracks/bench_ai.py --4p --seed-start 1 --seeds 5
            artifact: r96-promotion-2v2-s1-5
          - label: 1v1 seeds 1-5
            command: python tracks/bench_ai.py --1v1 --seed-start 1 --seeds 5
            artifact: r96-promotion-1v1-s1-5
          - label: 4-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 4car 1
            artifact: r96-promotion-homogeneous-4car-s1-5
          - label: 2-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 2car 1
            artifact: r96-promotion-homogeneous-2car-s1-5
          - label: Slow synthetic seeds 1-5
            command: python tracks/bench_ai.py --slow --seed-start 1 --seeds 5
            artifact: r96-promotion-slow-s1-5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 31861007012
          name: round96-neutral-jar
          path: .
      - name: Run ${{ matrix.label }}
        shell: bash
        run: ${{ matrix.command }} | tee promotion-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: promotion-report.txt
          if-no-files-found: error
