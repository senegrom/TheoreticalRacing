name: Merge master correctness fixes into Round 82

on:
  push:
    branches:
      - agent/ai-racing-speed-78
    paths:
      - .github/workflows/merge-master-correctness.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Merge current master with reviewed resolutions
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git fetch origin master
          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            actual="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' racing-memory.md src/tr/logic/RaceAi.java tests/tr/logic/CoreTests.java | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
            git checkout --ours src/tr/logic/RaceAi.java
            git checkout --theirs tests/tr/logic/CoreTests.java
            python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ours = subprocess.check_output(
              ["git", "show", ":2:racing-memory.md"], text=True
          )
          theirs = subprocess.check_output(
              ["git", "show", ":3:racing-memory.md"], text=True
          )
          marker = "## Master correctness/debloat pass (2026-08-13)"
          start = theirs.index(marker)
          next_heading = re.search(r"^## ", theirs[start + len(marker):], re.MULTILINE)
          end = (
              start + len(marker) + next_heading.start()
              if next_heading
              else len(theirs)
          )
          section = theirs[start:end].rstrip() + "\n\n"
          if marker not in ours:
              anchor = "## OPEN CLASS"
              insert_at = ours.index(anchor)
              ours = ours[:insert_at] + section + ours[insert_at:]
          Path("racing-memory.md").write_text(ours, encoding="utf-8")
          PY
            git add racing-memory.md src/tr/logic/RaceAi.java tests/tr/logic/CoreTests.java
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --check
      - name: Verify merged frontier
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
          python -m unittest discover -s tests -p 'test_*.py'
          sh -n build_main.sh run_tests.sh run_golden_tests.sh
          git diff --check
      - name: Commit merged frontier
        run: |
          git rm .github/workflows/merge-master-correctness.yml
          git add -A
          git commit -m "Merge master correctness fixes"
          git push origin HEAD:agent/ai-racing-speed-78
