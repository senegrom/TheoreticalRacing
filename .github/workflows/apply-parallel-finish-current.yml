name: Apply validated parallel preparation and finish cache
on:
  push:
    branches: [master]
    paths: ['.github/workflows/apply-parallel-finish-current.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PATCH_BLOB: 6192730acb48e34856a2634b5debbcc4835d9c45
      PATCH_XZ_SHA256: cce757172240c83694817d829131540287754a4fc063a16a75f60583247a065e
      PATCH_SHA256: e769b64ce09d571673d8028766dd8cb8758b373cba9ea6ef870da48311bd6746
      JAVA_TOOL_OPTIONS: -Xmx3g
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize reviewed performance patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['PATCH_BLOB']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          url=f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
              raw=base64.b64decode(json.load(r)['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          assert hashlib.sha256(raw).hexdigest()==os.environ['PATCH_XZ_SHA256']
          patch=lzma.decompress(raw)
          assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'parallel-finish.patch'); p.write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary',str(p)],check=True)
          pathlib.Path('.github/workflows/apply-parallel-finish-current.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidate-tree.txt').write_text(subprocess.check_output(['git','write-tree'],text=True).strip())
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: JDK 25 full engine regressions
        shell: bash
        run: |
          sh run_tests.sh
          sh build_main.sh
          env -u JAVA_TOOL_OPTIONS python -m unittest discover -s tests -p 'test_*.py'
          python tests/headless_smoke.py
          python tests/query_replay_regression.py
          python tests/lap_progress_regression.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do echo "==> $test"; python "$test"; done
      - name: Browser adapter and transport contracts
        shell: bash
        run: |
          python3 -m pip install -r web/requirements-icons.txt
          sh web/build.sh
          python3 -m unittest discover -s web/tests -p 'test_*.py'
          node --test web/tests/engine.test.mjs
          for f in web/*.js; do node --check "$f"; done
          python3 web/tests/server_test.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: JDK 26 core and build
        run: |
          sh run_tests.sh
          sh build_main.sh
      - name: Publish exact tested tree if master is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']
          tree=pathlib.Path(os.environ['RUNNER_TEMP'],'candidate-tree.txt').read_text().strip()
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==tree
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip(), 'tests mutated tracked files'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          api=f'https://api.github.com/repos/{repo}'
          with urllib.request.urlopen(urllib.request.Request(api+'/git/ref/heads/master',headers=headers),timeout=60) as r:
              current=json.load(r)['object']['sha']
          if current!=parent: raise SystemExit('master advanced; refusing to overwrite '+current)
          env=os.environ.copy(); env.update(GIT_AUTHOR_NAME='github-actions[bot]',GIT_COMMITTER_NAME='github-actions[bot]',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          msg='''Parallelize exact preparation and cache finish-edge tests\n\nBuild the exact full-race potential concurrently with reach/lap preparation when a deterministic max-heap estimate leaves a fixed safety reserve; otherwise retain the sequential path. Cap the exact frontier to the actual distance-array size plus 64 MiB. Cache integer finish-line intersection verdicts in a separate lazy two-bit dense table so legality-cache locality is unchanged. Preserve the browser startup adapter and add direct budget/cache tests plus performance documentation.\n\nNo AI weights, rules, tracks, start modes, or golden expectations changed. The prior exact candidate passed JDK 25/26, all goldens/champion pins, replay, and browser contracts; this rebased tree reruns those same gates against current master before publication.\n'''
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',parent],input=msg,text=True,env=env).strip()
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','origin',commit+':refs/heads/master'],check=True,env=env)
          pathlib.Path(os.environ['RUNNER_TEMP'],'publication.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':parent,'run':os.environ['GITHUB_RUN_ID']},indent=2))
          print('Published master:',commit)
          dispatch_headers=dict(headers,**{'Content-Type':'application/json'})
          req=urllib.request.Request(api+'/actions/workflows/browser.yml/dispatches',data=json.dumps({'ref':'master'}).encode(),headers=dispatch_headers,method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: assert r.status==204
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-parallel-finish-publication
          path: |
            ${{ runner.temp }}/parallel-finish.patch
            ${{ runner.temp }}/candidate-tree.txt
            ${{ runner.temp }}/publication.json
          retention-days: 7
