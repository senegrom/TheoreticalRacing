name: AI84 energy diagnostics

on:
  push:
    branches:
      - agent/ai-racing-speed-84
    paths:
      - .github/workflows/ai84-energy-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Trace high-energy staged decisions
        env:
          RACING_REACH_CACHE: ${{ runner.temp }}/ai84-diagnostic-cache
        run: python tracks/ai84_energy_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai84-energy-diagnostics
          path: ai84-energy-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
