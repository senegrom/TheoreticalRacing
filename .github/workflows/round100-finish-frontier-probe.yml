name: Round 100 finish frontier probe

on:
  push:
    branches:
      - agent/ai-racing-speed-100-finish-probe
    paths:
      - .github/workflows/round100-finish-frontier-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        track:
          - silverstone
          - monza
          - spa
          - monaco
          - spielberg
          - nurburgring
          - lemans
          - interlagos
          - zandvoort
          - hungaroring
          - circle
          - the_long_loop
          - sprint
          - hairpin
          - triangle
          - chicane
          - bigoval
          - curve
          - zigzag
          - coil
          - slalom
          - gear
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Instrument skipped certified finish candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tr/logic/RaceAi.java')
          s = p.read_text()

          old_latch = '\tprivate static boolean\t\t\tinTrueRivalConfirm;'
          new_latch = '\tprivate boolean\t\t\t\tinTrueRivalConfirm;'
          assert s.count(old_latch) == 1
          s = s.replace(old_latch, new_latch, 1)

          debug_anchor = '\tprivate final static boolean\tAI_DEBUG_COMP\t= Boolean.getBoolean("ai.debug.comp");\n'
          assert s.count(debug_anchor) == 1
          s = s.replace(debug_anchor, debug_anchor
                  + '\tprivate final static boolean\tAI_DEBUG_FRONTIER\t= Boolean.getBoolean("ai.debug.frontier");\n', 1)

          body_end = s.index('\tprivate Direction optimalMoveAI2')
          head, tail = s[:body_end], s[body_end:]
          needle = '''\t\t\t\tint sprintT = chosenT;\n\t\t\t\tDirection sprint = null;\n'''
          insert = '''\t\t\t\tif (AI_DEBUG_FRONTIER && kindHomogeneousRoster(playerNum)\n\t\t\t\t\t\t&& liveRivalsRemaining(playerNum) >= AI1_PRIVATE_FIELD_MIN_RIVALS\n\t\t\t\t\t\t&& hasAdjacentPriorVelocityPeer(pos, vel, playerNum)) {\n\t\t\t\t\tfor (final Direction probe : DIRECTIONS) {\n\t\t\t\t\t\tfinal int probeT = poTByDir[probe.ordinal()];\n\t\t\t\t\t\tif (probe != chosen && probe != Direction.NONE\n\t\t\t\t\t\t\t\t&& probeT > AI1_FINISH_EXTENDED_TTF && probeT <= 45\n\t\t\t\t\t\t\t\t&& probeT + 1 == chosenT\n\t\t\t\t\t\t\t\t&& trapByDir[probe.ordinal()] == AI1_TRAP_L2\n\t\t\t\t\t\t\t\t&& uncByDir[probe.ordinal()] == 0.0)\n\t\t\t\t\t\t\tSystem.err.println("AIDBG FRONTIER p=" + playerNum + " pos=(" + pos[0] + ","\n\t\t\t\t\t\t\t\t\t+ pos[1] + ") vel=(" + vel[0] + "," + vel[1] + ") "\n\t\t\t\t\t\t\t\t\t+ chosen + " t=" + chosenT + " -> " + probe + " t=" + probeT\n\t\t\t\t\t\t\t\t\t+ " score=" + scoreByDir[probe.ordinal()]);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tint sprintT = chosenT;\n\t\t\t\tDirection sprint = null;\n'''
          assert head.count(needle) == 1
          p.write_text(head.replace(needle, insert, 1) + tail)
          PY
      - name: Verify and build
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
      - name: Probe seeds 1-60
        env:
          TRACK: ${{ matrix.track }}
        run: |
          cp tracks/bench.properties /tmp/round100.properties
          start=$(date +%s)
          java -Djava.awt.headless=true -Dai.debug.frontier=true \
            -jar theoreticRacing.jar --auto --track "$TRACK" \
            --props /tmp/round100.properties --log "/tmp/round100-${TRACK}.log" \
            --seed 1-60 >"round100-${TRACK}.stdout" 2>"round100-${TRACK}.stderr"
          elapsed=$(( $(date +%s) - start ))
          {
            echo "track=$TRACK"
            echo "elapsed_seconds=$elapsed"
            echo "events=$(grep -c 'AIDBG FRONTIER' round100-${TRACK}.stderr || true)"
            grep 'AIDBG FRONTIER' "round100-${TRACK}.stderr" || true
          } > "round100-${TRACK}-frontier.txt"
          cat "round100-${TRACK}-frontier.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round100-frontier-${{ matrix.track }}
          path: round100-${{ matrix.track }}-frontier.txt
          if-no-files-found: error
