name: Fix browser e2e advanced setup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/fix-e2e-advanced.yml']
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Patch exact current test contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/tests/browser_e2e.py')
          s = p.read_text()
          anchor = "class QuietHandler(RangeHandler):\n    def log_message(self, fmt, *args):\n        pass\n\n\n"
          helper = anchor + "def select_ai_start_policy(page, value):\n    # The policy selector intentionally lives in the collapsed Advanced setup.\n    # Open that disclosure before interacting with the real form control.\n    page.locator('.advanced-setup').evaluate('(element) => { element.open = true; }')\n    page.locator('#ai-start-policy').select_option(value)\n\n\n"
          legacy = "page.locator('#ai-start-policy').select_option('legacy')"
          informed = "page.locator('#ai-start-policy').select_option('informed')"
          assert s.count(anchor) == 1
          assert s.count(legacy) == 1
          assert s.count(informed) == 2
          s = s.replace(anchor, helper)
          s = s.replace(legacy, "select_ai_start_policy(page, 'legacy')")
          s = s.replace(informed, "select_ai_start_policy(page, 'informed')")
          assert legacy not in s and informed not in s
          assert s.count('select_ai_start_policy(page,') == 4
          p.write_text(s)
          PY
          python3 -m py_compile web/tests/browser_e2e.py
          git diff --check
          rm .github/workflows/fix-e2e-advanced.yml
          git add web/tests/browser_e2e.py .github/workflows/fix-e2e-advanced.yml
      - name: Commit without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'master advanced; refusing to overwrite'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(browser): open advanced setup before policy selection"
          git push origin HEAD:master
          curl --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/browser.yml/dispatches -d '{"ref":"master"}'
