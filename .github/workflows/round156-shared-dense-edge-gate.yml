name: Round 156 shared dense edge-cache gate

on:
  push:
    branches:
      - agent/ai-racing-speed-156-shared-dense-edge-gate
    paths:
      - .github/workflows/round156-shared-dense-edge-gate.yml
      - tracks/round156_apply.py
      - tracks/round156_compare.py
      - tracks/round156_publish.py
      - tracks/round156_runtime.py

permissions:
  contents: write

concurrency:
  group: round156-shared-dense-edge-gate
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record exhaustive run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round156-gate-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round156-gate-status.json
          git commit -m 'Round 156: record exhaustive gate run' || exit 0
          git push

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build immutable baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round156-base-sha.txt
          git worktree add /tmp/round156-gate "$BASE"
          cd /tmp/round156-gate
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round156-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round156_apply.py"
          git diff --name-only | sort > /tmp/round156-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceGame.java \
            src/tr/logic/Reachability.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round156-expected.txt
          diff -u /tmp/round156-expected.txt /tmp/round156-changed.txt
          test "$(grep -c 'DenseEdgeLegalCache shared(final String key' src/tr/logic/RaceGame.java)" = 1
          test "$(grep -c 'String geometryCacheKey()' src/tr/logic/Reachability.java)" = 1
          git diff --check
          git diff -- \
            src/tr/logic/RaceGame.java \
            src/tr/logic/Reachability.java \
            tests/tr/logic/CoreTests.java \
            > "$GITHUB_WORKSPACE/round156.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round156-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round156-build
          path: |
            round156-baseline.jar
            round156-candidate.jar
            round156-base-sha.txt
            round156.patch
          if-no-files-found: error
          retention-days: 30

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        track:
          - circle
          - triangle
          - curve
          - hairpin
          - chicane
          - sprint
          - bigoval
          - slalom
          - gear
          - coil
          - zigzag
          - the_long_loop
          - monaco
          - hungaroring
          - interlagos
          - lemans
          - spa
          - silverstone
          - monza
          - zandvoort
          - nurburgring
          - spielberg
          - serpentine
          - serpentine2
          - spiral
          - cog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round156-build
          path: .
      - name: Require exact byte identity
        env:
          TRACK: ${{ matrix.track }}
        shell: bash
        run: |
          set -euxo pipefail
          case "$TRACK" in
            serpentine|serpentine2|spiral|cog) END_SEED=50 ;;
            *) END_SEED=150 ;;
          esac
          python tracks/round156_compare.py \
            --baseline round156-baseline.jar \
            --candidate round156-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round156-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round156-result-${{ matrix.track }}
          path: round156-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round156-build
          path: round156-build
      - uses: actions/download-artifact@v4
        with:
          pattern: round156-result-*
          path: round156-results
          merge-multiple: true
      - name: Enforce exact no-change policy
        id: gate
        shell: bash
        run: |
          set -euxo pipefail
          cp round156-build/round156-base-sha.txt .
          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = [
              json.loads(path.read_text())
              for path in sorted(Path('round156-results').glob('*.json'))
          ]
          summary = {
              'baseline_sha': Path('round156-base-sha.txt').read_text().strip(),
              'candidate': 'shared_dense_edge_cache',
              'tracks': len(rows),
              'pairs': sum(row['pairs'] for row in rows),
              'mismatches': sum(len(row['mismatches']) for row in rows),
              'byte_identical_tracks': sum(1 for row in rows if row['identical']),
              'runtime_ratios_from_exact_jobs': {
                  row['track']: row['runtime_ratio'] for row in rows
              },
          }
          summary['viable'] = (
              summary['tracks'] == 26
              and summary['pairs'] == 3500
              and summary['mismatches'] == 0
              and summary['byte_identical_tracks'] == 26
          )
          Path('round156-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if summary['viable'] else 'false'), file=out)
          assert summary['viable'], summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round156-summary
          path: round156-summary.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round156-build
          path: .
      - name: Measure five-pair dual-order warm batch speed
        shell: bash
        run: |
          python tracks/round156_runtime.py \
            --baseline round156-baseline.jar \
            --candidate round156-candidate.jar \
            --pairs 5 --out round156-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round156-runtime.json'))
          assert result['aggregate_ratio'] <= 0.90, result
          assert all(row['ratio'] <= 1.05 for row in result['cases']), result
          assert all(row['byte_identical'] for row in result['cases']), result
          assert result['viable'], result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round156-runtime
          path: round156-runtime.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, summarize, runtime]
    if: needs.summarize.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round156-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round156-summary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round156-runtime
          path: .
      - name: Verify evidence and immutable parent
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('round156-base-sha.txt').read_text().strip()
          summary = json.load(open('round156-summary.json'))
          runtime = json.load(open('round156-runtime.json'))
          assert summary['baseline_sha'] == base, summary
          assert summary['candidate'] == 'shared_dense_edge_cache', summary
          assert summary['pairs'] == 3500 and summary['mismatches'] == 0, summary
          assert summary['byte_identical_tracks'] == 26 and summary['viable'], summary
          assert runtime['aggregate_ratio'] <= 0.90 and runtime['viable'], runtime
          assert all(
              row['ratio'] <= 1.05 and row['byte_identical']
              for row in runtime['cases']
          ), runtime
          PY
          EXPECTED=$(cat round156-base-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
      - name: Materialize and replay clean production checkout
        shell: bash
        run: |
          set -euxo pipefail
          cp tracks/round156_apply.py /tmp/round156_apply.py
          cp tracks/round156_publish.py /tmp/round156_publish.py
          BASE=$(cat round156-base-sha.txt)
          git checkout -B round156-production "$BASE"
          python /tmp/round156_apply.py
          git diff --name-only | sort > /tmp/round156-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceGame.java \
            src/tr/logic/Reachability.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round156-expected.txt
          diff -u /tmp/round156-expected.txt /tmp/round156-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
          python /tmp/round156_publish.py
          git diff --check
          git diff --name-only | sort > /tmp/round156-final-changed.txt
          printf '%s\n' \
            AI_DEVELOPMENT.md \
            racing-memory.md \
            src/tr/logic/RaceGame.java \
            src/tr/logic/Reachability.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round156-final-expected.txt
          diff -u /tmp/round156-final-expected.txt /tmp/round156-final-changed.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            AI_DEVELOPMENT.md \
            racing-memory.md \
            src/tr/logic/RaceGame.java \
            src/tr/logic/Reachability.java \
            tests/tr/logic/CoreTests.java
          git commit -m 'Round 156: share dense geometry cache across batches'
          git push origin HEAD:master
          LOCAL=$(git rev-parse HEAD)
          printf '%s\n' "$LOCAL" > round156-commit.txt
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$LOCAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round156-promotion-evidence
          path: |
            round156-summary.json
            round156-runtime.json
            round156.patch
            round156-base-sha.txt
            round156-commit.txt
          if-no-files-found: warn
          retention-days: 30
