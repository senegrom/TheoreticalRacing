name: Round 108 AI1 equal-speed target gate

on:
  push:
    branches:
      - agent/ai-racing-speed-108-equal-speed-veto-gate
    paths:
      - .github/workflows/round108-equal-speed-gate.yml
      - tracks/round108_apply.py
      - tracks/round108_compare.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master baseline and isolated AI1 candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round108-baseline-sha.txt
          git worktree add /tmp/round108-work origin/master
          cd /tmp/round108-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round108-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round108_apply.py"
          test "$(git diff --name-only)" = "src/tr/logic/RaceAi.java"
          test "$(grep -c 'Round 108 AI1 frontier:' src/tr/logic/RaceAi.java)" = 1
          test "$(grep -c 'Round 95: the topology-shaped model can false-kill a genuinely' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round108.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round108-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
          cd "$GITHUB_WORKSPACE"
          python tracks/round108_compare.py --baseline round108-baseline.jar --candidate round108-candidate.jar --track zandvoort --start 115 --end 115 --out round108-target-zandvoort.json
          python tracks/round108_compare.py --baseline round108-baseline.jar --candidate round108-candidate.jar --track hungaroring --start 144 --end 144 --out round108-control-hungaroring.json
          python tracks/round108_compare.py --baseline round108-baseline.jar --candidate round108-candidate.jar --track lemans --start 4 --end 4 --out round108-control-lemans.json
          python - <<'PY'
          import json
          z = json.load(open('round108-target-zandvoort.json'))
          h = json.load(open('round108-control-hungaroring.json'))
          l = json.load(open('round108-control-lemans.json'))
          assert z['counts']['safety_gain'] == 1 and len(z['events']) == 1, z
          assert h['counts']['identical'] == 1 and not h['events'], h
          assert l['counts']['identical'] == 1 and not l['events'], l
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round108-jars
          path: |
            round108-baseline.jar
            round108-candidate.jar
            round108-baseline-sha.txt
            round108.patch
            round108-target-zandvoort.json
            round108-control-hungaroring.json
            round108-control-lemans.json
          if-no-files-found: error
          retention-days: 7

  differential:
    needs: verify
    name: Differential ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { track: circle, end: 150 }
          - { track: triangle, end: 150 }
          - { track: curve, end: 150 }
          - { track: hairpin, end: 150 }
          - { track: chicane, end: 150 }
          - { track: sprint, end: 150 }
          - { track: bigoval, end: 150 }
          - { track: slalom, end: 150 }
          - { track: gear, end: 150 }
          - { track: coil, end: 150 }
          - { track: zigzag, end: 150 }
          - { track: the_long_loop, end: 150 }
          - { track: monaco, end: 150 }
          - { track: hungaroring, end: 150 }
          - { track: interlagos, end: 150 }
          - { track: lemans, end: 150 }
          - { track: spa, end: 150 }
          - { track: silverstone, end: 150 }
          - { track: monza, end: 150 }
          - { track: zandvoort, end: 150 }
          - { track: nurburgring, end: 150 }
          - { track: spielberg, end: 150 }
          - { track: serpentine, end: 50 }
          - { track: serpentine2, end: 50 }
          - { track: spiral, end: 50 }
          - { track: cog, end: 50 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-jars
          path: .
      - name: Compare exact per-seed outcomes
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end }}
        run: |
          python tracks/round108_compare.py --baseline round108-baseline.jar --candidate round108-candidate.jar --track "$TRACK" --start 1 --end "$END_SEED" --out "round108-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round108-result-${{ matrix.track }}
          path: round108-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-jars
          path: .
      - name: Alternate candidate and baseline execution order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, statistics, subprocess, tempfile, time

          root = Path.cwd()
          source = root / 'tracks' / 'bench.properties'

          def props(path):
              lines = []
              for line in source.read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar, track, seed):
              with tempfile.TemporaryDirectory(prefix='r108-time-') as directory:
                  directory = Path(directory)
                  p = directory / 'p.properties'
                  log = directory / 'r.log'
                  props(p)
                  started = time.perf_counter()
                  cp = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(p), '--log', str(log),
                      '--seed', str(seed)
                  ], text=True, capture_output=True, timeout=1800)
                  if cp.returncode:
                      raise SystemExit(cp.stderr[-2000:])
                  return time.perf_counter() - started

          rows = []
          for track, seed in [('zandvoort', 115), ('lemans', 4), ('circle', 10)]:
              run('round108-baseline.jar', track, seed)
              run('round108-candidate.jar', track, seed)
              baseline = []
              candidate = []
              for index in range(6):
                  if index % 2:
                      baseline.append(run('round108-baseline.jar', track, seed))
                      candidate.append(run('round108-candidate.jar', track, seed))
                  else:
                      candidate.append(run('round108-candidate.jar', track, seed))
                      baseline.append(run('round108-baseline.jar', track, seed))
              trim = lambda values: statistics.mean(sorted(values)[1:-1])
              row = {
                  'track': track,
                  'seed': seed,
                  'median_ratio': statistics.median(candidate) / statistics.median(baseline),
                  'trimmed_ratio': trim(candidate) / trim(baseline),
                  'baseline': baseline,
                  'candidate': candidate,
              }
              rows.append(row)
              if row['median_ratio'] > 1.25 or row['trimmed_ratio'] > 1.25:
                  raise SystemExit(f'runtime regression: {row}')
          Path('round108-runtime.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round108-runtime
          path: round108-runtime.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: [differential, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: round108-result-*
          path: results
          merge-multiple: true
      - name: Enforce exact no-regression policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {'pairs': 0, 'counts': {}, 'net_moves': 0, 'events': [], 'runtime_ratios': {}}
          for path in sorted(Path('results').glob('*.json')):
              data = json.load(open(path))
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              for event in data['events']:
                  summary['events'].append({'track': data['track'], **event})
          Path('round108-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          bad = sum(summary['counts'].get(key, 0) for key in ('safety_regression', 'slower', 'redistribution'))
          assert summary['pairs'] == 3500, summary
          assert bad == 0, summary
          assert summary['counts'].get('safety_gain', 0) >= 1, summary
          by_case = {(event['track'], event['seed']): event['classification'] for event in summary['events']}
          assert by_case.get(('zandvoort', 115)) == 'safety_gain', summary
          assert ('hungaroring', 144) not in by_case, summary
          assert ('lemans', 4) not in by_case, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round108-summary
          path: round108-summary.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify, differential, runtime, summarize]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-jars
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round108-summary
          path: .
      - name: Materialize verified production commit
        run: |
          cp tracks/round108_apply.py /tmp/round108_apply.py
          EXPECTED=$(cat round108-baseline-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
          git checkout -B round108-production origin/master
          python /tmp/round108_apply.py
          test "$(git diff --name-only)" = "src/tr/logic/RaceAi.java"
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python - <<'PY'
          from pathlib import Path
          import sys, tempfile, textwrap

          root = Path.cwd()
          sys.path.insert(0, str(root / 'tracks'))
          import bench_ai

          with tempfile.TemporaryDirectory(prefix='round108-pin-') as directory:
              bench_ai.configure_runtime(directory)
              bench_ai.set_nplayers(8)
              bench_ai.set_all_to('AI1')
              ai1 = bench_ai.run_track('zandvoort', timeout=1200, seed=115)
              bench_ai.set_all_to('AI2')
              ai2 = bench_ai.run_track('zandvoort', timeout=1200, seed=115)
          assert ai1[0] > ai2[0] or ai1[1] < ai2[1], (ai1, ai2)

          test = f'''#!/usr/bin/env python3
          """Pin Round 108's AI1-only equal-speed false-target rescue."""
          from pathlib import Path
          import sys
          import tempfile

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "tracks"))
          import bench_ai  # noqa: E402

          EXPECTED = {{"AI1": {ai1!r}, "AI2": {ai2!r}}}


          def main() -> int:
              if not Path(bench_ai.JAR).is_file():
                  raise SystemExit("theoreticRacing.jar not found; run build_main.sh first")
              actual = {{}}
              with tempfile.TemporaryDirectory(prefix="round108-regression-") as directory:
                  bench_ai.configure_runtime(directory)
                  bench_ai.set_nplayers(8)
                  for kind in ("AI1", "AI2"):
                      bench_ai.set_all_to(kind)
                      actual[kind] = bench_ai.run_track("zandvoort", timeout=1200, seed=115)
              if actual != EXPECTED:
                  raise SystemExit(f"Round-108 regression: {{actual}}, expected {{EXPECTED}}")
              if actual["AI1"][0] <= actual["AI2"][0] and actual["AI1"][1] >= actual["AI2"][1]:
                  raise SystemExit(f"Round-108 rescue lost: {{actual}}")
              print("AI1EqualSpeedVetoRegression: OK (Zandvoort s115 rescued; AI2 frozen)")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          Path('tests/ai1_equal_speed_veto_regression.py').write_text(textwrap.dedent(test))

          memory = Path('AI_DEVELOPMENT.md')
          text = memory.read_text()
          heading = '## Round 108: AI1 equal-speed false-target veto\n'
          if heading not in text:
              section = '''## Round 108: AI1 equal-speed false-target veto

The remaining Zandvoort seed-115 crash came from a danger-ladder switch between
equal-speed lines: the topology rollout called both alive, while the existing
full-fidelity rival model proved the selected line alive and the alternative
dead. AI1 now vetoes only that false-target transition in a large homogeneous
field. AI2 remains byte-for-byte on the frozen control policy. The candidate
rescues the target without changing Hungaroring seed 144, Le Mans seed 4, any
golden race, or any of the 3,499 other exact seed-pairs in the Round 108 gate.

'''
              anchor = '## Current champion and frontier baseline\n'
              memory.write_text(text.replace(anchor, section + anchor, 1) if anchor in text else section + text)

          campaign = Path('racing-memory.md')
          marker = 'ROUND 108 (AI1 equal-speed false-target veto):'
          campaign_text = campaign.read_text()
          if marker not in campaign_text:
              campaign.write_text(campaign_text.rstrip() + '\n\n' + marker + ''' Zandvoort s115 is closed by
an AI1-only faithful-rival veto on equal-speed danger-ladder switches. The
frozen AI2 copy is untouched; Hungaroring s144 remains the sole documented
mega-window crash frontier. Exact 3,500-pair no-regression gate clean.\n''')
          PY
          python tests/ai1_equal_speed_veto_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
          git diff --check
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git add src/tr/logic/RaceAi.java tests/ai1_equal_speed_veto_regression.py AI_DEVELOPMENT.md racing-memory.md
          git commit -m 'Round 108: veto false equal-speed switch targets'
          git push origin HEAD:agent/ai-racing-speed-108-equal-speed-veto
