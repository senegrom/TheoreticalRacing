name: Round 117 exact-six-ahead promotion

on:
  push:
    branches:
      - agent/ai-racing-speed-117-six-ahead-accel
    paths:
      - .github/workflows/round117-six-ahead-promotion.yml
      - tracks/round117_apply.py
      - tracks/round117_compare.py
      - tracks/round117_publish.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round117-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round117-run-id.txt
          git commit -m 'Record Round 117 promotion run'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Build exact live-master pair
        run: |
          git fetch origin master
          git rev-parse origin/master > round117-base-sha.txt
          git worktree add /tmp/round117 origin/master
          cd /tmp/round117
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round117-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round117_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'AI1_FIELD_ACCEL_SIX_AHEAD_ROUNDS' src/tr/logic/RaceAi.java)" = 2
          git diff --check
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round117.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round117-candidate.jar"
      - name: Run permanent regression suite
        working-directory: /tmp/round117
        run: |
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - name: Prove target and exclusion controls
        run: |
          mkdir round117-targets
          for seed in 5 22 86; do
            python tracks/round117_compare.py \
              --baseline round117-baseline.jar --candidate round117-candidate.jar \
              --track coil --start "$seed" --end "$seed" \
              --out "round117-targets/coil-${seed}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows = {int(path.stem.split('-')[-1]): json.load(open(path))
                  for path in Path('round117-targets').glob('*.json')}
          assert rows[5]['counts']['identical'] == 1 and not rows[5]['events'], rows
          assert rows[22]['counts']['identical'] == 1 and not rows[22]['events'], rows
          assert rows[86]['counts']['pareto_faster'] == 1, rows
          event = rows[86]['events'][0]
          assert event['candidate']['sum'] < event['baseline']['sum'], rows
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round117-build
          path: |
            round117-baseline.jar
            round117-candidate.jar
            round117-base-sha.txt
            round117.patch
            round117-targets
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 26
      matrix:
        include:
          - { track: circle, end_seed: 150 }
          - { track: triangle, end_seed: 150 }
          - { track: curve, end_seed: 150 }
          - { track: hairpin, end_seed: 150 }
          - { track: chicane, end_seed: 150 }
          - { track: sprint, end_seed: 150 }
          - { track: bigoval, end_seed: 150 }
          - { track: slalom, end_seed: 150 }
          - { track: gear, end_seed: 150 }
          - { track: coil, end_seed: 150 }
          - { track: zigzag, end_seed: 150 }
          - { track: the_long_loop, end_seed: 150 }
          - { track: monaco, end_seed: 150 }
          - { track: hungaroring, end_seed: 150 }
          - { track: interlagos, end_seed: 150 }
          - { track: lemans, end_seed: 150 }
          - { track: spa, end_seed: 150 }
          - { track: silverstone, end_seed: 150 }
          - { track: monza, end_seed: 150 }
          - { track: zandvoort, end_seed: 150 }
          - { track: nurburgring, end_seed: 150 }
          - { track: spielberg, end_seed: 150 }
          - { track: serpentine, end_seed: 50 }
          - { track: serpentine2, end_seed: 50 }
          - { track: spiral, end_seed: 50 }
          - { track: cog, end_seed: 50 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round117-build
          path: .
      - name: Compare exact seeded outcomes
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end_seed }}
        run: |
          python tracks/round117_compare.py \
            --baseline round117-baseline.jar --candidate round117-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round117-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round117-result-${{ matrix.track }}
          path: round117-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round117-build
          path: .
      - name: Bound active and control runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, statistics, subprocess, tempfile, time

          root = Path.cwd()
          source = root / 'tracks' / 'bench.properties'

          def props(path):
              lines = []
              for line in source.read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar, track, seed):
              with tempfile.TemporaryDirectory(prefix='round117-time-') as directory:
                  work = Path(directory)
                  p = work / 'bench.properties'
                  log = work / 'race.log'
                  props(p)
                  started = time.perf_counter()
                  result = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(p), '--log', str(log),
                      '--seed', str(seed)
                  ], cwd=root, text=True, capture_output=True, timeout=1800)
                  if result.returncode:
                      raise SystemExit(result.stderr[-3000:])
                  return time.perf_counter() - started

          rows = []
          for track, seed in [('coil', 86), ('coil', 5), ('circle', 10)]:
              run('round117-baseline.jar', track, seed)
              run('round117-candidate.jar', track, seed)
              baseline, candidate = [], []
              for index in range(5):
                  if index % 2:
                      baseline.append(run('round117-baseline.jar', track, seed))
                      candidate.append(run('round117-candidate.jar', track, seed))
                  else:
                      candidate.append(run('round117-candidate.jar', track, seed))
                      baseline.append(run('round117-baseline.jar', track, seed))
              ratio = statistics.median(candidate) / statistics.median(baseline)
              row = {'track': track, 'seed': seed, 'ratio': ratio,
                     'baseline': baseline, 'candidate': candidate}
              rows.append(row)
              if ratio > 1.75:
                  raise SystemExit(f'runtime regression: {row}')
          Path('round117-runtime.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round117-runtime
          path: round117-runtime.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round117-result-*
          path: round117-results
          merge-multiple: true
      - name: Enforce exact no-regression policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          summary = {'pairs': 0, 'counts': {}, 'net_moves': 0,
                     'events': [], 'runtime_ratios': {}}
          for path in sorted(Path('round117-results').glob('*.json')):
              data = json.load(open(path))
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          Path('round117-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          counts = summary['counts']
          bad = sum(counts.get(key, 0) for key in (
              'slower', 'safety_regression', 'redistribution', 'aggregate_faster'))
          by_case = {(event['track'], event['seed']): event['classification']
                     for event in summary['events']}
          assert summary['pairs'] == 3500, summary
          assert bad == 0, summary
          assert counts.get('pareto_faster', 0) >= 1, summary
          assert by_case.get(('coil', 86)) == 'pareto_faster', summary
          assert ('coil', 5) not in by_case and ('coil', 22) not in by_case, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round117-summary
          path: round117-summary.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, runtime, summarize]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round117-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round117-summary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round117-runtime
          path: .
      - name: Materialize and publish verified production commit
        run: |
          cp tracks/round117_apply.py /tmp/round117_apply.py
          cp tracks/round117_publish.py /tmp/round117_publish.py
          EXPECTED=$(cat round117-base-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
          git checkout -B round117-production origin/master
          python /tmp/round117_apply.py
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python /tmp/round117_publish.py
          python tests/ai1_six_ahead_accel_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tr/logic/RaceAi.java tests/ai1_six_ahead_accel_regression.py \
            AI_DEVELOPMENT.md racing-memory.md
          git commit -m 'Round 117: certify exact-six-ahead acceleration'
          git push origin HEAD:master
