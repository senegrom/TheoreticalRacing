name: Materialize Round 103 Zigzag rescue

on:
  push:
    branches:
      - agent/ai-racing-speed-103-controller
    paths:
      - .github/workflows/round103-materialize-zigzag.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BRANCH: agent/ai-racing-speed-103-zigzag-rescue
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Start from the exact live master
        run: |
          git fetch origin master
          git checkout -B "$PRODUCTION_BRANCH" origin/master
          git rev-parse origin/master | tee /tmp/base-sha
      - name: Apply the bounded six-rival confirmation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tr/logic/RaceAi.java')
          source = path.read_text(encoding='utf-8')

          old_latch = '\tprivate static boolean\t\t\tinTrueRivalConfirm;'
          new_latch = '\tprivate boolean\t\t\t\tinTrueRivalConfirm;'
          assert source.count(old_latch) == 1
          source = source.replace(old_latch, new_latch, 1)

          old_target = '''\t\t\t\t\t\t\tAI1_TRUE_CONFIRM_ROUNDS, simFinishVanish, exactSelf, exactRivals, true,
          \t\t\t\t\t\t\tscorerSelf, true, scorerCap, null, null, null) >= 0;'''
          new_target = '''\t\t\t\t\t\t\tAI1_TRUE_CONFIRM_ROUNDS, simFinishVanish, exactSelf, exactRivals, true,
          \t\t\t\t\t\t\tscorerSelf, true, Math.max(scorerCap, AI1_DEEP_CERT_RIVALS),
          \t\t\t\t\t\t\tnull, null, null) >= 0;'''
          assert source.count(old_target) == 1
          source = source.replace(old_target, new_target, 1)

          old_ai2 = '''\t\t\t\t\t\t\t\tif (deepChoice == chosen)
          \t\t\t\t\t\t\t\t\tdeepChoice = dangerJointSearch(pos, vel, playerNum, chosen, true, true,
          \t\t\t\t\t\t\t\t\t\t\ttrue, true, AI1_DEEP_HORIZON);'''
          new_ai2 = '''\t\t\t\t\t\t\t\tif (deepChoice == chosen)
          \t\t\t\t\t\t\t\t\tdeepChoice = dangerJointSearch(pos, vel, playerNum, chosen, true, true,
          \t\t\t\t\t\t\t\t\t\t\ttrue, true, AI1_DEEP_HORIZON, AI1_SCORER_MAXRIVALS,
          \t\t\t\t\t\t\t\t\t\t\tfalse, false, true);'''
          assert source.count(old_ai2) == 1
          source = source.replace(old_ai2, new_ai2, 1)

          anchor = '''\t\tif (trueDead && best != null) {
          \t\t\t// Round 99: the cheap world proposed the switch target; make the
          '''
          replacement = '''\t\tif (trueDead && best != null) {
          \t\t\t// Round 103: target confirmation uses at least the existing six-rival
          \t\t\t// deep certificate. Zigzag seed 76 proved the nearest-three net can
          \t\t\t// omit a box-forming rival and accept a false survivor. The wider net
          \t\t\t// is paid only after a cheap-dead verdict proposes a switch.
          \t\t\t// Round 99: the cheap world proposed the switch target; make the
          '''
          assert source.count(anchor) == 1
          source = source.replace(anchor, replacement, 1)
          path.write_text(source, encoding='utf-8')

          test = '''#!/usr/bin/env python3
          """Pin Round 103's six-rival true-confirmation rescue for both agents."""
          from pathlib import Path
          import sys
          import tempfile

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "tracks"))
          import bench_ai  # noqa: E402

          EXPECTED = (7, 0, [65, 65, 65, 66, 67, 67, 68])

          def main() -> int:
              if not Path(bench_ai.JAR).is_file():
                  raise SystemExit("theoreticRacing.jar not found; run build_main.sh first")
              results = {}
              with tempfile.TemporaryDirectory(prefix="true-confirm-r103-") as directory:
                  bench_ai.configure_runtime(directory)
                  bench_ai.set_nplayers(8)
                  for kind in ("AI1", "AI2"):
                      bench_ai.set_all_to(kind)
                      results[kind] = bench_ai.run_track("zigzag", timeout=1800, seed=76)
              for kind, actual in results.items():
                  if actual != EXPECTED:
                      raise SystemExit(
                          f"Round-103 Zigzag seed-76 {kind} regression: {actual}, expected {EXPECTED}"
                      )
              if results["AI1"] != results["AI2"]:
                  raise SystemExit(f"Round-103 agent identity lost: {results}")
              print("AITrueRivalConfirmationRegression: OK (Zigzag s76 7 finishers, 0 crashes)")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          import textwrap
          Path('tests/ai_true_rival_confirmation_regression.py').write_text(
              textwrap.dedent(test), encoding='utf-8'
          )

          development = Path('AI_DEVELOPMENT.md')
          text = development.read_text(encoding='utf-8')
          section = '''

          ## Round 103: six-rival switch-target confirmation

          A cheap danger rollout can propose a survivor after declaring the incumbent
          dead. Round 103 preserves that asymmetric design but confirms the proposed
          switch against at least the established six-rival deep certificate instead of
          the nearest-three set. Zigzag seed 76 showed that the omitted fourth-to-sixth
          rival can complete the box: the three-rival world accepted NE, while the wider
          faithful world rejects it and selects a genuine survivor. Both AI1 and AI2 now
          finish seven cars with zero crashes on that boundary. The true-confirmation
          latch is instance-scoped, so concurrent games cannot suppress each other.
          '''
          development.write_text(text.rstrip() + textwrap.dedent(section) + '\n', encoding='utf-8')
          PY
      - name: Verify the exact production tree
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python tests/ai_true_rival_confirmation_regression.py
          python -m compileall -q tracks tests
          git diff --check
      - name: Commit, push, and open a draft PR
        run: |
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git add src/tr/logic/RaceAi.java tests/ai_true_rival_confirmation_regression.py AI_DEVELOPMENT.md
          git commit -m 'Round 103: confirm switch targets against six rivals'
          git push --force-with-lease origin HEAD:"$PRODUCTION_BRANCH"
          cat > /tmp/pr-body.md <<'EOF'
          ## What changed

          - Widen the rare true-rival confirmation of a proposed danger-search switch target from the caller's nearest-three set to at least the existing six-rival deep certificate.
          - Mirror the existing true-confirmation path into AI2's equivalent deep fallback.
          - Make the true-confirmation recursion latch instance-scoped.
          - Add a deterministic Zigzag seed-76 regression for both agents.

          ## Verified boundary

          The prior champion produced six finishers and one crash. The candidate produces seven finishers, zero crashes, and identical AI1/AI2 results: `[65, 65, 65, 66, 67, 67, 68]`.

          ## Validation

          The production branch is created from live `master` and passes the Java tests/build, headless smoke, frozen golden corpus, every permanent AI regression, the new mirrored regression, Python compilation, and whitespace checks before push. A separate exact all-track differential and runtime gate is running on the research branch.
          EOF
          existing=$(gh pr list --head "$PRODUCTION_BRANCH" --base master --state open --json url --jq '.[0].url // empty')
          if [ -z "$existing" ]; then
            gh pr create --draft --base master --head "$PRODUCTION_BRANCH" \
              --title 'Round 103: confirm switch targets against six rivals' \
              --body-file /tmp/pr-body.md | tee /tmp/pr-url
          else
            printf '%s\n' "$existing" | tee /tmp/pr-url
          fi
          printf '{"base":"%s","head":"%s","pr":"%s"}\n' \
            "$(cat /tmp/base-sha)" "$(git rev-parse HEAD)" "$(cat /tmp/pr-url)" \
            > round103-materialization.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round103-materialization
          path: round103-materialization.json
          if-no-files-found: warn
          retention-days: 30
