name: Materialize Round 95 and Round 96 evidence

on:
  push:
    branches:
      - agent/ai-racing-speed-96-champion-promotion
    paths:
      - .github/workflows/materialize-round96-docs.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Apply exact evidence ledger
        run: |
          printf '%s  %s\n' 'f3362fe3d5048e029a20fcfe82d2682eee5ae15b7c5f58586fecd0797d402458' round95-96-docs.patch | sha256sum -c -
          git apply --check round95-96-docs.patch
          git apply round95-96-docs.patch
          git diff --check
      - name: Commit evidence ledger
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add AI_DEVELOPMENT.md racing-memory.md
          git diff --cached --check
          git commit -m 'Record Round 95 and Round 96 promotion evidence'
          git push origin HEAD
