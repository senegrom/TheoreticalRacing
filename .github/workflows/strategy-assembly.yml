name: Assemble strategy research
on:
  push:
    branches: [work/racecraft-strategies-20261008]
    paths: ['.strategies-20261008/**', '.github/workflows/strategy-assembly.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strategy-assembly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/work/racecraft-strategies-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Recover research foundation without losing current champion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 6ec439ae29ca037b013451c368c3d23799e834e5
          if ! git merge-base --is-ancestor 6ec439ae29ca037b013451c368c3d23799e834e5 HEAD; then
            git merge --no-commit --no-ff 6ec439ae29ca037b013451c368c3d23799e834e5 || true
            python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          if 'racing-memory.md' in files:
              current=subprocess.check_output(['git','show','b907126230b0c5a71c91b62430fa32469e58b895:racing-memory.md'],text=True)
              old=subprocess.check_output(['git','show','6ec439ae29ca037b013451c368c3d23799e834e5:racing-memory.md'],text=True)
              research=old[old.index('\n## '):old.index('\n## Round 300a promoted')]
              title,rest=current.split('\n',1)
              Path('racing-memory.md').write_text(title+'\n'+research+'\n'+rest)
              subprocess.run(['git','add','racing-memory.md'],check=True)
          PY
            python3 .strategies-20261008/resolve.py
            if test -n "$(git diff --name-only --diff-filter=U)"; then
              git diff --cc
              exit 1
            fi
          fi
          python3 .strategies-20261008/apply.py
          python3 .strategies-20261008/fixups.py
          git diff --check
      - name: Build and contracts
        shell: bash
        run: |
          set -euo pipefail
          sh build_main.sh
          sh run_tests.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit tested source to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git add src tests tools docs run_tests.sh racing-memory.md
          git diff --cached --check
          git diff --exit-code b907126230b0c5a71c91b62430fa32469e58b895 -- tracks/ user.properties
          if ! git diff --cached --quiet || test -f .git/MERGE_HEAD; then
            git commit -m 'Integrate current champion and add six isolated strategy experiments'
            git push origin HEAD:work/racecraft-strategies-20261008
          fi
