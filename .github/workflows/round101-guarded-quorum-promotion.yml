name: Round 101 guarded-quorum promotion

on:
  push:
    branches:
      - agent/ai-racing-speed-101-guarded-quorum
    paths:
      - .github/workflows/round101-guarded-quorum-promotion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build normalized current-master baseline
        run: |
          git fetch origin master
          git worktree add /tmp/round101-baseline origin/master
          cd /tmp/round101-baseline
          python - <<'PYBASE'
          from pathlib import Path
          path = Path('src/tr/logic/RaceAi.java')
          source = path.read_text()
          old = "\tprivate static boolean\t\t\tinTrueRivalConfirm;"
          new = "\tprivate boolean\t\t\t\tinTrueRivalConfirm;"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new, 1))
          PYBASE
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round101-baseline.jar"
      - name: Build and verify candidate
        run: |
          python tracks/round101_guarded_quorum_patch.py
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python tests/ai1_guarded_field_pace_regression.py
          python -m compileall -q tracks tests
          cp theoreticRacing.jar round101-candidate.jar
      - uses: actions/upload-artifact@v4
        with:
          name: round101-promotion-jars
          path: |
            round101-baseline.jar
            round101-candidate.jar
          if-no-files-found: error

  runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round101-promotion-jars
      - name: Alternate target and exact-control order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import statistics
          import subprocess
          import tempfile
          import time

          root = Path.cwd()
          jars = {
              'baseline': root / 'round101-baseline.jar',
              'candidate': root / 'round101-candidate.jar',
          }

          def props(path):
              lines = []
              for line in (root / 'tracks' / 'bench.properties').read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar, track, seeds, tag, directory):
              property_file = directory / f'{tag}.properties'
              props(property_file)
              log = directory / f'{tag}.log'
              started = time.perf_counter()
              result = subprocess.run([
                  'java', '-Djava.awt.headless=true', '-jar', str(jar), '--auto',
                  '--track', track, '--props', str(property_file), '--log', str(log),
                  '--seed', seeds,
              ], text=True, capture_output=True, timeout=1800)
              elapsed = time.perf_counter() - started
              if result.returncode:
                  raise RuntimeError(result.stderr[-2000:])
              return elapsed

          def trimmed(values):
              ordered = sorted(values)
              return statistics.mean(ordered[1:-1]) if len(ordered) > 2 else statistics.mean(ordered)

          records = {}
          with tempfile.TemporaryDirectory(prefix='r101-runtime-') as raw:
              directory = Path(raw)
              for name, jar in jars.items():
                  run(jar, 'circle', '1', f'warm-{name}', directory)
              for track, seeds in [('coil', '1-15'), ('hairpin', '1-15')]:
                  times = {'baseline': [], 'candidate': []}
                  for pair in range(6):
                      order = ('baseline', 'candidate') if pair % 2 == 0 else ('candidate', 'baseline')
                      for name in order:
                          times[name].append(run(
                              jars[name], track, seeds, f'{track}-{pair}-{name}', directory
                          ))
                  records[track] = {
                      'times': times,
                      'baseline_median': statistics.median(times['baseline']),
                      'candidate_median': statistics.median(times['candidate']),
                      'median_ratio': statistics.median(times['candidate']) / statistics.median(times['baseline']),
                      'baseline_trimmed': trimmed(times['baseline']),
                      'candidate_trimmed': trimmed(times['candidate']),
                      'trimmed_ratio': trimmed(times['candidate']) / trimmed(times['baseline']),
                  }
          Path('round101-runtime.json').write_text(json.dumps(records, indent=2, sort_keys=True) + '\n')
          print(json.dumps(records, indent=2, sort_keys=True))
          for track, data in records.items():
              if data['median_ratio'] > 1.15 or data['trimmed_ratio'] > 1.15:
                  raise SystemExit(f'material runtime regression on {track}: {data}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round101-runtime
          path: round101-runtime.json
          if-no-files-found: error

  battery:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 8-car seeds 1-5
            command: python tracks/bench_ai.py --seed-start 1 --seeds 5
            artifact: r101-promotion-8car-s1-5
          - label: 8-car seeds 6-10
            command: python tracks/bench_ai.py --seed-start 6 --seeds 5
            artifact: r101-promotion-8car-s6-10
          - label: 8-car seeds 11-15
            command: python tracks/bench_ai.py --seed-start 11 --seeds 5
            artifact: r101-promotion-8car-s11-15
          - label: 4v4 mixed seeds 1-5
            command: python tracks/bench_ai.py --h2h --seed-start 1 --seeds 5
            artifact: r101-promotion-h2h-s1-5
          - label: 4v4 mixed seeds 6-10
            command: python tracks/bench_ai.py --h2h --seed-start 6 --seeds 5
            artifact: r101-promotion-h2h-s6-10
          - label: 4v4 mixed seeds 11-15
            command: python tracks/bench_ai.py --h2h --seed-start 11 --seeds 5
            artifact: r101-promotion-h2h-s11-15
          - label: 2v2 mixed seeds 1-5
            command: python tracks/bench_ai.py --4p --seed-start 1 --seeds 5
            artifact: r101-promotion-2v2-s1-5
          - label: 1v1 seeds 1-5
            command: python tracks/bench_ai.py --1v1 --seed-start 1 --seeds 5
            artifact: r101-promotion-1v1-s1-5
          - label: 4-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 4car 1
            artifact: r101-promotion-homogeneous-4car-s1-5
          - label: 2-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 2car 1
            artifact: r101-promotion-homogeneous-2car-s1-5
          - label: Slow synthetic seeds 1-5
            command: python tracks/bench_ai.py --slow --seed-start 1 --seeds 5
            artifact: r101-promotion-slow-s1-5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round101-promotion-jars
      - name: Install exact candidate jar
        run: cp round101-candidate.jar theoreticRacing.jar
      - name: Run ${{ matrix.label }}
        shell: bash
        run: ${{ matrix.command }} | tee promotion-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: promotion-report.txt
          if-no-files-found: error
