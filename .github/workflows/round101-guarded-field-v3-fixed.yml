name: Round 101 guarded-field v3 fixed differential

on:
  push:
    branches:
      - agent/ai-racing-speed-101-guarded-field-v3
    paths:
      - .github/workflows/round101-guarded-field-v3-fixed.yml
      - tracks/round101_guarded_field_v3.patch
      - tracks/round101_compare_current.py
      - tracks/round101_compare_exact.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact current-AI1 baseline
        run: |
          sh ./build_main.sh
          mv theoreticRacing.jar round101-baseline.jar
      - name: Apply and verify candidate
        run: |
          git apply --check tracks/round101_guarded_field_v3.patch
          git apply tracks/round101_guarded_field_v3.patch
          sh ./run_tests.sh
          sh ./build_main.sh
          mv theoreticRacing.jar round101-candidate.jar
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: round101-v3-fixed-jars
          path: |
            round101-baseline.jar
            round101-candidate.jar
          if-no-files-found: error
          retention-days: 3

  differential:
    needs: verify
    name: Differential ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { track: circle, end: 75 }
          - { track: triangle, end: 75 }
          - { track: curve, end: 75 }
          - { track: hairpin, end: 100 }
          - { track: chicane, end: 75 }
          - { track: sprint, end: 75 }
          - { track: bigoval, end: 75 }
          - { track: slalom, end: 75 }
          - { track: gear, end: 75 }
          - { track: coil, end: 75 }
          - { track: zigzag, end: 75 }
          - { track: the_long_loop, end: 75 }
          - { track: monaco, end: 75 }
          - { track: hungaroring, end: 75 }
          - { track: interlagos, end: 75 }
          - { track: lemans, end: 75 }
          - { track: spa, end: 75 }
          - { track: silverstone, end: 75 }
          - { track: monza, end: 75 }
          - { track: zandvoort, end: 100 }
          - { track: nurburgring, end: 75 }
          - { track: spielberg, end: 75 }
          - { track: serpentine, end: 25 }
          - { track: serpentine2, end: 25 }
          - { track: spiral, end: 25 }
          - { track: cog, end: 25 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round101-v3-fixed-jars
          path: .
      - name: Compare exact current AI1 against candidate AI1
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end }}
        run: |
          python tracks/round101_compare_current.py \
            --baseline round101-baseline.jar \
            --candidate round101-candidate.jar \
            --track "$TRACK" \
            --end "$END_SEED" \
            --out "round101-v3-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round101-v3-fixed-${{ matrix.track }}
          path: round101-v3-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30
