name: Round 228 refreshed regression verification
on:
  push:
    branches: [codex/racecraft-zero-validation]
    paths:
      - .github/workflows/racecraft-zero-verify.yml
      - docs/experiments/round228/fixtures.patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: round228-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pins:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        test:
          - ai1_bounded_uncertain_field_regression
          - ai1_energy_pace_regression
          - ai1_field_neutral_regression
          - ai1_finish_sprint_true_confirm_regression
          - ai1_pace_regression
          - ai1_private_slack_regression
          - ai1_staged_pace_regression
          - ai1_thin_ridge_regression
          - golden_races
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build production candidate
        run: |
          git apply --check docs/experiments/round228/production.patch
          git apply docs/experiments/round228/production.patch
          git apply --check docs/experiments/round228/fixtures.patch
          git apply docs/experiments/round228/fixtures.patch
          sh build_main.sh
          mkdir -p results
          sha256sum theoreticRacing.jar docs/experiments/round228/production.patch > results/build-sha256.txt
      - name: Verify measured expectations
        env:
          TEST: ${{ matrix.test }}
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
        run: |
          if [ "$TEST" = golden_races ]; then
            python -u docs/experiments/round228/capture.py tests/golden_races.py results
            cp tests/golden_races.json results/golden_races.json
          else
            python -u docs/experiments/round228/capture.py "tests/$TEST.py" results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round228-verified-${{ matrix.test }}
          path: results
          if-no-files-found: error
          retention-days: 7
