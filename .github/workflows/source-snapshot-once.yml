name: Finalize primitive AI workspace optimization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/source-snapshot-once.yml

permissions:
  contents: write

concurrency:
  group: finalize-int-array-optimization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconstruct and apply the verified allocation-only patch
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'e30b686737f2db0eaa4780ddb66d934a99a9a3b97cb936b971f4056642f9cc7b' \
            'src/tr/logic/RaceAi.java' | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          import hashlib

          source = Path('.github/int-array-optimization/RaceAi.patch.xz.b64').read_bytes()
          target = bytes.fromhex(
              'c50980fc74cc9b17866b217c9fc1da4fe4f193a5ca9740dc212d18ed279c5b8b'
          )
          output = Path('/tmp/RaceAi.patch.xz.b64')

          if hashlib.sha256(source).digest() == target:
              output.write_bytes(source)
              print('Transport payload already matched its SHA-256.')
          else:
              if len(source) != 14_391:
                  raise SystemExit(
                      f'Unexpected transport length {len(source)}; expected 14,391.'
                  )
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              repaired = None
              repaired_at = None
              repaired_char = None
              for index in range(len(source) + 1):
                  prefix = source[:index]
                  suffix = source[index:]
                  for char in alphabet:
                      candidate = prefix + bytes((char,)) + suffix
                      if hashlib.sha256(candidate).digest() == target:
                          repaired = candidate
                          repaired_at = index
                          repaired_char = chr(char)
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise SystemExit('No one-character repair matched the expected SHA-256.')
              output.write_bytes(repaired)
              print(
                  'Reconstructed the unique checksum-valid payload '
                  f'by inserting {repaired_char!r} at byte {repaired_at}.'
              )
          PY
          printf '%s  %s\n' \
            'c50980fc74cc9b17866b217c9fc1da4fe4f193a5ca9740dc212d18ed279c5b8b' \
            '/tmp/RaceAi.patch.xz.b64' | sha256sum --check -
          base64 --decode /tmp/RaceAi.patch.xz.b64 \
            | xz --decompress > /tmp/RaceAi.patch
          printf '%s  %s\n' \
            '78a375ccd336991ba3e19c3d47be63f977a5fa78cc1d8549771847cbe7ef2598' \
            '/tmp/RaceAi.patch' | sha256sum --check -
          git apply --check /tmp/RaceAi.patch
          git apply /tmp/RaceAi.patch
          git diff --check
          printf '%s  %s\n' \
            'ea08539bb494149c4ed37702e65a27ad1d44edc844356058279dd03d13c21549' \
            'src/tr/logic/RaceAi.java' | sha256sum --check -
      - name: Run the full JDK 25 regression suite
        run: |
          set -euo pipefail
          sh ./run_tests.sh
          sh ./run_golden_tests.sh
          python -m compileall -q tracks tests
          python -m unittest discover -s tests -p 'test_*.py'
          sh -n build_main.sh run_tests.sh run_golden_tests.sh
      - name: Publish the verified source tree to an isolated branch
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tr/logic/RaceAi.java
          git commit \
            -m 'Reuse primitive AI simulation workspaces' \
            -m 'Reuse candidate, prediction, two-round, rollout, scorer and matching buffers while preserving exact scoring, move ordering, tie-breaks and state restoration.'
          branch="automation/int-array-finalized-${GITHUB_SHA::12}"
          git push origin "HEAD:refs/heads/$branch"
