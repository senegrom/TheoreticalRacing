name: One-shot source snapshot

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/source-snapshot-once.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Archive exact tracked source
        run: git archive --format=zip --output=source-snapshot.zip "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-once
          path: source-snapshot.zip
          if-no-files-found: error
          retention-days: 1
