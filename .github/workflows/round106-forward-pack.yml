name: Round 106 guarded forward-pack pace

on:
  push:
    branches: [master]
    paths:
      - tracks/round106_forward_pack_materialize.py
      - .github/workflows/round106-forward-pack.yml

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Materialize candidate
        run: python tracks/round106_forward_pack_materialize.py
      - name: Build and core regression gates
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
      - name: Pin measured pace wins and long-range veto
        run: |
          # Retry after a GitHub-hosted runner setup failure on the first attempt.
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          root = Path.cwd()
          expected = {
              ('coil', 9): 423,
              ('spa', 7): 578,
              ('silverstone', 56): 586,
              ('interlagos', 40): 878,
          }
          with tempfile.TemporaryDirectory(prefix='r106-pack-') as directory:
              tmp = Path(directory)
              props = tmp / 'AI1.properties'
              text = (root / 'tracks' / 'bench.properties').read_text()
              text = re.sub(r'^(player[1-8]Kind)=.*$', r'\1=AI1', text, flags=re.M)
              props.write_text(text)
              for (track, seed), wanted in expected.items():
                  log = tmp / f'{track}-{seed}.log'
                  subprocess.check_call([
                      'java', '-Djava.awt.headless=true', '-jar', 'theoreticRacing.jar', '--auto',
                      '--track', track, '--props', str(props), '--log', str(log), '--seed', str(seed)
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=180)
                  moves, finishes, crashes = {}, [], 0
                  for line in log.read_text().splitlines():
                      match = re.match(r'^(\d+) p(\d+) ', line)
                      if not match:
                          continue
                      player = int(match.group(2))
                      moves[player] = moves.get(player, 0) + 1
                      if 'FINISH' in line:
                          finishes.append(moves[player])
                      elif 'CRASH' in line:
                          crashes += 1
                  total = sum(finishes)
                  print(track, seed, 'moves=', total, 'finishers=', len(finishes), 'crashes=', crashes)
                  if total != wanted or len(finishes) != 7 or crashes != 0:
                      raise SystemExit(f'{track} seed {seed}: expected {wanted}/7/0, got {total}/{len(finishes)}/{crashes}')
          PY
      - name: Commit verified source to master
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tr/logic/RaceAi.java
          git commit -m 'Round 106: guarded forward-pack acceleration'
          git push origin HEAD:master
