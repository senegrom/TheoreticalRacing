name: Round 122 trap-L2 Pareto screen

on:
  push:
    branches:
      - agent/ai-racing-speed-122-trap-pareto
    paths:
      - .github/workflows/round122-trap-pareto-screen.yml
      - tracks/round122_apply.py
      - tracks/round121_apply.py
      - tracks/round121_compare.py

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master baseline and candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round122-base-sha.txt
          test "$(cat round122-base-sha.txt)" = '3f059b3778570541d62322e4f17905af6a53192b'
          git worktree add /tmp/round122-work origin/master
          cd /tmp/round122-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round122-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round122_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'trapByDir\[d.ordinal()\] <= 0.0' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round122-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
      - name: Replay the old gain and all old counterexample bands
        run: |
          mkdir round122-results
          for track in silverstone spa; do
            python tracks/round121_compare.py \
              --baseline round122-baseline.jar --candidate round122-candidate.jar \
              --track "$track" --start 1 --end 150 \
              --out "round122-results/${track}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': '3f059b3778570541d62322e4f17905af6a53192b',
              'candidate': 'trap_l2_per_rival_pareto',
              'pairs': 0,
              'counts': {},
              'events': [],
              'net_moves': 0,
          }
          for path in sorted(Path('round122-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          summary['bad'] = bad
          summary['promising'] = (
              summary['pairs'] == 300 and bad == 0
              and summary['counts'].get('pareto_faster', 0) > 0
          )
          Path('round122-target-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Publish measured screen
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round122-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-122-trap-pareto
          git add round122-target-summary.json round122-run-id.txt
          git commit -m 'Record Round 122 target screen'
          git push origin HEAD:agent/ai-racing-speed-122-trap-pareto
