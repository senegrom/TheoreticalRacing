name: Clean temporary master review branches

on:
  push:
    branches:
      - agent/ai-racing-speed-78
    paths:
      - .github/workflows/cleanup-master-review-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Delete temporary branches and workflow
        run: |
          git push origin --delete agent/master-review-round4 agent/master-review-round5
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/cleanup-master-review-branches.yml
          git commit -m "Remove temporary master review cleanup"
          git push origin HEAD:agent/ai-racing-speed-78
