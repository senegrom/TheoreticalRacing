name: Round 228 Nordschleife validation
on:
  push:
    branches: [codex/racecraft-zero-validation]
    paths:
      - .github/workflows/racecraft-zero-nordschleife.yml
      - docs/experiments/round228/candidate.patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: round228-nordschleife-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fleet:
    name: ${{ matrix.mode }} / ${{ matrix.slots }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - mode: legacy
            slots: odd
          - mode: informed
            slots: odd
          - mode: scatter
            slots: odd
          - mode: legacy
            slots: even
          - mode: informed
            slots: even
          - mode: scatter
            slots: even
          - mode: legacy
            slots: all
          - mode: informed
            slots: all
          - mode: scatter
            slots: all
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build isolated mixed-field candidate
        run: |
          git apply --check docs/experiments/round228/candidate.patch
          git apply docs/experiments/round228/candidate.patch
          sh build_main.sh
          mkdir -p results
          java --version > results/java-version.txt 2>&1
          sha256sum theoreticRacing.jar docs/experiments/round228/candidate.patch > results/build-sha256.txt
      - name: Prepare profile
        env:
          MODE: ${{ matrix.mode }}
          SLOTS: ${{ matrix.slots }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          slots = {'odd': '1,3,5,7', 'even': '2,4,6,8', 'all': '1,2,3,4,5,6,7,8'}[os.environ['SLOTS']]
          text = Path('tracks/lap_bench.properties').read_text()
          text += '\naiStartPlacement=' + os.environ['MODE'] + '\ncandidateSlots=' + slots + '\n'
          Path('results/profile.properties').write_text(text)
          PY
      - name: Full ten-seed fleet
        env:
          RACING_PROPS: ${{ github.workspace }}/results/profile.properties
          RACING_HEAP: -Xmx8g -XX:ActiveProcessorCount=2
          RACING_TRACKS: nordschleife
        run: sh tracks/fleet_grid.sh 1-10 1 results/fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round228-nordschleife-${{ matrix.mode }}-${{ matrix.slots }}
          path: results
          if-no-files-found: error
          retention-days: 7
