name: Observe Round 119 screen

on:
  push:
    branches:
      - agent/ai-racing-speed-119-six-ahead-moderate
    paths:
      - .github/workflows/round119-screen-observer.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record latest screen run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            'repos/${{ github.repository }}/actions/workflows/round119-six-ahead-moderate-screen.yml/runs?branch=agent%2Fai-racing-speed-119-six-ahead-moderate&per_page=5' \
            --jq '.workflow_runs[0] | {id,status,conclusion,head_sha,created_at,updated_at}' \
            > round119-screen-status.json
          cat round119-screen-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round119-screen-status.json
          git commit -m 'Record Round 119 screen status'
          git push origin HEAD:"$GITHUB_REF_NAME"
