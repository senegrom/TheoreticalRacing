name: Round 135 integer finish-intersection screen v2

on:
  push:
    branches:
      - agent/ai-racing-speed-135-integer-finish-screen
    paths:
      - .github/workflows/round135-integer-finish-screen-v2.yml
      - tracks/round135_finish_apply.py
      - tracks/round135_finish_apply_v2.py
      - tracks/round135_finish_runtime.py

permissions:
  contents: write

concurrency:
  group: round135-integer-finish-screen-v2
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round135-finish-v2-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round135-finish-v2-status.json
          git commit -m 'Round 135: record integer-finish v2 run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build current champion and integer-finish candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round135-finish-v2-base-sha.txt
          git worktree add /tmp/round135-finish-v2 "$BASE"
          cd /tmp/round135-finish-v2
          test "$(grep -c 'final PointContainmentCache pointContainmentCache' src/tr/logic/RaceGame.java)" = 1
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round135-finish-v2-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round135_finish_apply_v2.py"
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round135-finish-v2-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Run dual-order warm screen
        shell: bash
        run: |
          python tracks/round135_finish_runtime.py \
            --baseline round135-finish-v2-baseline.jar \
            --candidate round135-finish-v2-candidate.jar \
            --pairs 4 --out round135-finish-v2-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round135-integer-finish-screen-v2
          path: |
            round135-finish-v2-base-sha.txt
            round135-finish-v2-runtime.json
          if-no-files-found: warn
          retention-days: 30
