name: Round 232 equal-pace energy validation
on:
  push:
    branches: [codex/racecraft-own-progress]
    paths:
      - .github/workflows/racecraft-round232-energy.yml
      - docs/experiments/round232/energy-production.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    name: ${{ matrix.mode }} / ${{ matrix.slots }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slots: [all, odd, even]
        mode: [legacy, informed, scatter]
        shard: [regular, nordschleife]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and record
        env:
          ASSIGNMENT: ${{ matrix.slots }}
          MODE: ${{ matrix.mode }}
        run: |
          PATCH=docs/experiments/round232/screen.patch
          if [ "$ASSIGNMENT" = all ]; then PATCH=docs/experiments/round232/energy-production.patch; fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          sh build_main.sh
          mkdir results
          java --version > results/java-version.txt 2>&1
          sha256sum theoreticRacing.jar "$PATCH" > results/build-sha256.txt
          python - <<'PYCODE'
          import os
          from pathlib import Path
          slots={'odd':'1,3,5,7','even':'2,4,6,8','all':'1,2,3,4,5,6,7,8'}[os.environ['ASSIGNMENT']]
          props=Path('tracks/lap_bench.properties').read_text()
          props+='\naiStartPlacement='+os.environ['MODE']+'\ncandidateSlots='+slots+'\n'
          Path('results/profile.properties').write_text(props)
          PYCODE
      - name: Select disjoint track shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          tracks = sorted(p.stem for p in Path('tracks').glob('*.track'))
          selected = [t for t in tracks if (t == 'nordschleife') == (os.environ['SHARD'] == 'nordschleife')]
          assert len(selected) == (1 if os.environ['SHARD'] == 'nordschleife' else 83)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RACING_TRACKS=' + ' '.join(selected) + '\n')
          PYCODE
      - name: Race held-out seeds 21-30
        env:
          RACING_PROPS: ${{ github.workspace }}/results/profile.properties
          RACING_HEAP: ${{ matrix.shard == 'nordschleife' && '-Xmx8g' || '-Xmx4g' }} -XX:ActiveProcessorCount=2 ${{ matrix.slots == 'all' && '' || '-Dai.experiment.checkpointTie=3' }}
        run: sh tracks/fleet_grid.sh 21-30 ${{ matrix.shard == 'nordschleife' && '1' || '2' }} results/fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round232-energy-${{ matrix.mode }}-${{ matrix.slots }}-${{ matrix.shard }}
          path: results
          if-no-files-found: error
          retention-days: 14
