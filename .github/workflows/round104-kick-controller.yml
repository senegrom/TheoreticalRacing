name: Kick Round 104 controller

on:
  push:
    branches:
      - agent/ai-racing-speed-104-controller-final
    paths:
      - .github/workflows/round104-kick-controller.yml

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance a controller-watched source path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tracks/round104_candidate.py')
          text = path.read_text()
          marker = '# Round 104 controller kick: latest-head gate\n'
          if not text.endswith(marker):
              path.write_text(text.rstrip() + '\n\n' + marker)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git add tracks/round104_candidate.py
          git commit -m 'Run Round 104 gate at the latest controller head'
          git push origin HEAD:agent/ai-racing-speed-104-controller-final
