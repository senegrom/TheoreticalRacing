name: Relaunch corrected Round 109 branch audit

on:
  push:
    branches:
      - agent/ai-racing-speed-108-equal-speed-veto-gate
    paths:
      - .github/workflows/round109-audit-v3-trigger.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install corrected audit wrapper and trigger the normalized matrix
        run: |
          cp tracks/round109_audit_v3.py tracks/round109_audit_v2.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tracks/round109_audit_v2.py
          git commit -m 'Fix Round 109 branch-audit log discovery'
          git push origin HEAD:agent/ai-racing-speed-108-equal-speed-veto-gate
