name: Round 124 early-round trap-L2 acceleration screen

on:
  push:
    branches:
      - agent/ai-racing-speed-124-early-round-trap
    paths:
      - .github/workflows/round124-early-round-trap-screen.yml
      - tracks/round124_apply.py
      - tracks/round124_compare.py

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master baseline and candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round124-base-sha.txt
          test "$(cat round124-base-sha.txt)" = '3f059b3778570541d62322e4f17905af6a53192b'
          git worktree add /tmp/round124-work origin/master
          cd /tmp/round124-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round124-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round124_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'earlyRoundTrapFrontier' src/tr/logic/RaceAi.java)" = 2
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round124-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - name: Replay gain and all old counterexample bands
        run: |
          mkdir round124-results
          for track in silverstone spa; do
            python tracks/round124_compare.py \
              --baseline round124-baseline.jar --candidate round124-candidate.jar \
              --track "$track" --start 1 --end 150 \
              --out "round124-results/${track}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': '3f059b3778570541d62322e4f17905af6a53192b',
              'candidate': 'early_round_trap_l2',
              'pairs': 0,
              'counts': {},
              'events': [],
              'net_moves': 0,
              'runtime_ratios': {},
          }
          for path in sorted(Path('round124-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          summary['bad'] = bad
          summary['promising'] = (
              summary['pairs'] == 300 and bad == 0
              and summary['counts'].get('pareto_faster', 0) > 0
          )
          Path('round124-target-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['pairs'] == 300, summary
          PY
      - name: Publish measured target screen
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round124-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-124-early-round-trap
          git add round124-target-summary.json round124-run-id.txt
          git commit -m 'Record Round 124 target screen'
          git push origin HEAD:agent/ai-racing-speed-124-early-round-trap
