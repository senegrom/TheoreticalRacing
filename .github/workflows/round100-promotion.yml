name: Round 100 promotion battery

on:
  push:
    branches:
      - agent/ai-racing-speed-100-seal-pace-screen
    paths:
      - .github/workflows/round100-promotion.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply candidate
        run: |
          echo '0c07b3729603a1f1b6d1ced1e3f3038c155c8762b3cad8f491783f7bb04e879b  .github/round100-sealpace-refined.patch' | sha256sum -c -
          git apply --check .github/round100-sealpace-refined.patch
          git apply .github/round100-sealpace-refined.patch
      - run: sh ./run_tests.sh
      - run: sh ./build_main.sh
      - run: python tests/headless_smoke.py
      - run: python tests/golden_races.py
      - run: python tests/ai1_pace_regression.py
      - run: python tests/ai1_mixed_safety_regression.py
      - run: python tests/ai1_field_neutral_regression.py
      - run: python tests/ai1_staged_pace_regression.py
      - run: python tests/ai1_energy_pace_regression.py
      - run: python tests/ai1_cross_model_pace_regression.py
      - run: python tests/ai1_finish_frontier_regression.py
      - run: python tests/ai1_thread_fragility_regression.py
      - run: python -m compileall -q tracks tests

  battery:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 8-car seeds 1-5
            command: python tracks/bench_ai.py --seed-start 1 --seeds 5
            artifact: r100-8car-s1-5
          - label: 8-car seeds 6-10
            command: python tracks/bench_ai.py --seed-start 6 --seeds 5
            artifact: r100-8car-s6-10
          - label: 8-car seeds 11-15
            command: python tracks/bench_ai.py --seed-start 11 --seeds 5
            artifact: r100-8car-s11-15
          - label: 4v4 mixed seeds 1-5
            command: python tracks/bench_ai.py --h2h --seed-start 1 --seeds 5
            artifact: r100-h2h-s1-5
          - label: 4v4 mixed seeds 6-10
            command: python tracks/bench_ai.py --h2h --seed-start 6 --seeds 5
            artifact: r100-h2h-s6-10
          - label: 4v4 mixed seeds 11-15
            command: python tracks/bench_ai.py --h2h --seed-start 11 --seeds 5
            artifact: r100-h2h-s11-15
          - label: 2v2 mixed seeds 1-5
            command: python tracks/bench_ai.py --4p --seed-start 1 --seeds 5
            artifact: r100-2v2-s1-5
          - label: 1v1 seeds 1-5
            command: python tracks/bench_ai.py --1v1 --seed-start 1 --seeds 5
            artifact: r100-1v1-s1-5
          - label: 4-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 4car 1
            artifact: r100-homogeneous-4car-s1-5
          - label: 2-car homogeneous seeds 1-5
            command: python tracks/bench_iso.py 2car 1
            artifact: r100-homogeneous-2car-s1-5
          - label: Slow synthetic seeds 1-5
            command: python tracks/bench_ai.py --slow --seed-start 1 --seeds 5
            artifact: r100-slow-s1-5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build candidate
        run: |
          git apply .github/round100-sealpace-refined.patch
          sh ./build_main.sh
      - name: Run ${{ matrix.label }}
        run: ${{ matrix.command }} | tee report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: report.txt
          if-no-files-found: error
          retention-days: 14
