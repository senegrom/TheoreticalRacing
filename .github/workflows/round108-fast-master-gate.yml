name: Round 108 parallel master gate

on:
  push:
    branches:
      - agent/ai-racing-speed-108-equal-speed-veto-gate
    paths:
      - .github/workflows/round108-fast-master-gate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master baseline and candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round108-fast-base-sha.txt
          git worktree add /tmp/round108-fast-master origin/master
          cd /tmp/round108-fast-master
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round108-fast-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round108_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'Round 108 AI1 frontier:' src/tr/logic/RaceAi.java)" = 1
          test "$(grep -c 'Round 95: the topology-shaped model can false-kill a genuinely' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round108-fast.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round108-fast-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round108-fast-build
          path: |
            round108-fast-base-sha.txt
            round108-fast-baseline.jar
            round108-fast-candidate.jar
            round108-fast.patch
          if-no-files-found: error
          retention-days: 7

  differential:
    needs: verify
    name: Differential ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { track: circle, end: 150 }
          - { track: triangle, end: 150 }
          - { track: curve, end: 150 }
          - { track: hairpin, end: 150 }
          - { track: chicane, end: 150 }
          - { track: sprint, end: 150 }
          - { track: bigoval, end: 150 }
          - { track: slalom, end: 150 }
          - { track: gear, end: 150 }
          - { track: coil, end: 150 }
          - { track: zigzag, end: 150 }
          - { track: the_long_loop, end: 150 }
          - { track: monaco, end: 150 }
          - { track: hungaroring, end: 150 }
          - { track: interlagos, end: 150 }
          - { track: lemans, end: 150 }
          - { track: spa, end: 150 }
          - { track: silverstone, end: 150 }
          - { track: monza, end: 150 }
          - { track: zandvoort, end: 150 }
          - { track: nurburgring, end: 150 }
          - { track: spielberg, end: 150 }
          - { track: serpentine, end: 50 }
          - { track: serpentine2, end: 50 }
          - { track: spiral, end: 50 }
          - { track: cog, end: 50 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-fast-build
          path: .
      - name: Compare exact per-seed outcomes
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end }}
        run: |
          set +e
          python tracks/round108_compare.py \
            --baseline round108-fast-baseline.jar \
            --candidate round108-fast-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round108-fast-${TRACK}.json"
          RC=$?
          set -e
          test -s "round108-fast-${TRACK}.json"
          echo "compare_exit=$RC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round108-fast-result-${{ matrix.track }}
          path: round108-fast-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-fast-build
          path: .
      - name: Alternate candidate and baseline execution order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, statistics, subprocess, tempfile, time

          root = Path.cwd()
          source = root / 'tracks' / 'bench.properties'

          def props(path):
              lines = []
              for line in source.read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar, track, seed):
              with tempfile.TemporaryDirectory(prefix='r108-fast-time-') as directory:
                  tmp = Path(directory)
                  p = tmp / 'p.properties'
                  log = tmp / 'r.log'
                  props(p)
                  started = time.perf_counter()
                  cp = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(p), '--log', str(log),
                      '--seed', str(seed)
                  ], text=True, capture_output=True, timeout=1800)
                  if cp.returncode:
                      raise SystemExit(cp.stderr[-2000:])
                  return time.perf_counter() - started

          rows = []
          for track, seed in [('zandvoort', 115), ('lemans', 4), ('circle', 10)]:
              run('round108-fast-baseline.jar', track, seed)
              run('round108-fast-candidate.jar', track, seed)
              baseline, candidate = [], []
              for index in range(5):
                  if index % 2:
                      baseline.append(run('round108-fast-baseline.jar', track, seed))
                      candidate.append(run('round108-fast-candidate.jar', track, seed))
                  else:
                      candidate.append(run('round108-fast-candidate.jar', track, seed))
                      baseline.append(run('round108-fast-baseline.jar', track, seed))
              row = {
                  'track': track,
                  'seed': seed,
                  'ratio': statistics.median(candidate) / statistics.median(baseline),
                  'baseline': baseline,
                  'candidate': candidate,
              }
              rows.append(row)
              if row['ratio'] > 1.50:
                  raise SystemExit(f'runtime regression: {row}')
          Path('round108-fast-runtime.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round108-fast-runtime
          path: round108-fast-runtime.json
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: [differential, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: round108-fast-result-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: round108-fast-runtime
          path: results
      - name: Enforce exact no-regression policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {'pairs': 0, 'counts': {}, 'net_moves': 0, 'events': [], 'runtime_ratios': {}}
          reports = sorted(Path('results').glob('round108-fast-*.json'))
          reports = [p for p in reports if p.name != 'round108-fast-runtime.json']
          if len(reports) != 26:
              raise SystemExit(f'expected 26 differential reports, found {len(reports)}')
          for path in reports:
              data = json.load(open(path))
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              for event in data['events']:
                  summary['events'].append({'track': data['track'], **event})
          Path('round108-fast-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          bad = sum(summary['counts'].get(key, 0) for key in ('safety_regression', 'slower', 'redistribution'))
          if summary['pairs'] != 3500 or bad:
              raise SystemExit(f'Round 108 gate rejected: {summary}')
          if summary['counts'].get('safety_gain', 0) < 1:
              raise SystemExit(f'Round 108 target gain missing: {summary}')
          by_case = {(event['track'], event['seed']): event['classification'] for event in summary['events']}
          if by_case.get(('zandvoort', 115)) != 'safety_gain':
              raise SystemExit(f'Zandvoort 115 rescue missing: {summary}')
          if ('hungaroring', 144) in by_case or ('lemans', 4) in by_case:
              raise SystemExit(f'sensitive control changed: {summary}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round108-fast-summary
          path: round108-fast-summary.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, differential, runtime, summarize]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round108-fast-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round108-fast-summary
          path: .
      - name: Materialize verified production commit and fast-forward master
        run: |
          cp tracks/round108_apply.py /tmp/round108_apply.py
          cp tracks/round108_publish.py /tmp/round108_publish.py
          cp round108-fast-summary.json round108-summary.json
          EXPECTED=$(cat round108-fast-base-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
          git checkout -B round108-fast-production origin/master
          python /tmp/round108_apply.py
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python /tmp/round108_publish.py
          python tests/ai1_equal_speed_veto_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tr/logic/RaceAi.java tests/ai1_equal_speed_veto_regression.py AI_DEVELOPMENT.md racing-memory.md
          git commit -m 'Round 108: veto false equal-speed switch targets'
          git push origin HEAD:master
