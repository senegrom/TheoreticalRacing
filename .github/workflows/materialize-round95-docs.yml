name: Materialize Round 95 promotion notes

on:
  push:
    branches:
      - agent/ai-racing-speed-95-champion-promotion
    paths:
      - .github/workflows/materialize-round95-docs.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Apply exact promotion notes
        env:
          PATCH_B64: 
        run: |
          test "$(git rev-parse HEAD^)" = 526dbfd55e1ea41d26125cd092a69212eea495f0
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round95-docs.patch
          printf '%s  %s\n' 'c9fb649e6df22ceae9e9906679af6b9961ee267dc7f819c8a6334019a6ce0dd6' /tmp/round95-docs.patch | sha256sum -c -
          git apply --check /tmp/round95-docs.patch
          git apply /tmp/round95-docs.patch
          rm .github/workflows/materialize-round95-docs.yml
          ! grep -R 'PROMOTION_.*PLACEHOLDER' AI_DEVELOPMENT.md racing-memory.md
      - name: Commit notes
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add AI_DEVELOPMENT.md racing-memory.md .github/workflows/materialize-round95-docs.yml
          git commit -m 'Document Round 95 promotion evidence'
          git push origin HEAD:agent/ai-racing-speed-95-champion-promotion
