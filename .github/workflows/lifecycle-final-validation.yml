name: Validate final physical lifecycle repair
on:
  push:
    branches: [work/lifecycle-final-20260912]
permissions:
  contents: read
concurrency:
  group: lifecycle-final-20260912
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  JAVA_TOOL_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''
  _JAVA_OPTIONS: ''
jobs:
  verify:
    name: Final lifecycle JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 745798f613406790f88b44607a2a827ad7856a98
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact final source and audited golden fixtures
        run: git show "$GITHUB_SHA":.github/apply_lifecycle_final.sh | bash
      - name: Strict build and all Java contracts
        run: |
          sh run_tests.sh
          sh build_main.sh
          python tests/timeout_undo_regression.py
          python tests/cross_era_referee_regression.py
      - name: Python and real CLI contracts
        if: matrix.java == '25'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/headless_smoke.py
          python tests/query_replay_regression.py
          python tests/lap_progress_regression.py
          python tests/selfplay_profile_regression.py
          python tests/promotion_pair_regression.py
      - name: All measured goldens and all unchanged champion pins
        if: matrix.java == '25'
        run: |
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do echo "==> $test"; python "$test"; done
      - name: Native browser parity and tooling contracts
        if: matrix.java == '25'
        run: |
          python -m pip install Pillow
          sh web/build.sh
          python web/tests/parity.py
          python -m unittest discover -s web/tests -p 'test_*.py'
          node --test web/tests/engine.test.mjs
          python -m compileall -q tracks tests web/scripts
          sh -n run_tests.sh build_main.sh run_golden_tests.sh tracks/fleet_grid.sh
      - name: Preserve source and expectations
        run: git diff --exit-code
  transport:
    name: Transport final validated production source
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 745798f613406790f88b44607a2a827ad7856a98
          fetch-depth: 0
      - name: Prepare source without helper or measurement files
        run: |
          git show "$GITHUB_SHA":.github/apply_lifecycle_final.sh | bash
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare validated physical private-lane and terminal lifecycle repairs' -m 'Full-state physical occupancy, progress-aware referee transitions, last-survivor rollout termination and timeout Undo. Three isolated measured golden trajectory updates; all champion pin expectations unchanged. Final master publication also requires completed fleet review.'
          git push origin HEAD:refs/heads/work/lifecycle-final-20260912-source
          echo "Validated production tree f2f82ad80ff6fdcf0d1821b42f156038fa90f98b; source transport $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
