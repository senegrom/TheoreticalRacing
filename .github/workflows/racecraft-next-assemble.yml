name: Assemble racecraft outcome and opening branch
on:
  push:
    branches: [work/racecraft-outcomes-opening-20260928]
    paths:
      - '.racecraft-next/**'
      - '.github/workflows/racecraft-next-assemble.yml'
permissions:
  contents: write
concurrency:
  group: racecraft-next-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Integrate branch sources
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'private boolean lastResearchRankTime' src/tr/logic/RaceAi.java; then
            python3 .racecraft-next/integrate.py
            python3 .racecraft-next/finish.py
          fi
          python3 .racecraft-next/refine.py
          git diff --check
      - name: Build and contract tests
        shell: bash
        run: |
          set -euo pipefail
          sh build_main.sh 2>&1 | tee /tmp/racecraft-next-build.log
          sh run_tests.sh 2>&1 | tee /tmp/racecraft-next-java.log
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee /tmp/racecraft-next-python.log
      - name: Commit only the tested integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tr/logic run_tests.sh tools/racecraft_corpus.py tests/test_racecraft_corpus.py racing-memory.md
          if ! git diff --cached --quiet; then
            git commit -m 'Validate typed outcomes, independent placement and corpus identity'
            git push origin HEAD:work/racecraft-outcomes-opening-20260928
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: racecraft-next-contract-logs
          path: /tmp/racecraft-next-*.log
          retention-days: 7
