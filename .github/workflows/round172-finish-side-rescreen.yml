name: Round 172 finish-side rescreen

on:
  push:
    branches:
      - agent/ai-racing-speed-172-finish-side-rescreen
    paths:
      - .github/workflows/round172-finish-side-rescreen.yml

permissions:
  contents: write

concurrency:
  group: round172-finish-side-rescreen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record screen run id
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round172-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round172-status.json
          git commit -m 'Round 172: record finish-side rescreen' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master pair
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          git fetch origin '+refs/heads/agent/ai-racing-speed-153-finish-side-reject:refs/remotes/origin/agent/ai-racing-speed-153-finish-side-reject'
          git show origin/agent/ai-racing-speed-153-finish-side-reject:tracks/round153_apply.py > /tmp/round172_apply.py
          git show origin/agent/ai-racing-speed-153-finish-side-reject:tracks/round153_runtime.py > tracks/round172_runtime.py
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round172-base-sha.txt
          git worktree add /tmp/round172 "$BASE"
          cd /tmp/round172
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round172-baseline.jar"
          python /tmp/round172_apply.py
          git diff --name-only | sort > /tmp/round172-changed.txt
          printf '%s\n' src/tr/logic/RaceGame.java tests/tr/logic/CoreTests.java | sort > /tmp/round172-expected.txt
          diff -u /tmp/round172-expected.txt /tmp/round172-changed.txt
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round172-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
      - name: Measure seven-pair dual-order speed
        shell: bash
        run: |
          python tracks/round172_runtime.py \
            --baseline round172-baseline.jar \
            --candidate round172-candidate.jar \
            --pairs 7 --out round172-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round172-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round172-finish-side-rescreen
          path: |
            round172-base-sha.txt
            round172-runtime.json
          if-no-files-found: warn
          retention-days: 30
