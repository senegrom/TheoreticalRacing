name: Round 100 finish-seal pace screen

on:
  push:
    branches:
      - agent/ai-racing-speed-100-seal-pace-screen
    paths:
      - .github/workflows/round100-seal-pace-screen.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply candidate
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round100.patch
          echo '9eaa446aa5d2f15539783f729f1688fe8590d9ef46aa8a4215016985eddda50c  /tmp/round100.patch' | sha256sum -c -
          git apply --check /tmp/round100.patch
          git apply /tmp/round100.patch
      - name: Verify candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
      - uses: actions/upload-artifact@v4
        with:
          name: round100-candidate-jar
          path: theoreticRacing.jar
          if-no-files-found: error

  screen:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        track:
          - silverstone
          - monza
          - spa
          - monaco
          - spielberg
          - nurburgring
          - lemans
          - interlagos
          - zandvoort
          - hungaroring
          - circle
          - the_long_loop
          - sprint
          - hairpin
          - triangle
          - chicane
          - bigoval
          - curve
          - zigzag
          - coil
          - slalom
          - gear
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round100-candidate-jar
          path: candidate
      - name: Compare candidate AI1 to champion AI2
        env:
          TRACK: ${{ matrix.track }}
        run: |
          cp candidate/theoreticRacing.jar theoreticRacing.jar
          python tracks/bench_ai.py --seeds 5 "$TRACK" | tee "round100-${TRACK}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round100-${{ matrix.track }}
          path: round100-${{ matrix.track }}.txt
          if-no-files-found: error
