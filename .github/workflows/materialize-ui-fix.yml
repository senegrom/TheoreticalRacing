name: Materialize exact reviewed UI
on:
  push:
    branches: [master]
    paths: ['.github/workflows/materialize-ui-fix.yml']
permissions:
  contents: write
  actions: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore hash-verified reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          chunks = [
              '59fed812ffb2c66799fe7aeec7c56e9a68a99a46',
              'fd57aa533ef52a2a87dd784d4724df3e2acc5dc5',
              '69f91b1870843635def47f9073a90e025ee6bf72',
              'fc8654192deabbb13c15039085c592d979582365',
              '19406b284514dc5e68890d3f424258efeb37c6fb',
          ]
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/'
          parts = []
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(api + sha, headers=headers), timeout=30) as response:
                  obj = json.load(response)
              part = base64.b64decode(obj['content'])
              actual = hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest()
              assert actual == sha, (actual, sha)
              parts.append(part)
          packed = b''.join(parts)
          assert hashlib.sha256(packed).hexdigest() == '5d40b5fd965439a0ad9814f8279883ca8bc90428ec7cbfa9ebc11e77c0d5225e'
          raw = lzma.decompress(packed)
          expected = {
              'web/app.css': ('4d4831e4cf5465d7c83208abe8793999eef3b342d3f072c0b7875e2a29a67708', 'f5518643c541b0fae55b825de087ffcc85d4cd41'),
              'web/app.js': ('38f4fe8f26a189b76cdaf060a71a98c7a868edc8ef95f01431daf2a8b4d2fe54', 'fb68940f75a9549096a83f5bf29b396741487d45'),
              'web/tests/ui_e2e.py': ('7273f07b365be5156712038691e97666852269213059133cc679999b869b4daf', 'b42aee31d9389fecdd6e7f4895ad65db1b20a6b2'),
          }
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tf:
              members = {m.name: m for m in tf.getmembers() if m.isfile()}
              assert set(members) == set(expected), members.keys()
              for name, (digest, blob_sha) in expected.items():
                  data = tf.extractfile(members[name]).read()
                  assert hashlib.sha256(data).hexdigest() == digest
                  actual_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  assert actual_blob == blob_sha, (name, actual_blob, blob_sha)
                  path = pathlib.Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          PY
          node --check web/app.js
          python3 -m py_compile web/tests/ui_e2e.py
          rm .github/workflows/materialize-ui-fix.yml
          git add web/app.css web/app.js web/tests/ui_e2e.py .github/workflows/materialize-ui-fix.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          names = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = {'web/app.css','web/app.js','web/tests/ui_e2e.py','.github/workflows/materialize-ui-fix.yml'}
          assert names == expected, (names, expected)
          PY
      - name: Commit exact files without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'master advanced; refusing to overwrite'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(browser): restore exact reviewed UI source bytes"
          git push origin HEAD:master
          final=$(git rev-parse HEAD)
          echo "Published exact UI commit: $final"
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/browser.yml/dispatches \
            -d '{"ref":"master"}'
