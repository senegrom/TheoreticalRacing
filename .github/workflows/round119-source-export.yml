name: Round 119 live-source export

on:
  push:
    branches:
      - agent/ai-racing-speed-119-source-export
    paths:
      - .github/workflows/round119-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Archive exact live source
        run: |
          git rev-parse HEAD > round119-source-sha.txt
          tar --exclude=.git -czf round119-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: round119-live-source
          path: |
            round119-source.tar.gz
            round119-source-sha.txt
          if-no-files-found: error
          retention-days: 7
