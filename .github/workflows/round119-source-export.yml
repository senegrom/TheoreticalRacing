name: Round 119 live-source export

on:
  push:
    branches:
      - agent/ai-racing-speed-119-source-export
    paths:
      - .github/workflows/round119-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Archive exact live source
        run: |
          git rev-parse HEAD > round119-source-sha.txt
          tar --exclude=.git -czf round119-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: round119-live-source
          path: |
            round119-source.tar.gz
            round119-source-sha.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round119-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round119-run-id.txt
          git commit -m 'Record Round 119 source-export run'
          git push origin HEAD:"$GITHUB_REF_NAME"
