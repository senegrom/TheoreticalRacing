name: Assemble learning racecraft
on:
  push:
    branches: [work/racecraft-strategies-20261008]
    paths: ['.learning-20261015/**', '.github/workflows/learning-assembly.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: learning-assembly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/work/racecraft-strategies-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Strengthen learning state and behavioural checks
        run: python3 .learning-20261015/polish-run.py
      - name: Build and full contracts
        run: |
          set -eu
          sh build_main.sh
          sh run_tests.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Publish tested repairs to this research branch only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs racing-memory.md
          git diff --cached --check
          git diff --exit-code 71fdb12363f021ccc1036f8276041897cdbb0504 -- tracks/ user.properties
          git commit -m 'Strengthen learning-state replay and positive repair and event witnesses'
          git push origin HEAD:work/racecraft-strategies-20261008
