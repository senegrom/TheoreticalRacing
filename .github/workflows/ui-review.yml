name: UI review validation
on:
  push:
    branches: [browser]
    paths: ['.github/workflows/ui-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 269cf14701663ffeeb1a98238608f7f3fed2fc99
      BASE_TREE: f5f13cfda8b5c336af0808dfd6e70bb9c7f26038
      EXPECTED_TREE: 59ebecd47a7cda50b2a0c0ce0eabf8b91aa978a2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 269cf14701663ffeeb1a98238608f7f3fed2fc99
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize the exact reviewed edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          chunks = ['df3b64af84c19419c1fbf1be49fff9a471cc2537', 'bb31b8349bc7883815ffc56d9d4115a23875de60', '32d37735de6b9018f9c1cfcf5dd0c64a43c0bfa0', 'a7af83c78fedd719755a90772dee534532a221e6']
          parts = []
          for sha in chunks:
              request = urllib.request.Request('https://api.github.com/repos/senegrom/TheoreticalRacing/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              parts.append(raw)
          payload = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(payload).hexdigest() == '52fcc30a0515251c16c90c3414a518de89ee413709468c8f97e3c0065ae658ff'
          for path, before, after, edits in json.loads(payload):
              assert (path.startswith('web/') or path == '.github/workflows/browser.yml') and '..' not in pathlib.PurePosixPath(path).parts, path
              target = pathlib.Path(path)
              data = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(data).hexdigest() == before, path
              lines = data.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(edits):
                  lines[start:end] = text.splitlines(keepends=True)
              data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == after, path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git', 'add', 'web', '.github/workflows/browser.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == os.environ['EXPECTED_TREE'], tree
          print('Exact reviewed tree:', tree)
          PY
      - name: Install build and browser-test dependencies
        run: |
          python -m pip install -r web/requirements-icons.txt playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Original core tests and browser build
        run: |
          sh run_tests.sh
          sh web/build.sh
          git diff --check --cached
          python -m compileall -q web
          for f in web/*.js; do node --check "$f"; done
      - name: Full native parity, original goldens and adapter contracts
        run: python web/tests/parity.py
      - name: Icon dimensions, opacity, metadata and transport contracts
        run: |
          python -m unittest discover -s web/tests -p 'test_*.py'
          python web/tests/server_test.py
      - name: Five viewport UI regressions in both browser engines
        run: |
          python web/tests/ui_e2e.py --browser chromium
          python web/tests/ui_e2e.py --browser webkit
      - name: Actual Java gameplay and icon downloads in both browsers
        run: |
          python web/tests/browser_e2e.py --browser chromium
          python web/tests/browser_e2e.py --browser webkit
      - name: Store validated source objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert not subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip(), 'tests changed source'
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == os.environ['EXPECTED_TREE']
          rows = subprocess.check_output(['git', 'diff', '--cached', '--name-status', os.environ['BASE']], text=True)
          entries = []
          for row in rows.splitlines():
              status, path = row.split('\t')
              assert status in ('A', 'M'), row
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split()[0]
              entries.append(dict(path=path, mode=mode, type='blob', content=pathlib.Path(path).read_text()))
          request = urllib.request.Request('https://api.github.com/repos/senegrom/TheoreticalRacing/git/trees', method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, data=json.dumps(dict(base_tree=os.environ['BASE_TREE'], tree=entries)).encode())
          with urllib.request.urlopen(request, timeout=60) as response:
              stored = json.load(response)['sha']
          assert stored == tree, (stored, tree)
          report = pathlib.Path('validated-ui-tree.json')
          report.write_text(json.dumps(dict(base=os.environ['BASE'], tree=tree, files=[e['path'] for e in entries], passed=True), indent=2))
          print(report.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-ui-review
          path: |
            validated-ui-tree.json
            web/build/browser-tests/
            web/build/parity/results.json
            web/build/parity/*stdout
            web/build/parity/adapter-tests.log
          retention-days: 7
