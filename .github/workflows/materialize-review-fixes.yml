name: Preserve reviewed fix objects
on:
  push:
    branches: [master]
    paths: [.github/workflows/materialize-review-fixes.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dab2d054261cd8adfbe5cda1c0e5bd8fb3a61b49
          persist-credentials: false
      - name: Verify and store application objects without updating branches or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          chunks = ['36ad0ae28d59094429e7516554eb84d5963914c0', '5369e3d91fc67375abfd23286284cfb34359165c', '6a61ef9176869041179ea1c4578a60617233e596', '3a3164ea248b3efadc02ba938dcc81d21cd82201', 'dd222657f48da706d4e8a146383a75599ae437ed']
          parts = []
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(root + 'blobs/' + sha, headers=headers), timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              parts.append(raw)
          patch = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == 'd0356b45a4953d88b2cc9e93aa324d97c7e05344ffa3b57de56041ba4bd6318e'
          pathlib.Path('/tmp/review.patch').write_bytes(patch)
          subprocess.run(['git', 'rm', '-r', 'site'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/review.patch'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'a9c63bbda228c9a89c05a5eb2c5929d1d43f896a'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert not subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--', 'src', 'tracks', 'tests'], text=True).strip()
          # The workflow token only stores application/config objects. Workflow
          # changes are applied separately by the connected repository writer.
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '.github/workflows/browser.yml'], check=True)
          expected = '513e90707a697ab3b52a106296bac85418c3fad3'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected
          entries = [dict(path='site', mode='040000', type='tree', sha=None)]
          for name in subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM'], text=True).splitlines():
              assert name in ('.gitignore', '.github/dependabot.yml') or name.startswith('web/')
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append(dict(path=name, mode=mode, type='blob', content=pathlib.Path(name).read_text()))
          request = urllib.request.Request(root + 'trees', method='POST', headers=headers, data=json.dumps(dict(base_tree='87fa9686f0daa70ce284aa8b77610279fd8b4f0f', tree=entries)).encode())
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  stored = json.load(response)['sha']
          except urllib.error.HTTPError as error:
              print(error.read().decode())
              raise
          assert stored == expected, stored
          pathlib.Path('review-source-tree.json').write_text(json.dumps(dict(base='dab2d054261cd8adfbe5cda1c0e5bd8fb3a61b49', tree=stored, patch_sha256=hashlib.sha256(patch).hexdigest(), files=[e['path'] for e in entries]), indent=2))
          print('Verified reviewed application tree:', stored)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-tree
          path: review-source-tree.json
          retention-days: 7
