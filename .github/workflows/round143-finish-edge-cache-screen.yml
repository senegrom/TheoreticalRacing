name: Round 143 finish-edge cache screen
on:
  push:
    branches: [agent/ai-racing-speed-143-finish-edge-cache]
    paths: [.github/workflows/round143-finish-edge-cache-screen.yml, tracks/round143_finish_cache_apply.py, tracks/round143_runtime.py]
permissions: {contents: write}
concurrency: {group: round143-finish-edge-cache-screen, cancel-in-progress: true}
jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record run id
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round143-status.json').write_text(json.dumps({'id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA'],'state':'started'},sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round143-status.json
          git commit -m 'Round 143: record finish-cache screen run' || exit 0
          git push
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Build live-master baseline and exact candidate
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round143-base-sha.txt
          git worktree add /tmp/round143-work "$BASE"
          cd /tmp/round143-work
          sh ./run_tests.sh && sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round143-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round143_finish_cache_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceGame.java'
          git diff --check
          sh ./run_tests.sh && sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round143-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Run dual-order warm screen
        run: python tracks/round143_runtime.py --baseline round143-baseline.jar --candidate round143-candidate.jar --pairs 4 --out round143-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round143-finish-edge-cache-screen
          path: |
            round143-base-sha.txt
            round143-runtime.json
          if-no-files-found: warn
          retention-days: 30
