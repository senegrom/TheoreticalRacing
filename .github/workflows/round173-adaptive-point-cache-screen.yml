name: Round 173 adaptive point-cache screen

on:
  push:
    branches:
      - agent/ai-racing-speed-173-adaptive-point-cache
    paths:
      - .github/workflows/round173-adaptive-point-cache-screen.yml
      - tracks/round173_apply.py

permissions:
  contents: write

concurrency:
  group: round173-adaptive-point-cache-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record screen run id
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round173-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round173-status.json
          git commit -m 'Round 173: record adaptive point-cache screen' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master pair
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          git fetch origin '+refs/heads/agent/ai-racing-speed-165-live-occupancy-map:refs/remotes/origin/agent/ai-racing-speed-165-live-occupancy-map'
          git show origin/agent/ai-racing-speed-165-live-occupancy-map:tracks/round165_runtime.py > tracks/round173_runtime.py
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round173-base-sha.txt
          git worktree add /tmp/round173 "$BASE"
          cd /tmp/round173
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round173-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round173_apply.py"
          git diff --name-only | sort > /tmp/round173-changed.txt
          printf '%s\n' src/tr/logic/RaceGame.java src/tr/logic/Reachability.java | sort > /tmp/round173-expected.txt
          diff -u /tmp/round173-expected.txt /tmp/round173-changed.txt
          test "$(grep -Fc 'preparePointContainmentCacheForReachability' src/tr/logic/RaceGame.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round173-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
      - name: Measure seven-pair dual-order speed
        shell: bash
        run: |
          set +e
          python tracks/round173_runtime.py \
            --baseline round173-baseline.jar \
            --candidate round173-candidate.jar \
            --pairs 7 --aggregate-limit 0.98 --case-limit 1.05 \
            --out round173-runtime.json
          RC=$?
          set -e
          test -s round173-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round173-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          if [ "$RC" -ne 0 ]; then
            echo 'Round 173 did not clear the two-percent aggregate threshold.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round173-adaptive-point-cache-screen
          path: |
            round173-base-sha.txt
            round173-runtime.json
          if-no-files-found: warn
          retention-days: 30
