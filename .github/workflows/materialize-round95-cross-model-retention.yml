name: Materialize Round 95 cross-model retention

on:
  push:
    branches:
      - agent/ai-racing-speed-95-cross-model-retention
    paths:
      - .github/workflows/materialize-round95-cross-model-retention.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact base and apply frontier
        env:
          PATCH_B64: 
        run: |
          test "$(git rev-parse HEAD^)" = f705c526a8071785293e33cff7d95c4d510e425f
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round95.patch
          printf '%s  %s\n' '220a56c88027684bbfdfa7144b3da69cd07e94e5a6426f2adc3100b79632b132' /tmp/round95.patch | sha256sum -c -
          git apply --check /tmp/round95.patch
          git apply /tmp/round95.patch
      - name: Verify candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python3 tracks/bench_ai.py --seeds 1 --seed-start 1 silverstone
          git diff --check
      - name: Commit exact candidate
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java
          git commit -m 'Round 95: retain exact faster cross-model lines'
          git push origin HEAD:agent/ai-racing-speed-95-cross-model-retention
