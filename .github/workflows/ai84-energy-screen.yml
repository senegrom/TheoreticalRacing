name: AI84 energy screen

on:
  push:
    branches:
      - agent/ai-racing-speed-84
    paths:
      - .github/workflows/ai84-energy-screen.yml

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact Round 83 baseline and provisional energy candidate
        run: |
          git worktree add /tmp/ai83 7a3c35033dc227ae5e2444a54d03d7869629bf1e
          (cd /tmp/ai83 && sh ./build_main.sh && cp theoreticRacing.jar /tmp/ai83.jar)
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tr/logic/RaceAi.java')
          text = path.read_text()
          old = 'private final static int\t\tAI1_STAGED_MAX_SPEED2_GAIN\t= 9;'
          new = 'private final static int\t\tAI1_STAGED_MAX_SPEED2_GAIN\t= 16;'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('unexpected energy constant count')
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('neither Round 83 nor provisional energy constant found')

          old_block = '''\t\t\tfinal int candidateFinal = scorerFieldOutcome(nx, ny, nvx, nvy, playerNum,
\t\t\t\t\tAI1_STAGED_HORIZON, AI1_DEEP_CERT_RIVALS, rolloutFieldCost);
\t\t\tif (candidateFinal < 0 || candidateFinal >= chosenFinal
\t\t\t\t\t|| rolloutFieldCost[0] > chosenField)
\t\t\t\tcontinue;
'''
          new_block = '''\t\t\tfinal int candidateFinal = scorerFieldOutcome(nx, ny, nvx, nvy, playerNum,
\t\t\t\t\tAI1_STAGED_HORIZON, AI1_DEEP_CERT_RIVALS, rolloutFieldCost);
\t\t\tfinal long candidateField = rolloutFieldCost[0];
\t\t\tif (AI_DEBUG_DJS)
\t\t\t\tSystem.err.println("AIDBG STAGED-CAND p=" + playerNum + " pos=(" + pos[0] + ","
\t\t\t\t\t\t+ pos[1] + ") d=" + d + " ahead=" + rivalsAhead + " ttf=" + chosenT
\t\t\t\t\t\t+ "->" + turns + " speed2=" + chosenSpeed2 + "->" + speed2
\t\t\t\t\t\t+ " gain=" + (speed2 - chosenSpeed2) + " self=" + chosenFinal + "->"
\t\t\t\t\t\t+ candidateFinal + " field=" + chosenField + "->" + candidateField
\t\t\t\t\t\t+ " rest=" + restDelta);
\t\t\tif (candidateFinal < 0 || candidateFinal >= chosenFinal
\t\t\t\t\t|| candidateField > chosenField)
\t\t\t\tcontinue;
'''
          if text.count(old_block) != 1:
              raise SystemExit('expected staged candidate block once')
          path.write_text(text.replace(old_block, new_block))
          PY
          sh ./build_main.sh
          cp theoreticRacing.jar /tmp/ai84.jar
      - name: Run exact hot screen and diagnostics
        env:
          RACING_REACH_CACHE: ${{ runner.temp }}/ai84-reach-cache
        run: |
          python - <<'PY'
          import json, os, re, subprocess, tempfile
          from pathlib import Path

          root = Path.cwd()
          props_source = root / 'tracks' / 'bench.properties'
          baseline_jar = Path('/tmp/ai83.jar')
          candidate_jar = Path('/tmp/ai84.jar')
          tracks = ['silverstone', 'spa', 'lemans', 'monaco', 'nurburgring',
                    'hungaroring', 'interlagos', 'zandvoort', 'coil']
          cases = [(track, seed) for track in tracks for seed in range(1, 26)]

          def write_props(path):
              text = props_source.read_text()
              text = re.sub(r'nPlayers=\d+', 'nPlayers=8', text)
              for i in range(1, 9):
                  text = re.sub(rf'^(player{i}Kind=).*$', rf'\g<1>AI1', text, flags=re.M)
              path.write_text(text)

          def run(jar, track, seed, debug=False):
              with tempfile.TemporaryDirectory(prefix='ai84-race-') as td:
                  td = Path(td)
                  props = td / 'bench.properties'
                  log = td / 'game.log'
                  write_props(props)
                  cmd = ['java', '-Djava.awt.headless=true']
                  if debug:
                      cmd.append('-Dai.debug.djs=true')
                  cmd += ['-jar', str(jar), '--auto', '--track', track,
                          '--props', str(props), '--log', str(log), '--seed', str(seed)]
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=900)
                  if p.returncode != 0 or 'Aborting' in p.stdout or not log.exists():
                      return {'invalid': True, 'returncode': p.returncode,
                              'stdout': p.stdout[-2000:], 'stderr': p.stderr[-4000:]}
                  moves = {}
                  crashes = set()
                  finish_moves = []
                  for line in log.read_text().splitlines():
                      match = re.match(r'^(\d+) p(\d+) ', line)
                      if not match:
                          continue
                      player = int(match.group(2))
                      moves[player] = moves.get(player, 0) + 1
                      if 'CRASH' in line:
                          crashes.add(player)
                      elif 'FINISH' in line:
                          finish_moves.append(moves[player])
                  return {'finishes': len(finish_moves), 'crashes': len(crashes),
                          'moves': finish_moves, 'move_sum': sum(finish_moves),
                          'debug': [line for line in p.stderr.splitlines()
                                    if 'AIDBG STAGED' in line]}

          details = []
          counts = {}
          net = 0
          for index, (track, seed) in enumerate(cases, 1):
              baseline = run(baseline_jar, track, seed)
              candidate = run(candidate_jar, track, seed)
              if baseline.get('invalid') or candidate.get('invalid'):
                  status = 'INVALID'
              elif (candidate['finishes'], candidate['crashes']) != (baseline['finishes'], baseline['crashes']):
                  if candidate['finishes'] >= baseline['finishes'] and candidate['crashes'] <= baseline['crashes']:
                      status = 'SAFETY_IMPROVEMENT'
                  else:
                      status = 'SAFETY_REGRESSION'
              elif candidate['moves'] == baseline['moves']:
                  status = 'IDENTICAL'
              elif candidate['move_sum'] < baseline['move_sum']:
                  status = 'PACE_IMPROVEMENT'
              elif candidate['move_sum'] > baseline['move_sum']:
                  status = 'PACE_REGRESSION'
              else:
                  status = 'REDISTRIBUTION'
              counts[status] = counts.get(status, 0) + 1
              delta = candidate.get('move_sum', 0) - baseline.get('move_sum', 0)
              net += delta
              if status != 'IDENTICAL':
                  row = {'case': f'{track}:{seed}', 'status': status,
                         'delta': delta, 'baseline': baseline, 'candidate': candidate}
                  details.append(row)
                  print(f'{status:18} {track}:{seed:<2} '
                        f"f/c {baseline.get('finishes')}/{baseline.get('crashes')} -> "
                        f"{candidate.get('finishes')}/{candidate.get('crashes')} "
                        f"moves {baseline.get('move_sum')} -> {candidate.get('move_sum')} ({delta:+})")
              if index % 25 == 0 or index == len(cases):
                  print(f'completed {index}/{len(cases)} races')

          diagnostic_cases = [('lemans', 3), ('lemans', 19), ('spa', 9),
                              ('spa', 11), ('spa', 17), ('silverstone', 18)]
          diagnostics = {}
          for track, seed in diagnostic_cases:
              result = run(candidate_jar, track, seed, debug=True)
              diagnostics[f'{track}:{seed}'] = result.get('debug', [])

          report = {'baseline': '7a3c35033dc227ae5e2444a54d03d7869629bf1e',
                    'candidate': 'energy-cap-16', 'counts': counts,
                    'net_move_delta': net, 'details': details,
                    'diagnostics': diagnostics}
          Path('ai84-energy-screen.json').write_text(json.dumps(report, indent=2, sort_keys=True))
          with Path('ai84-energy-screen.txt').open('w') as output:
              output.write(json.dumps({'counts': counts, 'net_move_delta': net}, sort_keys=True) + '\n')
              for row in details:
                  output.write(f"{row['status']:18} {row['case']:24} {row['delta']:+}\n")
              output.write('\nDIAGNOSTICS\n')
              for case, lines in diagnostics.items():
                  output.write(f'[{case}]\n')
                  output.write('\n'.join(lines) + '\n')

          bad = sum(counts.get(name, 0) for name in
                    ('INVALID', 'SAFETY_REGRESSION', 'PACE_REGRESSION', 'REDISTRIBUTION'))
          if bad:
              raise SystemExit(f'energy candidate has {bad} regression-class results')
          if counts.get('PACE_IMPROVEMENT', 0) + counts.get('SAFETY_IMPROVEMENT', 0) == 0:
              raise SystemExit('energy candidate is inert')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai84-energy-screen
          path: |
            ai84-energy-screen.json
            ai84-energy-screen.txt
          if-no-files-found: error
          retention-days: 7
