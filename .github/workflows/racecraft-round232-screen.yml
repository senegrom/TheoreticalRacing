name: Round 232 checkpoint continuation screen
on:
  push:
    branches: [codex/racecraft-own-progress]
    paths:
      - .github/workflows/racecraft-round232-screen.yml
      - docs/experiments/round232/screen.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    name: Checkpoint tie / ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and record
        run: |
          git apply --check docs/experiments/round232/screen.patch
          git apply docs/experiments/round232/screen.patch
          sh build_main.sh
          mkdir results
          java --version > results/java-version.txt 2>&1
          sha256sum theoreticRacing.jar docs/experiments/round232/screen.patch > results/build-sha256.txt
          cp tracks/lap_bench.properties results/profile.properties
          printf '\naiStartPlacement=legacy\ncandidateSlots=1,2,3,4,5,6,7,8\n' >> results/profile.properties
      - name: Race fresh paired screen
        env:
          RACING_PROPS: ${{ github.workspace }}/results/profile.properties
          RACING_HEAP: -Xmx4g -XX:ActiveProcessorCount=2 -Dai.experiment.checkpointTie=${{ matrix.arm }}
          RACING_TRACKS: silverstone monza spa monaco spielberg nurburgring lemans interlagos zandvoort hungaroring coil cog chicane gear hairpin serpentine serpentine2 zigzag lobe5 weave3 fractal8 rand6 rand13 rand16
        run: sh tracks/fleet_grid.sh 31-33 2 results/fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round232-screen-${{ matrix.arm }}
          path: results
          if-no-files-found: error
          retention-days: 14
