name: Preserve placement layout source
on:
  push:
    branches: [master]
    paths: [.github/workflows/materialize-placement-layout.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea6aadd95262256f009d8d736141a49b590319d5
          persist-credentials: false
      - name: Verify source changes and store objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          with urllib.request.urlopen(urllib.request.Request(root + 'blobs/91fb7e20b924105a7059dace907e73b2e426485e', headers=headers), timeout=60) as response:
              patch = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(patch).hexdigest() == 'd683df5928e5802f2778bf628de11e3d51b395e7299550b1348886f2694d2a74'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'layout.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert subprocess.check_output(['git', 'rev-parse', tree + ':web'], text=True).strip() == 'b4d8cda283101776c7d943b7c7723e78ef46005b'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(names) == ['web/README.md', 'web/app.css', 'web/index.html', 'web/tests/ui_e2e.py']
          entries = [dict(path=name, mode='100644', type='blob', content=pathlib.Path(name).read_text()) for name in names]
          request = urllib.request.Request(root + 'trees', method='POST', headers=headers, data=json.dumps(dict(base_tree='5624be4d8a3b693356d2600e751a41b8cb617c87', tree=entries)).encode())
          with urllib.request.urlopen(request, timeout=60) as response:
              stored = json.load(response)['sha']
          assert stored == tree
          print('Stored verified web tree: b4d8cda283101776c7d943b7c7723e78ef46005b')
          PY
