name: Apply reviewed UI cleanup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/materialize-ui-fix2.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          chunks = [
              '2918726b84bd5484339447ff88747047e69b5b1d',
              'd1c6de13894286b69e6f11e58707169065764417',
              'e22534b2d6c74e10285b9dfa0bfde4875ccbb5c8',
              '1a2f862b7c1630d7eec46762add77d2fbeb80832',
          ]
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          api = 'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'
          parts=[]
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(api+sha,headers=headers),timeout=30) as r:
                  obj=json.load(r)
              data=base64.b64decode(obj['content'])
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==sha,(actual,sha)
              parts.append(data)
          packed=b''.join(parts)
          assert len(packed)==18560,len(packed)
          assert hashlib.sha256(packed).hexdigest()=='c81343ff81acb10109ca1df87110a5181b741435c7e8f30098f5273cef22f19a'
          raw=lzma.decompress(packed)
          expected={
              'web/app.css':'6c4b921c47717cecdbd61aef6c9d3e87dac0141289b75858605ceeed7a4956de',
              'web/app.js':'8d18c2cd981574682c7f4322fbdb9b3bcecea4c5de49244ee5d93200fdd563c5',
              'web/tests/ui_e2e.py':'a9ae787b6a287aab2e70ce7300a04668727085994f0da7ba27a5607c56943726',
          }
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              members={m.name:m for m in tf.getmembers() if m.isfile()}
              assert set(members)==set(expected),members.keys()
              for name,digest in expected.items():
                  data=tf.extractfile(members[name]).read()
                  assert hashlib.sha256(data).hexdigest()==digest,(name,hashlib.sha256(data).hexdigest())
                  pathlib.Path(name).write_bytes(data)
          PY
          node --check web/app.js
          python3 -m py_compile web/tests/ui_e2e.py
          node --test web/tests/engine.test.mjs
          rm -f .github/workflows/materialize-ui-fix.yml .github/workflows/materialize-ui-local.yml .github/workflows/materialize-ui-fix2.yml tmp_ui_payload.b64
          git add web/app.css web/app.js web/tests/ui_e2e.py .github/workflows/materialize-ui-fix.yml .github/workflows/materialize-ui-local.yml .github/workflows/materialize-ui-fix2.yml tmp_ui_payload.b64
          git diff --cached --check
      - name: Commit without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'master advanced; refusing to overwrite'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(browser): simplify and stabilize the racing UI"
          git push origin HEAD:master
          final=$(git rev-parse HEAD)
          curl --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/browser.yml/dispatches -d '{"ref":"master"}'
          echo "Published $final"
