name: Apply reviewed UI cleanup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/materialize-ui-fix2.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, tarfile, urllib.request, io
          sha='REPLACE_BLOB_SHA'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
          packed=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
          assert hashlib.sha256(packed).hexdigest()=='c81343ff81acb10109ca1df87110a5181b741435c7e8f30098f5273cef22f19a'
          raw=lzma.decompress(packed)
          expected={'web/app.css':'6c4b921c47717cecdbd61aef6c9d3e87dac0141289b75858605ceeed7a4956de','web/app.js':'8d18c2cd981574682c7f4322fbdb9b3bcecea4c5de49244ee5d93200fdd563c5','web/tests/ui_e2e.py':'a9ae787b6a287aab2e70ce7300a04668727085994f0da7ba27a5607c56943726'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              members={m.name:m for m in tf.getmembers() if m.isfile()}
              assert set(members)==set(expected),members.keys()
              for name,digest in expected.items():
                  data=tf.extractfile(members[name]).read(); assert hashlib.sha256(data).hexdigest()==digest
                  pathlib.Path(name).write_bytes(data)
          PY
          node --check web/app.js
          python3 -m py_compile web/tests/ui_e2e.py
          rm -f .github/workflows/materialize-ui-fix.yml .github/workflows/materialize-ui-local.yml .github/workflows/materialize-ui-fix2.yml
          git add web/app.css web/app.js web/tests/ui_e2e.py .github/workflows/materialize-ui-fix.yml .github/workflows/materialize-ui-local.yml .github/workflows/materialize-ui-fix2.yml
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit checks
        run: |
          python3 -m unittest web.tests.test_progress
          node --test web/tests/engine.test.mjs
      - name: Commit without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || { echo 'master advanced; refusing to overwrite'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(browser): simplify and stabilize the racing UI"
          git push origin HEAD:master
          final=$(git rev-parse HEAD)
          curl --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/browser.yml/dispatches -d '{"ref":"master"}'
          echo "Published $final"
