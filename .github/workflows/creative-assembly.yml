name: Assemble creative racecraft
on:
  push:
    branches: [work/racecraft-strategies-20261008]
    paths: ['.creative-20261011/**', '.github/workflows/creative-assembly.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: creative-assembly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/work/racecraft-strategies-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Integrate reviewed master and apply isolated experiments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge-base --is-ancestor 807d3d24b1d60d004e36c2410c5ef4725bf553e3 HEAD; then
            git merge --no-commit --no-ff 807d3d24b1d60d004e36c2410c5ef4725bf553e3 || true
            python3 - <<'PY'
          import subprocess
          from pathlib import Path
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          if conflicts == ['racing-memory.md']:
              old = subprocess.check_output(['git','show','HEAD:racing-memory.md'], text=True)
              master = subprocess.check_output(['git','show','807d3d24b1d60d004e36c2410c5ef4725bf553e3:racing-memory.md'], text=True)
              update = master[master.index('\n## Round 303'):master.index('\n## Round 302')]
              title, rest = old.split('\n', 1)
              Path('racing-memory.md').write_text(title + '\n' + update + '\n' + rest)
              subprocess.run(['git','add','racing-memory.md'], check=True)
          elif conflicts:
              raise RuntimeError('Unreviewed merge conflict: '+str(conflicts))
          PY
          fi
          python3 .creative-20261011/apply.py
          python3 .creative-20261011/repair.txt
          git diff --check
      - name: Build and targeted mechanisms
        run: |
          sh build_main.sh
          mkdir -p test-bin
          find src tests -name '*.java' | sort > /tmp/creative-sources
          javac -Xlint:all -Werror -encoding UTF-8 -d test-bin @/tmp/creative-sources
          export RACING_REACH_CACHE=$(mktemp -d)
          java -ea -Djava.awt.headless=true -cp test-bin tr.logic.CreativeRacecraftTests
      - name: Full contracts
        run: |
          sh run_tests.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit tested source to research branch only
        shell: bash
        run: |
          set -euo pipefail
          git add src tests tools docs run_tests.sh racing-memory.md
          git diff --cached --check
          git diff --exit-code 807d3d24b1d60d004e36c2410c5ef4725bf553e3 -- tracks/ user.properties AGENTS.md
          if ! git diff --cached --quiet || test -f .git/MERGE_HEAD; then
            git commit -m 'Add isolated creative racecraft proposals, matched judging and legal-prefix breeding'
            git push origin HEAD:work/racecraft-strategies-20261008
          fi
