name: Round 167 exact integer finish screen

on:
  push:
    branches:
      - agent/ai-racing-speed-167-integer-finish-post160
    paths:
      - .github/workflows/round167-integer-finish-screen.yml

permissions:
  contents: write

concurrency:
  group: round167-integer-finish-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record screen run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round167-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'screen-started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round167-status.json
          git commit -m 'Round 167: record integer-finish screen run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build promoted-master baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round167-base-sha.txt
          git worktree add /tmp/round167-screen "$BASE"
          cd /tmp/round167-screen
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round167-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round167_apply.py"
          git diff --name-only | sort > /tmp/round167-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceGame.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round167-expected.txt
          diff -u /tmp/round167-expected.txt /tmp/round167-changed.txt
          test "$(grep -Fc 'static boolean linesIntersectInt' src/tr/logic/RaceGame.java)" = 1
          test "$(grep -Fc 'private static void testIntegerLineIntersection()' tests/tr/logic/CoreTests.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round167-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Measure seven-pair dual-order warm speed
        shell: bash
        run: |
          set +e
          python tracks/round167_runtime.py \
            --baseline round167-baseline.jar \
            --candidate round167-candidate.jar \
            --pairs 7 --aggregate-limit 0.95 --case-limit 1.05 \
            --out round167-runtime.json
          RC=$?
          set -e
          test -s round167-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round167-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          if [ "$RC" -ne 0 ]; then
            echo 'Round 167 did not clear the five-percent aggregate threshold.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round167-integer-finish-screen
          path: |
            round167-base-sha.txt
            round167-runtime.json
          if-no-files-found: warn
          retention-days: 30
