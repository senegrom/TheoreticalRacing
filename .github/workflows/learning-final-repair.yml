name: Learning final compatibility repair
on:
  push:
    branches: [work/racecraft-strategies-20261008]
    paths: ['.github/workflows/learning-final-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/work/racecraft-strategies-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Correct checkout assumptions and exercise large learning snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/racecraft_learning_cli.py');s=p.read_text()
          old="for p in (base.ROOT/'user.properties',base.ROOT/'tracks/lap_bench.properties')}"
          assert s.count(old)==1
          p.write_text(s.replace(old,"for p in (base.ROOT/'user.properties',base.ROOT/'tracks/lap_bench.properties') if p.exists()}"))
          p=Path('src/tr/logic/TacticBreeder.java');s=p.read_text()
          assert s.count('request.length() > 280000')==1
          p.write_text(s.replace('request.length() > 280000','request.length() > 1060000'))
          p=Path('tests/tr/logic/LearningRacecraftTests.java');s=p.read_text()
          marker='    public static void main(final String[] args) throws Exception {'
          addition='''    private static void requestBounds() throws Exception {
                  final RaceGame game=fixture("");
                  game.players=new Player[9];
                  final java.util.Map<String,ProofNumberSearch.Answer> records=new java.util.TreeMap<>();
                  for(int i=0;i<512;i++) records.put(String.format("%064x",i),new ProofNumberSearch.Answer(Direction.E,2));
                  // Structural parser fixture only: these records are NOT certified
                  // by a search and proof-number is OFF for every actor.
                  for(int i=0;i<9;i++) {
                      game.players[i]=new Player("P"+(i+1),i+1,java.awt.Color.BLUE,Player.Kind.AI1);
                      pose(game.players[i],69,2+2*i,4,0,0);
                      game.learningMemory.proof(i,new ProofNumberSearch.Plan(1,50,records));
                  }
                  final String root=RacecraftReplay.snapshot(game);
                  check(root.length()>280000,"large-state fixture does not cross legacy request bound");
                  check(root.equals(RacecraftReplay.parse(game,root).encode()),"maximum-slot learning state failed parsing");
                  final String answer=TacticBreeder.answer(game,"breed1,30,-|"+root);
                  check(answer.contains("\\\"complete\\\":true"),"legacy breeder rejected complete bounded learning state");
                  check(root.equals(RacecraftReplay.snapshot(game)),"large-state breeder altered live policy memory");
              }
          '''
          assert s.count(marker)==1
          s=s.replace(marker,addition+marker)
          old='repair();selfRepair();memory();investment();event();proof();league();'
          assert s.count(old)==1
          s=s.replace(old,old+'requestBounds();')
          p.write_text(s)
          p=Path('racing-memory.md');title,rest=p.read_text().split('\n',1)
          p.write_text(title+'\n\n## Learning compatibility checks (2026-10-15, branch only)\n\n'
              'JDK 25 and 26 full contracts pass on a3aff4d. Full-race runner initially\n'
              'stopped before any race because a clean checkout has no user.properties;\n'
              'it now hashes only caller files that exist, as the older runner does.\n'
              'The legacy breeder accepts the same complete rc7 request limit as cf4\n'
              'and the league. Added a nine-slot, 512-record-per-slot structural\n'
              'snapshot round-trip and complete breeder witness with proof policy off.\n'
              'No racing-policy change or performance claim in this compatibility repair.\n'+rest)
          PY
      - name: Build and contracts
        run: |
          set -eu
          sh build_main.sh
          sh run_tests.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit tested compatibility repairs to research branch only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests racing-memory.md
          git diff --cached --check
          git diff --exit-code 71fdb12363f021ccc1036f8276041897cdbb0504 -- tracks/ user.properties
          git commit -m 'Accept clean checkouts and complete learning states in all research oracles'
          git push origin HEAD:work/racecraft-strategies-20261008
