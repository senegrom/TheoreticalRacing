name: AI promotion battery

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/promotion-gate.yml

permissions:
  contents: read

concurrency:
  group: ai-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify code and frozen AI2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sh ./run_tests.sh
      - run: sh ./build_main.sh
      - run: python tests/headless_smoke.py
      - run: python tests/golden_races.py
      - run: python -m compileall -q tracks tests

  battery:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 8car-s1-5
            label: 8-car seeds 1-5
            args: --seeds 5
          - slug: 8car-s6-10
            label: 8-car seeds 6-10
            args: --seeds 5 --seed-start 6
          - slug: 8car-s11-15
            label: 8-car seeds 11-15
            args: --seeds 5 --seed-start 11
          - slug: h2h-s1-5
            label: 4v4 mixed seeds 1-5
            args: --h2h --seeds 5
          - slug: h2h-s6-10
            label: 4v4 mixed seeds 6-10
            args: --h2h --seeds 5 --seed-start 6
          - slug: h2h-s11-15
            label: 4v4 mixed seeds 11-15
            args: --h2h --seeds 5 --seed-start 11
          - slug: 4car-s1-5
            label: 2v2 mixed seeds 1-5
            args: --4p --seeds 5
          - slug: 1v1-s1-5
            label: 1v1 seeds 1-5
            args: --1v1 --seeds 5
          - slug: slow-s1-5
            label: Slow synthetic seeds 1-5
            args: --slow --seeds 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build
        run: sh ./build_main.sh
      - name: Run ${{ matrix.label }}
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python tracks/bench_ai.py ${{ matrix.args }} | tee promotion-report.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ matrix.slug }}
          path: promotion-report.txt
          retention-days: 30
