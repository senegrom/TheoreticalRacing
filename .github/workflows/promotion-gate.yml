name: AI promotion battery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-promotion-${{ github.ref }}
  cancel-in-progress: false

# Heap is part of the policy identity. Inherited JVM options must not override it.
env:
  JAVA_TOOL_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''
  _JAVA_OPTIONS: ''

jobs:
  verify:
    name: Verify code and candidate-cohort contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sh ./run_tests.sh
      - run: sh ./build_main.sh
      - run: python tests/promotion_pair_regression.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/headless_smoke.py
      - run: python tests/query_replay_regression.py
      - run: python tests/lap_progress_regression.py
      - run: python tests/selfplay_profile_regression.py
      - run: python tests/golden_races.py
      - name: Run every champion AI regression pin
        shell: bash
        run: |
          for test in tests/ai1_*_regression.py; do
            echo "==> $test"
            python "$test"
          done
      - run: python -m compileall -q tracks tests

  # A green battery means complete evidence, not automatic policy promotion.
  # The selected revision must implement its candidate behind candidateSlots.
  battery:
    name: ${{ matrix.players }} cars / ${{ matrix.mode }} / seeds ${{ matrix.seeds }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        players: [2, 4, 8]
        mode: [legacy, informed, scatter]
        seeds: ['1-5', '6-10', '11-15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the selected candidate revision
        run: sh ./build_main.sh
      - name: Run complete mirrored candidate-slot fleets
        shell: bash
        env:
          PLAYERS: ${{ matrix.players }}
          START_MODE: ${{ matrix.mode }}
          SEEDS: ${{ matrix.seeds }}
        run: |
          set -euo pipefail
          python tracks/promotion_pair.py --players "$PLAYERS" --start-mode "$START_MODE" \
            --seeds "$SEEDS" --heap=-Xmx8g --out promotion-evidence
      - name: Upload profiles, manifests, complete logs and validated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promotion-${{ matrix.players }}car-${{ matrix.mode }}-s${{ matrix.seeds }}
          path: promotion-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
