name: Apply correctness fixes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-correctness-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply reviewed patch
        run: |
          git apply --check .github/correctness-fixes.patch
          git apply .github/correctness-fixes.patch

      - name: Run strict and deterministic tests
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python -m compileall -q tracks tests

      - name: Commit source fixes directly to master
        run: |
          rm .github/correctness-fixes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix large-grid endgames and invalid auto races'
          git push origin HEAD:master
