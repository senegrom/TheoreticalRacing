name: Round 121 per-rival Pareto acceleration screen

on:
  push:
    branches:
      - agent/ai-racing-speed-121-pareto-vector
    paths:
      - .github/workflows/round121-pareto-vector-screen.yml
      - tracks/round121_apply.py
      - tracks/round121_compare.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master baseline and candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round121-base-sha.txt
          test "$(cat round121-base-sha.txt)" = '1d0bf9fdd613abf0aaa56a7b8fc5739f94fc9660'
          git worktree add /tmp/round121-work origin/master
          cd /tmp/round121-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round121-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round121_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'AIDBG PARETO-VECTOR' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round121-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round121-build
          path: |
            round121-baseline.jar
            round121-candidate.jar
            round121-base-sha.txt
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        track:
          - coil
          - spa
          - silverstone
          - hungaroring
          - interlagos
          - lemans
          - monza
          - zandvoort
          - nurburgring
          - spielberg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round121-build
          path: .
      - name: Compare exact seed outcomes
        env:
          TRACK: ${{ matrix.track }}
        run: |
          python tracks/round121_compare.py \
            --baseline round121-baseline.jar --candidate round121-candidate.jar \
            --track "$TRACK" --start 1 --end 150 \
            --out "round121-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round121-result-${{ matrix.track }}
          path: round121-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round121-result-*
          path: round121-results
          merge-multiple: true
      - name: Merge exact results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': '1d0bf9fdd613abf0aaa56a7b8fc5739f94fc9660',
              'candidate': 'per_rival_pareto_vector',
              'pairs': 0,
              'counts': {},
              'events': [],
              'net_moves': 0,
              'runtime_ratios': {},
          }
          for path in sorted(Path('round121-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          summary['bad'] = bad
          summary['promising'] = (
              summary['pairs'] == 1500
              and bad == 0
              and (summary['counts'].get('pareto_faster', 0) > 0
                   or summary['counts'].get('safety_gain', 0) > 0)
          )
          Path('round121-target-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['pairs'] == 1500, summary
          PY
      - name: Publish measured screen
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round121-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-121-pareto-vector
          git add round121-target-summary.json round121-run-id.txt
          git commit -m 'Record Round 121 target screen'
          git push origin HEAD:agent/ai-racing-speed-121-pareto-vector
