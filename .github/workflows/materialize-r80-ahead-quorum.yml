name: Materialize Round 80 progress quorum

on:
  push:
    branches: [agent/ai-racing-speed-80-staged-energy-quorum]
    paths:
      - .github/workflows/materialize-r80-ahead-quorum.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and apply the checksum-pinned quorum
        shell: bash
        run: |
          set -euo pipefail
          echo '7a2e68f67c17baa5fa7cf75eec1d651ddc68691a5a524a08eadd8e73d984e78e  src/tr/logic/RaceAi.java' | sha256sum -c -
          echo '81a9b65a614a672db3a354707be47dcb9c6becbbc656c6db4b62cfd78d95a10b  tests/ai1_staged_pace_regression.py' | sha256sum -c -
          echo 'f1446f864d1848372246a7b101762201582b23f60336df68945608482153c629  .r80/ahead-quorum.patch' | sha256sum -c -
          git apply --check .r80/ahead-quorum.patch
          git apply .r80/ahead-quorum.patch
          echo '51094184882cbfa4d0737bfc33c21806fabcd65ac9fd3dd22553720e1f08bed5  src/tr/logic/RaceAi.java' | sha256sum -c -
          echo '5e566ec0783f18e730ba283e1800e87fa9dfe7f58a9a9ea7bc70405f08644e2a  tests/ai1_staged_pace_regression.py' | sha256sum -c -
          git diff --check
      - name: Verify source and deterministic boundaries
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
      - name: Commit only the verified source and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java tests/ai1_staged_pace_regression.py
          git rm .r80/ahead-quorum.patch .github/workflows/materialize-r80-ahead-quorum.yml
          git commit -m 'Round 80: require a forward-field pace quorum'
          git push origin HEAD:agent/ai-racing-speed-80-staged-energy-quorum
