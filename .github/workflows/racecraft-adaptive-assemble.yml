name: Assemble adaptive racecraft experiments
on:
  push:
    branches: [work/racecraft-outcomes-opening-20260928]
    paths: ['.racecraft-adaptive/**', '.github/workflows/racecraft-adaptive-assemble.yml']
permissions:
  contents: write
concurrency:
  group: adaptive-racecraft-assembly
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply staged implementation
        run: python3 .racecraft-adaptive/apply.py
      - name: Compile and behavioural contracts
        shell: bash
        run: |
          set -euo pipefail
          sh build_main.sh 2>&1 | tee /tmp/adaptive-build.log
          sh run_tests.sh 2>&1 | tee /tmp/adaptive-java.log
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee /tmp/adaptive-python.log
          git diff --check
      - name: Race controls and complete counterfactual tails
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/adaptive-baseline"
          git archive 1c50a5cb740c2deb9bd8bf8a588c8693e4335aae | tar -x -C "$RUNNER_TEMP/adaptive-baseline"
          (cd "$RUNNER_TEMP/adaptive-baseline" && sh build_main.sh)
          python3 tests/racecraft_next_cli.py --baseline-jar "$RUNNER_TEMP/adaptive-baseline/theoreticRacing.jar" --out "$RUNNER_TEMP/adaptive-controls" 2>&1 | tee /tmp/adaptive-controls.log
      - name: Existing goldens and every champion pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/golden_races.py 2>&1 | tee /tmp/adaptive-goldens.log
          for test in tests/ai1_*_regression.py; do
            echo "==> $test"
            python3 "$test"
          done 2>&1 | tee /tmp/adaptive-pins.log
      - name: Commit tested implementation to the research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools run_tests.sh racing-memory.md docs
          git diff --cached --check
          git commit -m 'Add bounded adaptive racecraft experiments and behavioural regressions'
          git push origin HEAD:work/racecraft-outcomes-opening-20260928
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adaptive-implementation-evidence
          path: |
            /tmp/adaptive-*.log
            ${{ runner.temp }}/adaptive-controls
          retention-days: 7
