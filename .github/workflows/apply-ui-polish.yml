name: Apply final responsive UI polish
on:
  push:
    branches: [master]
    paths: [.github/workflows/apply-ui-polish.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed presentation-only changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('web/index.html')
          text = index.read_text()
          old = '<link rel="stylesheet" href="./app.css?v=7">'
          assert text.count(old) == 1
          text = text.replace(old, '<link rel="stylesheet" href="./app.css?v=8">')
          old = '<h2 id="setup-title">A circuit. A vector. A finish line.</h2>'
          assert text.count(old) == 1
          text = text.replace(old, '<h2 id="setup-title" tabindex="-1" autofocus>A circuit. A vector. A finish line.</h2>')
          index.write_text(text)

          css = Path('web/app.css')
          text = css.read_text()
          marker = '/* 2026-09 responsive setup and chrome polish. */'
          assert marker not in text
          text += r'''

          /* 2026-09 responsive setup and chrome polish. */
          html, body { background:var(--paper); }
          html { scrollbar-color:#aeb9b1 var(--paper); }

          /* Idle means ready, not warning: preserve the fixed race footprint but quiet it visually. */
          body[data-phase="PLAY"] .work-status[data-active="false"] {
            background:#fffdf7;
            border-color:var(--line);
            box-shadow:none;
          }
          body[data-phase="PLAY"] .work-status[data-active="false"] .work-title strong,
          body[data-phase="PLAY"] .work-status[data-active="false"] [data-work-detail],
          body[data-phase="PLAY"] .work-status[data-active="false"] .work-hints { color:var(--muted); }

          /* Tablet widths get the same intentional More treatment as phones instead of wrapping header actions. */
          @media(max-width:900px) {
            .masthead nav { flex-wrap:nowrap; }
            .masthead nav > #export,.masthead nav > #install { display:none; }
            .header-more { display:block; }
          }
          @media(min-width:721px) and (max-width:900px) {
            .masthead { padding:16px 18px; gap:12px; }
            .brand { gap:10px; }
            .brand img { width:42px; height:42px; flex-basis:42px; }
            .masthead h1 { font-size:1.55rem; white-space:nowrap; }
            .masthead .eyebrow { font-size:.6rem; margin-bottom:4px; }
            .masthead nav { gap:5px; }
            .masthead nav button,.header-more summary { min-height:42px; padding:6px 9px; font-size:.78rem; }
          }

          /* On phones setup is a proper sheet: fixed header/CTA with only the form body scrolling. */
          @media(max-width:720px) {
            #setup {
              width:100%;
              max-width:none;
              height:100dvh;
              max-height:100dvh;
              margin:0;
              padding:0;
              border:0;
              border-radius:0;
              overflow:hidden;
            }
            #setup form { height:100%; min-height:0; display:flex; flex-direction:column; }
            #setup .dialog-head {
              flex:none;
              margin:0;
              padding:calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
              border-bottom:1px solid var(--line);
              background:var(--paper);
              z-index:2;
            }
            #setup .setup-grid {
              flex:1 1 auto;
              min-height:0;
              overflow-y:auto;
              overscroll-behavior:contain;
              padding:14px 14px 22px;
              align-content:start;
            }
            #setup-error { flex:none; margin:0; background:var(--paper); }
            #setup-error:not(:empty) { padding:8px 14px 0; }
            #setup .dialog-actions {
              flex:none;
              position:relative;
              margin:0;
              padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
              border-top:1px solid var(--line);
              background:var(--paper);
              box-shadow:0 -7px 18px #20382f12;
              flex-direction:row;
              align-items:center;
              gap:8px;
              z-index:2;
            }
            #setup .dialog-actions > span { display:none; }
            #setup #start { width:100%; min-height:46px; }

            /* Pacing remains available, but it is a secondary control rather than a second CTA. */
            .decision.driving .speed-label {
              display:flex;
              justify-content:flex-end;
              align-items:center;
              gap:5px;
              font-size:.66rem;
              line-height:1;
              white-space:nowrap;
            }
            .decision.driving .speed-label select {
              width:78px;
              min-height:32px;
              height:32px;
              margin:0;
              padding:3px 5px;
              font-size:.72rem;
            }
          }

          /* Secondary information should remain readable on a physical phone. */
          #standings small { font-size:.72rem; }
          #standings .result { font-size:.75rem; }
          footer { font-size:.75rem; }
          @media(max-width:720px) {
            body[data-phase="PLAY"] #standings .result { font-size:.72rem; }
            footer { font-size:.74rem; }
          }
          '''
          css.write_text(text)

          test = Path('web/tests/ui_e2e.py')
          text = test.read_text()
          anchor = "            assert page.locator('#setup').evaluate('(e)=>e.scrollWidth <= e.clientWidth'), f'setup content overflows {width}'\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "            assert page.evaluate('document.activeElement.id') == 'setup-title', 'setup heading should receive initial focus'\n            if width <= 720:\n                start_box = page.locator('#start').bounding_box()\n                assert start_box and start_box['y'] >= 0 and start_box['y'] + start_box['height'] <= height, f'start action not visible/sticky {width}'\n")
          old = '''            if width <= 720:\n                assert page.locator('#export').is_hidden() and page.locator('#install').is_hidden()\n                assert page.locator('#header-more').is_visible()\n                assert page.locator('.masthead nav').evaluate('(e)=>e.scrollWidth <= e.clientWidth'), f'mobile nav wraps/overflows {width}'\n                assert page.locator('#work-status').evaluate('(e)=>e.getBoundingClientRect().height <= 80'), f'activity rail too tall {width}'\n            else:\n                assert page.locator('#header-more').is_hidden()\n'''
          new = '''            if width <= 900:\n                assert page.locator('#export').is_hidden() and page.locator('#install').is_hidden()\n                assert page.locator('#header-more').is_visible()\n                assert page.locator('.masthead nav').evaluate('(e)=>e.scrollWidth <= e.clientWidth'), f'compact nav wraps/overflows {width}'\n            else:\n                assert page.locator('#header-more').is_hidden()\n            if width <= 720:\n                assert page.locator('#work-status').evaluate('(e)=>e.getBoundingClientRect().height <= 80'), f'activity rail too tall {width}'\n                assert page.locator('.decision.driving .speed-label select').evaluate('(e)=>e.getBoundingClientRect().width <= 90'), f'pacing control too prominent {width}'\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''            if width <= 720:\n                page.locator('#header-more summary').click(); page.locator('#more-install').click()\n            else:\n                page.locator('#install').click()\n'''
          new = '''            if width <= 900:\n                page.locator('#header-more summary').click(); page.locator('#more-install').click()\n            else:\n                page.locator('#install').click()\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          test.write_text(text)
          PY
          python3 -m py_compile web/tests/ui_e2e.py
          node --check web/app.js
          git diff --check
          git diff -- web/index.html web/app.css web/tests/ui_e2e.py
      - name: Commit presentation changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ui-polish.yml
          git add web/index.html web/app.css web/tests/ui_e2e.py
          git commit -m "fix(web): polish setup, tablet chrome and idle race state"
          git push origin HEAD:master
