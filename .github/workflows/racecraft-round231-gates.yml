name: Round 231 gate-choice screen
on:
  push:
    branches: [codex/racecraft-own-progress]
    paths:
      - .github/workflows/racecraft-round231-gates.yml
      - docs/experiments/round231/gate-candidate.patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: round231-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  champion-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: git apply docs/experiments/round231/gate-candidate.patch
      - run: sh build_main.sh
      - run: sh run_tests.sh
      - run: python tests/golden_races.py
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
  screen:
    name: ${{ matrix.label }} / ${{ matrix.slots }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - arm: 1
            label: checkpoint
            slots: odd
          - arm: 1
            label: checkpoint
            slots: even
          - arm: 2
            label: lap-crossing
            slots: odd
          - arm: 2
            label: lap-crossing
            slots: even
          - arm: 3
            label: both-gates
            slots: odd
          - arm: 3
            label: both-gates
            slots: even
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build isolated experiment
        run: |
          git apply --check docs/experiments/round231/gate-candidate.patch
          git apply docs/experiments/round231/gate-candidate.patch
          sh build_main.sh
          mkdir -p results
          java --version > results/java-version.txt 2>&1
          sha256sum theoreticRacing.jar docs/experiments/round231/gate-candidate.patch > results/build-sha256.txt
      - name: Prepare random-start profile
        env:
          SLOTS: ${{ matrix.slots }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          slots = {'odd': '1,3,5,7', 'even': '2,4,6,8'}[os.environ['SLOTS']]
          text = Path('tracks/lap_bench.properties').read_text()
          text += '\naiStartPlacement=legacy\ncandidateSlots=' + slots + '\n'
          Path('results/profile.properties').write_text(text)
          PY
      - name: Twenty-four-track screen on seeds 11-13
        env:
          RACING_PROPS: ${{ github.workspace }}/results/profile.properties
          RACING_HEAP: -Xmx4g -XX:ActiveProcessorCount=2 -Dai.experiment.gateChoice=${{ matrix.arm }}
          RACING_TRACKS: silverstone monza spa monaco spielberg nurburgring lemans interlagos zandvoort hungaroring coil cog chicane gear hairpin serpentine serpentine2 zigzag lobe5 weave3 fractal8 rand6 rand13 rand16
        run: sh tracks/fleet_grid.sh 11-13 2 results/fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round231-gates-${{ matrix.label }}-${{ matrix.slots }}
          path: results
          if-no-files-found: error
          retention-days: 14
