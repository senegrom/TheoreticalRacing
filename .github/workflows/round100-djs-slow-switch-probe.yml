name: Round 100 slower danger-switch probe

on:
  push:
    branches:
      - agent/ai-racing-speed-100-djs-probe
    paths:
      - .github/workflows/round100-djs-slow-switch-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        track:
          - silverstone
          - monza
          - spa
          - monaco
          - spielberg
          - nurburgring
          - lemans
          - interlagos
          - zandvoort
          - hungaroring
          - circle
          - the_long_loop
          - sprint
          - hairpin
          - triangle
          - chicane
          - bigoval
          - curve
          - zigzag
          - coil
          - slalom
          - gear
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Instrument slower danger switches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tr/logic/RaceAi.java')
          s = p.read_text()
          old_latch = '\tprivate static boolean\t\t\tinTrueRivalConfirm;'
          new_latch = '\tprivate boolean\t\t\t\tinTrueRivalConfirm;'
          assert s.count(old_latch) == 1
          s = s.replace(old_latch, new_latch, 1)
          old = '''\t\tif (dbg)\n\t\t\tSystem.err.println("AIDBG DJS  -> " + (best != null ? "SWITCH " + best + " simT=" + bestT\n\t\t\t\t\t: "KEEP " + chosen + " (no survivor)"));\n\t\treturn best != null ? best : chosen;\n'''
          new = '''\t\tif (dbg)\n\t\t\tSystem.err.println("AIDBG DJS  -> " + (best != null ? "SWITCH " + best + " simT=" + bestT\n\t\t\t\t\t: "KEEP " + chosen + " (no survivor)"));\n\t\tif (best != null) {\n\t\t\tfinal int chosenMapT = reach.turnsToFinish(cx, cy, cvx, cvy);\n\t\t\tfinal int bvx = vel[0] + best.dx, bvy = vel[1] + best.dy;\n\t\t\tfinal int bestMapT = reach.turnsToFinish(pos[0] + bvx, pos[1] + bvy, bvx, bvy);\n\t\t\tif (bestMapT > chosenMapT)\n\t\t\t\tSystem.err.println("AIDBG SLOWDJS p=" + playerNum + " pos=(" + pos[0] + ","\n\t\t\t\t\t\t+ pos[1] + ") vel=(" + vel[0] + "," + vel[1] + ") "\n\t\t\t\t\t\t+ chosen + " t=" + chosenMapT + " -> " + best + " t=" + bestMapT\n\t\t\t\t\t\t+ " rounds=" + rounds + " es=" + exactSelf + " er=" + exactRivals\n\t\t\t\t\t\t+ " sr=" + scorerRivals + " ss=" + scorerSelf + " tc=" + trueConfirm\n\t\t\t\t\t\t+ " thread=" + threadCheck + " trueDead=" + trueDead);\n\t\t}\n\t\treturn best != null ? best : chosen;\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify and build
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
      - name: Probe seeds 1-60
        env:
          TRACK: ${{ matrix.track }}
        run: |
          cp tracks/bench.properties /tmp/round100-djs.properties
          start=$(date +%s)
          java -Djava.awt.headless=true -jar theoreticRacing.jar --auto --track "$TRACK" \
            --props /tmp/round100-djs.properties --log "/tmp/round100-djs-${TRACK}.log" \
            --seed 1-60 >"round100-djs-${TRACK}.stdout" 2>"round100-djs-${TRACK}.stderr"
          elapsed=$(( $(date +%s) - start ))
          {
            echo "track=$TRACK"
            echo "elapsed_seconds=$elapsed"
            echo "events=$(grep -c 'AIDBG SLOWDJS' round100-djs-${TRACK}.stderr || true)"
            grep 'AIDBG SLOWDJS' "round100-djs-${TRACK}.stderr" || true
          } > "round100-djs-${TRACK}-switches.txt"
          cat "round100-djs-${TRACK}-switches.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round100-djs-${{ matrix.track }}
          path: round100-djs-${{ matrix.track }}-switches.txt
          if-no-files-found: error
