name: Round 109 Hungaroring one-move force scan

on:
  push:
    branches:
      - agent/ai-racing-speed-108-equal-speed-veto-gate
    paths:
      - .github/workflows/round109-force-scan.yml
      - tracks/round109_force_scan.py

jobs:
  wait-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wait for the Round 108 champion
        run: |
          for attempt in $(seq 1 720); do
            git fetch origin master
            if [ "$(git log -1 --format=%s origin/master)" = 'Round 108: veto false equal-speed switch targets' ]; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Build champion and diagnostic override jar
        run: |
          git worktree add /tmp/round109-force-master origin/master
          cd /tmp/round109-force-master
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round109-force-baseline.jar"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tr/logic/RaceAi.java')
          source = path.read_text()
          anchor = '''\tprivate Direction optimalMoveAI1(final int[] pos, final int[] vel, final int playerNum) {\n'''
          insert = anchor + r'''		final String forcedDirectionName = System.getProperty("ai.force.dir");
		if (!inScorerSim && forcedDirectionName != null
				&& Integer.getInteger("ai.force.player", -1) == playerNum
				&& Integer.getInteger("ai.force.x", Integer.MIN_VALUE) == pos[0]
				&& Integer.getInteger("ai.force.y", Integer.MIN_VALUE) == pos[1]
				&& Integer.getInteger("ai.force.vx", Integer.MIN_VALUE) == vel[0]
				&& Integer.getInteger("ai.force.vy", Integer.MIN_VALUE) == vel[1]) {
			final Direction forced = Direction.valueOf(forcedDirectionName);
			final int fvx = vel[0] + forced.dx, fvy = vel[1] + forced.dy;
			final int fx = pos[0] + fvx, fy = pos[1] + fvy;
			if (!RaceGame.aiVelocityOutOfRange(fvx, fvy)
					&& game.isMoveLegalGeometryCached(pos[0], pos[1], fx, fy)
					&& !game.isCrashingPlayer(fx, fy, playerNum)) {
				System.err.println("AIDBG FORCE p=" + playerNum + " pos=(" + pos[0] + ","
						+ pos[1] + ") vel=(" + vel[0] + "," + vel[1] + ") -> " + forced);
				return forced;
			}
		}
'''
          assert source.count(anchor) == 1
          path.write_text(source.replace(anchor, insert, 1))
          PY
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round109-force-instrumented.jar"
      - name: Scan the crashed car's last 24 moves
        run: |
          python tracks/round109_force_scan.py \
            --baseline round109-force-baseline.jar \
            --instrumented round109-force-instrumented.jar \
            --tail 24 --workers 6 --out round109-force-scan.json
          test -s round109-force-scan.json
          test -s round109-best.json
      - uses: actions/upload-artifact@v4
        with:
          name: round109-hungaroring-force-scan
          path: |
            round109-force-scan.json
            round109-best.json
            round109-force-debug.stderr
          if-no-files-found: error
          retention-days: 30
