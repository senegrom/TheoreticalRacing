name: Round 125 speed-squared-gain-five census

on:
  push:
    branches:
      - agent/ai-racing-speed-125-low5-census
    paths:
      - .github/workflows/round125-low5-census.yml
      - tracks/round125_apply.py
      - tracks/round125_compare.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round125-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round125-run-id.txt
          git commit -m 'Record Round 125 census run'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Build exact live-master pair
        run: |
          git fetch origin master
          git rev-parse origin/master > round125-base-sha.txt
          git worktree add /tmp/round125-low5 origin/master
          cd /tmp/round125-low5
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round125-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round125_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'AI1_FIELD_ACCEL_FRONTIER_MIN_SPEED2_GAIN.*= 5' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round125-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round125.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: round125-build
          path: |
            round125-baseline.jar
            round125-candidate.jar
            round125-base-sha.txt
            round125.patch
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        track:
          - coil
          - spa
          - silverstone
          - interlagos
          - hungaroring
          - lemans
          - monza
          - zandvoort
          - nurburgring
          - spielberg
          - monaco
          - the_long_loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round125-build
          path: .
      - name: Compare exact seeded outcomes
        env:
          TRACK: ${{ matrix.track }}
        run: |
          python tracks/round125_compare.py \
            --baseline round125-baseline.jar \
            --candidate round125-candidate.jar \
            --track "$TRACK" --start 1 --end 150 \
            --out "round125-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round125-result-${{ matrix.track }}
          path: round125-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round125-result-*
          path: round125-results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: round125-build
          path: .
      - name: Aggregate focused screen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': Path('round125-base-sha.txt').read_text().strip(),
              'candidate': 'moderate_field_accel_min_speed2_gain_5',
              'pairs': 0,
              'counts': {},
              'net_moves': 0,
              'events': [],
              'runtime_ratios': {},
          }
          for path in sorted(Path('round125-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          assert summary['pairs'] == 1800, summary
          Path('round125-low5-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round125-summary
          path: round125-low5-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish focused summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add round125-low5-summary.json
          git commit -m 'Record Round 125 low-five census'
          git push origin HEAD:"$GITHUB_REF_NAME"
