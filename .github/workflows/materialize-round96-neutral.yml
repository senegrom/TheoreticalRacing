name: Materialize Round 96 neutral acceleration

on:
  push:
    branches:
      - agent/ai-racing-speed-96-neutral-accel-final
    paths:
      - .github/workflows/materialize-round96-neutral.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact Round 96 candidate
        env:
          PATCH_B64: 
        run: |
          test "$(git rev-parse HEAD^)" = 434da856d1a454a417eecb373eb7f15869296b23
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round96-neutral.patch
          printf '%s  %s\n' '97a6328b3c8649b275272a14532b1532f328a7c2da97d75bf0f760a94bd0339e' /tmp/round96-neutral.patch | sha256sum -c -
          git apply --check /tmp/round96-neutral.patch
          git apply /tmp/round96-neutral.patch
          rm .github/workflows/materialize-round96-neutral.yml
      - name: Verify exact candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_neutral_accel_pace_regression.py
          python -m compileall -q tracks tests
          sh -n build_main.sh run_tests.sh run_golden_tests.sh
          git diff --check
      - name: Commit exact candidate
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Round 96: certify neutral finish acceleration'
          git push origin HEAD
