name: Materialize Round 96 neutral acceleration

on:
  push:
    branches:
      - agent/ai-racing-speed-96-neutral-accel-final
    paths:
      - .github/workflows/materialize-round96-neutral.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact source patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/round96-source.patch
          printf '%s  %s\n' 'd81baf1b0bbc138160936f29404bebbdf498a7375fd45ef1cb4c77903b7154d0' /tmp/round96-source.patch | sha256sum -c -
          git apply --check /tmp/round96-source.patch
          git apply /tmp/round96-source.patch
      - name: Verify source candidate
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python - <<'PY'
          from pathlib import Path
          import sys, tempfile
          sys.path.insert(0, str(Path.cwd() / 'tracks'))
          import bench_ai
          expected = {
              'AI1': (7, 0, [65, 66, 66, 66, 66, 67, 68]),
              'AI2': (7, 0, [65, 66, 66, 66, 67, 67, 68]),
          }
          with tempfile.TemporaryDirectory(prefix='r96-source-check-') as directory:
              bench_ai.configure_runtime(directory)
              bench_ai.set_nplayers(8)
              for kind in ('AI1', 'AI2'):
                  bench_ai.set_all_to(kind)
                  result = bench_ai.run_track('zigzag', timeout=900, seed=2)
                  assert result == expected[kind], (kind, result)
          PY
          python -m compileall -q tracks tests
          git diff --check
      - name: Commit source candidate
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java
          git diff --cached --check
          git commit -m 'Round 96: certify neutral finish acceleration'
          git push origin HEAD
