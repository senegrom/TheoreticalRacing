name: Round 115 live-source export

on:
  push:
    branches:
      - agent/ai-racing-speed-115-source-export
    paths:
      - .github/workflows/round115-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record exact source commit
        run: |
          git rev-parse HEAD > round115-source-sha.txt
          tar --exclude=.git -czf round115-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: round115-live-source
          path: |
            round115-source.tar.gz
            round115-source-sha.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish the workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round115-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round115-run-id.txt
          git commit -m 'Record Round 115 source-export run'
          git push origin HEAD:"$GITHUB_REF_NAME"
