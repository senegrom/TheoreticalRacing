name: Round 135 post-point-cache profile

on:
  push:
    branches:
      - agent/ai-racing-speed-134-point-containment-cache
    paths:
      - .github/workflows/round135-post-point-profile.yml

permissions:
  contents: write

concurrency:
  group: round135-post-point-profile
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish workflow run locator
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round135-profile-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'status_at_locator': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round135-profile-status.json
          git commit -m 'Round 135: record profile run' || exit 0
          git push

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build the live-master plus exact point-cache candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round135-profile-base-sha.txt
          git worktree add /tmp/round135-profile "$BASE"
          cd /tmp/round135-profile
          python "$GITHUB_WORKSPACE/tracks/round134_apply.py"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'src/tr/logic/RaceGame.java tests/tr/logic/CoreTests.java '
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round135-candidate.jar"
      - name: Record warm Monaco JFR
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('tracks/bench.properties').read_text().splitlines()
          lines = []
          for line in source:
              if re.match(r'^player[1-8]Kind=', line):
                  line = line.split('=', 1)[0] + '=AI2'
              lines.append(line)
          Path('round135-profile.properties').write_text('\n'.join(lines) + '\n')
          PY
          mkdir -p round135-reach-cache round135-logs
          export RACING_REACH_CACHE="$PWD/round135-reach-cache"
          java -Djava.awt.headless=true -jar round135-candidate.jar \
            --auto --track monaco --props round135-profile.properties \
            --log round135-logs/warm.log --seed 1-2
          java \
            -XX:StartFlightRecording=filename=round135-monaco.jfr,settings=profile,dumponexit=true \
            -Djava.awt.headless=true -jar round135-candidate.jar \
            --auto --track monaco --props round135-profile.properties \
            --log round135-logs/profile.log --seed 1-10
          jfr view hot-methods round135-monaco.jfr > round135-hot-methods.txt
          jfr view allocation-by-class round135-monaco.jfr > round135-allocation-by-class.txt
          jfr view gc-configuration round135-monaco.jfr > round135-gc-configuration.txt
          jfr summary round135-monaco.jfr > round135-jfr-summary.txt
          gzip -9 round135-monaco.jfr
      - uses: actions/upload-artifact@v4
        with:
          name: round135-post-point-profile
          path: |
            round135-profile-base-sha.txt
            round135-hot-methods.txt
            round135-allocation-by-class.txt
            round135-gc-configuration.txt
            round135-jfr-summary.txt
            round135-monaco.jfr.gz
          if-no-files-found: error
          retention-days: 30
