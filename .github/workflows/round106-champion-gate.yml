name: Round 106 mirrored champion gate

on:
  push:
    branches:
      - agent/ai-racing-speed-106-champion-gate-v2
    paths:
      - .github/workflows/round106-champion-gate.yml
      - tracks/round106_instance_opening.py
      - tracks/round106_equal_speed_veto.py
      - tracks/round106_mirror.py
      - tracks/round106_compare.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact Round 105 baseline
        run: |
          sh ./build_main.sh
          cp theoreticRacing.jar round106-baseline.jar
      - name: Apply the mirrored Round 106 candidate
        run: |
          python tracks/round106_instance_opening.py
          python tracks/round106_equal_speed_veto.py
          python tracks/round106_mirror.py
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar round106-candidate.jar
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
          git diff --check
      - name: Prepare the AI2 comparator
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tracks/round106_compare.py').read_text()
          old = "r'\\1=AI1'"
          new = "r'\\1=AI2'"
          assert source.count(old) == 1
          Path('tracks/round106_compare_ai2.py').write_text(source.replace(old, new, 1))
          PY
      - name: Pin both rescues and two controls for both agents
        run: |
          for entry in 'AI1 tracks/round106_compare.py' 'AI2 tracks/round106_compare_ai2.py'; do
            set -- $entry
            kind=$1
            script=$2
            for spec in 'hungaroring 144 rescue-h144' 'zandvoort 115 rescue-z115' \
                        'zandvoort 128 control-z128' 'zandvoort 134 control-z134'; do
              set -- $spec
              python "$script" --baseline round106-baseline.jar \
                --candidate round106-candidate.jar --track "$1" --start "$2" --end "$2" \
                --out "${kind}-$3.json"
            done
          done
          python - <<'PY'
          import json
          for kind in ('AI1', 'AI2'):
              for name in ('rescue-h144', 'rescue-z115'):
                  data = json.load(open(f'{kind}-{name}.json'))
                  assert data['counts'].get('safety_gain') == 1, data
                  event = data['events'][0]
                  assert len(event['candidate']['finishes']) == 7, event
                  assert not event['candidate']['crashes'], event
              for name in ('control-z128', 'control-z134'):
                  data = json.load(open(f'{kind}-{name}.json'))
                  assert data['counts'].get('identical') == 1, data
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round106-champion-jars
          path: |
            round106-baseline.jar
            round106-candidate.jar
            AI1-*.json
            AI2-*.json
          if-no-files-found: error
          retention-days: 3

  differential:
    needs: verify
    name: ${{ matrix.kind }} differential ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        kind: [AI1, AI2]
        track: [circle, triangle, curve, hairpin, chicane, sprint, bigoval, slalom,
                gear, coil, zigzag, the_long_loop, monaco, hungaroring, interlagos,
                lemans, spa, silverstone, monza, zandvoort, nurburgring, spielberg,
                serpentine, serpentine2, spiral, cog]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round106-champion-jars
          path: .
      - name: Select comparator
        env:
          KIND: ${{ matrix.kind }}
        run: |
          cp tracks/round106_compare.py tracks/round106-selected-compare.py
          if [ "$KIND" = AI2 ]; then
            python - <<'PY'
            from pathlib import Path
            path = Path('tracks/round106-selected-compare.py')
            source = path.read_text()
            old = "r'\\1=AI1'"
            assert source.count(old) == 1
            path.write_text(source.replace(old, "r'\\1=AI2'", 1))
            PY
          fi
      - name: Compare canonical and fresh windows
        env:
          KIND: ${{ matrix.kind }}
          TRACK: ${{ matrix.track }}
        run: |
          case "$TRACK" in
            serpentine|serpentine2|spiral|cog)
              python tracks/round106-selected-compare.py \
                --baseline round106-baseline.jar --candidate round106-candidate.jar \
                --track "$TRACK" --start 1 --end 50 \
                --out "${KIND}-${TRACK}-1-50.json"
              ;;
            *)
              python tracks/round106-selected-compare.py \
                --baseline round106-baseline.jar --candidate round106-candidate.jar \
                --track "$TRACK" --start 1 --end 25 \
                --out "${KIND}-${TRACK}-1-25.json"
              python tracks/round106-selected-compare.py \
                --baseline round106-baseline.jar --candidate round106-candidate.jar \
                --track "$TRACK" --start 106 --end 150 \
                --out "${KIND}-${TRACK}-106-150.json"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round106-${{ matrix.kind }}-${{ matrix.track }}
          path: '${{ matrix.kind }}-*.json'
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: round106-AI*
          path: results
          merge-multiple: true
      - name: Aggregate both-agent differential
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {'pairs': 0, 'counts': {}, 'net_moves': 0, 'events': []}
          for path in sorted(Path('results').glob('*.json')):
              data = json.load(open(path))
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              kind = path.name.split('-', 1)[0]
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              for event in data['events']:
                  summary['events'].append({'agent': kind, 'track': data['track'], **event})
          Path('round106-champion-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('safety_regression', 'slower', 'redistribution'))
          assert summary['pairs'] == 3480, summary
          assert summary['counts'].get('safety_gain', 0) >= 4, summary
          assert not bad, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round106-champion-summary
          path: round106-champion-summary.json
          if-no-files-found: error
          retention-days: 30
