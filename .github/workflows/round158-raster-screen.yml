name: Round 158 shared legality-raster screen

on:
  push:
    branches:
      - agent/ai-racing-speed-158-shared-legality-rasters
    paths:
      - .github/workflows/round158-raster-screen.yml
      - tracks/round158_apply.py
      - tracks/round158_compare.py
      - tracks/round158_publish.py
      - tracks/round158_runtime.py

permissions:
  contents: write

concurrency:
  group: round158-shared-raster-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record screen run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round158-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'screen-started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round158-status.json
          git commit -m 'Round 158: record shared-raster screen run' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build live-master baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round158-base-sha.txt
          git worktree add /tmp/round158-screen "$BASE"
          cd /tmp/round158-screen
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round158-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round158_apply.py"
          git diff --name-only | sort > /tmp/round158-changed.txt
          printf '%s\n' \
            src/tr/logic/RaceGame.java \
            tests/tr/logic/CoreTests.java \
            | sort > /tmp/round158-expected.txt
          diff -u /tmp/round158-expected.txt /tmp/round158-changed.txt
          test "$(grep -c 'final RasterMaps cached = findRasterMaps' src/tr/logic/RaceGame.java)" = 1
          test "$(grep -c 'private static void testSharedRasterMaps()' tests/tr/logic/CoreTests.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round158-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Measure five-pair dual-order warm batch speed
        shell: bash
        run: |
          set +e
          python tracks/round158_runtime.py \
            --baseline round158-baseline.jar \
            --candidate round158-candidate.jar \
            --pairs 5 --aggregate-limit 0.95 --case-limit 1.05 \
            --out round158-runtime.json
          RC=$?
          set -e
          test -s round158-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round158-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          if [ "$RC" -ne 0 ]; then
            echo 'Round 158 did not clear the five-percent aggregate threshold.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round158-raster-screen
          path: |
            round158-base-sha.txt
            round158-runtime.json
          if-no-files-found: warn
          retention-days: 30
