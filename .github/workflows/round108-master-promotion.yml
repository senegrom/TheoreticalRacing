name: Promote verified Round 108 to master

on:
  push:
    branches:
      - agent/ai-racing-speed-108-equal-speed-veto-gate
    paths:
      - .github/workflows/round108-master-promotion.yml

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wait for the exact 3,500-pair gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = 'https://api.github.com/repos/senegrom/TheoreticalRacing/actions/runs/32043962056'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'round108-master-promotion',
          }
          for _ in range(720):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              print('gate status=', run['status'], 'conclusion=', run.get('conclusion'), flush=True)
              if run['status'] == 'completed':
                  if run.get('conclusion') != 'success':
                      raise SystemExit(f"Round 108 gate did not pass: {run.get('conclusion')}")
                  break
              time.sleep(30)
          else:
              raise SystemExit('timed out waiting for Round 108 gate')
          if run.get('head_sha') != '4024a1ec17b964916e17ed9cb07d8d7a850ae173':
              raise SystemExit(f"unexpected gate head: {run.get('head_sha')}")
          PY
      - name: Verify the produced production commit is a clean fast-forward
        run: |
          git fetch origin master agent/ai-racing-speed-108-equal-speed-veto
          MASTER=$(git rev-parse origin/master)
          CANDIDATE=$(git rev-parse origin/agent/ai-racing-speed-108-equal-speed-veto)
          PARENT=$(git rev-parse "$CANDIDATE^")
          echo "master=$MASTER"
          echo "candidate=$CANDIDATE"
          echo "candidate-parent=$PARENT"
          test "$PARENT" = "$MASTER"
          git diff --name-only "$MASTER..$CANDIDATE" | sort > /tmp/round108-files.txt
          printf '%s\n' \
            AI_DEVELOPMENT.md \
            racing-memory.md \
            src/tr/logic/RaceAi.java \
            tests/ai1_equal_speed_veto_regression.py \
            > /tmp/round108-expected.txt
          diff -u /tmp/round108-expected.txt /tmp/round108-files.txt
          git show "$CANDIDATE:src/tr/logic/RaceAi.java" | grep -q 'Round 108 AI1 frontier:'
          test "$(git show "$CANDIDATE:src/tr/logic/RaceAi.java" | grep -c 'Round 108 AI1 frontier:')" = 1
          test "$(git show "$CANDIDATE:src/tr/logic/RaceAi.java" | grep -c 'Round 95: the topology-shaped model can false-kill a genuinely')" = 1
      - name: Re-run production tests from the exact candidate commit
        run: |
          git checkout --detach origin/agent/ai-racing-speed-108-equal-speed-veto
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/ai1_equal_speed_veto_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
          git diff --check
      - name: Fast-forward master
        run: |
          git fetch origin master
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/master)"
          git push origin HEAD:master
