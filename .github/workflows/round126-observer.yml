name: Observe Round 126 gate

on:
  push:
    branches:
      - agent/ai-racing-speed-126-equal-speed-veto
    paths:
      - .github/workflows/round126-observer.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record latest Round 126 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            'repos/${{ github.repository }}/actions/workflows/round126-equal-speed-veto.yml/runs?branch=agent%2Fai-racing-speed-126-equal-speed-veto&per_page=5' \
            --jq '.workflow_runs[0] | {id,status,conclusion,head_sha,created_at,updated_at}' \
            > round126-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round126-status.json
          git commit -m 'Record Round 126 gate status'
          git push origin HEAD:"$GITHUB_REF_NAME"
