name: Round 124 split-finish exact gate

on:
  push:
    branches:
      - agent/ai-racing-speed-124-early-round-trap
    paths:
      - .github/workflows/round124-split-finish-gate.yml

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master pair
        run: |
          git fetch origin master
          git rev-parse origin/master > round124-base-sha.txt
          git worktree add /tmp/round124-split origin/master
          cd /tmp/round124-split
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round124-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round124_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'earlyRoundTrapFrontier' src/tr/logic/RaceAi.java)" = 2
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round124-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round124-split-build
          path: |
            round124-baseline.jar
            round124-candidate.jar
            round124-base-sha.txt
          if-no-files-found: error
          retention-days: 14

  long-track-chunks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { track: zandvoort, start_seed: 1, end_seed: 50, chunk: a }
          - { track: zandvoort, start_seed: 51, end_seed: 100, chunk: b }
          - { track: zandvoort, start_seed: 101, end_seed: 150, chunk: c }
          - { track: spielberg, start_seed: 1, end_seed: 50, chunk: a }
          - { track: spielberg, start_seed: 51, end_seed: 100, chunk: b }
          - { track: spielberg, start_seed: 101, end_seed: 150, chunk: c }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round124-split-build
          path: .
      - name: Compare exact chunk
        env:
          TRACK: ${{ matrix.track }}
          START_SEED: ${{ matrix.start_seed }}
          END_SEED: ${{ matrix.end_seed }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          python tracks/round124_compare.py \
            --baseline round124-baseline.jar --candidate round124-candidate.jar \
            --track "$TRACK" --start "$START_SEED" --end "$END_SEED" \
            --out "round124-${TRACK}-${CHUNK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round124-split-result-${{ matrix.track }}-${{ matrix.chunk }}
          path: round124-${{ matrix.track }}-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: long-track-chunks
    runs-on: ubuntu-latest
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download the 3,200 completed prior-run pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p round124-results/prior
          gh api 'repos/${{ github.repository }}/actions/runs/32173382503/artifacts?per_page=100' \
            --jq '.artifacts[] | select(.name | startswith("round124-v2-result-")) | select(.name != "round124-v2-result-zandvoort") | select(.name != "round124-v2-result-spielberg") | [.id,.name] | @tsv' \
            > /tmp/prior-artifacts.tsv
          test "$(wc -l < /tmp/prior-artifacts.tsv)" = 24
          while IFS=$'\t' read -r id name; do
            gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "/tmp/${name}.zip"
            unzip -q "/tmp/${name}.zip" -d round124-results/prior
          done < /tmp/prior-artifacts.tsv
          test "$(find round124-results/prior -name '*.json' | wc -l)" = 24
      - uses: actions/download-artifact@v4
        with:
          pattern: round124-split-result-*
          path: round124-results/chunks
          merge-multiple: true
      - name: Enforce exact per-driver no-slowdown policy
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          summary = {
              'candidate': 'early_round_trap_l2',
              'pairs': 0,
              'counts': {},
              'events': [],
              'net_moves': 0,
              'runtime_ratios': {},
          }
          for path in sorted(Path('round124-results').rglob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][path.stem] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          summary['bad'] = bad
          summary['viable'] = (
              summary['pairs'] == 3500
              and bad == 0
              and summary['counts'].get('pareto_faster', 0) > 0
          )
          Path('round124-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if summary['viable'] else 'false'), file=out)
          assert summary['pairs'] == 3500, summary
          assert bad == 0, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round124-split-summary
          path: round124-summary.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, summarize]
    if: needs.summarize.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round124-split-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round124-split-summary
          path: .
      - name: Bound active-race runtime overhead
        run: |
          python - <<'PY'
          import json, re, statistics, subprocess, tempfile, time
          from pathlib import Path

          root = Path.cwd()
          event = next(e for e in json.loads(Path('round124-summary.json').read_text())['events']
                       if e['classification'] == 'pareto_faster')
          track, seed = event['track'], event['seed']

          def write_props(path):
              lines = []
              for line in (root / 'tracks' / 'bench.properties').read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar):
              with tempfile.TemporaryDirectory(prefix='round124-time-') as directory:
                  tmp = Path(directory)
                  props, log = tmp / 'bench.properties', tmp / 'race.log'
                  write_props(props)
                  started = time.perf_counter()
                  result = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(props),
                      '--log', str(log), '--seed', str(seed),
                  ], cwd=root, text=True, capture_output=True, timeout=1800)
                  if result.returncode:
                      raise SystemExit(result.stderr[-3000:])
                  return time.perf_counter() - started

          run('round124-baseline.jar')
          run('round124-candidate.jar')
          baseline, candidate = [], []
          for index in range(5):
              if index % 2:
                  baseline.append(run('round124-baseline.jar'))
                  candidate.append(run('round124-candidate.jar'))
              else:
                  candidate.append(run('round124-candidate.jar'))
                  baseline.append(run('round124-baseline.jar'))
          ratio = statistics.median(candidate) / statistics.median(baseline)
          result = {'track': track, 'seed': seed, 'ratio': ratio,
                    'baseline': baseline, 'candidate': candidate}
          Path('round124-runtime.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          assert ratio <= 1.50, result
          PY
      - name: Materialize, retest and publish master
        run: |
          cp tracks/round124_apply.py /tmp/round124_apply.py
          cp tracks/round124_publish.py /tmp/round124_publish.py
          EXPECTED=$(cat round124-base-sha.txt)
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
          git checkout -B round124-production origin/master
          python /tmp/round124_apply.py
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          python /tmp/round124_publish.py
          python tests/ai1_early_round_trap_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tr/logic/RaceAi.java \
            tests/ai1_early_round_trap_regression.py \
            AI_DEVELOPMENT.md racing-memory.md
          git commit -m 'Round 124: certify phase-consistent trap acceleration'
          git push origin HEAD:master
          git rev-parse HEAD > round124-master-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: round124-split-promotion
          path: |
            round124-summary.json
            round124-runtime.json
            round124-master-sha.txt
          if-no-files-found: error
          retention-days: 30
