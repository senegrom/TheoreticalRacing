name: Round 126 equal-speed false-target veto

on:
  push:
    branches:
      - agent/ai-racing-speed-126-equal-speed-veto
    paths:
      - .github/workflows/round126-equal-speed-veto.yml
      - tracks/round126_apply.py
      - tracks/round126_compare.py
      - tracks/round126_publish.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact current-master pair
        run: |
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          test "$BASE" = '453330a1098ed0dfcc092f37faeb190cf3400d5b'
          printf '%s\n' "$BASE" > round126-base-sha.txt
          git worktree add /tmp/round126-work "$BASE"
          cd /tmp/round126-work
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round126-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round126_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'Round 126 AI1 frontier' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round126-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round126.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: round126-build
          path: |
            round126-baseline.jar
            round126-candidate.jar
            round126-base-sha.txt
            round126.patch
          if-no-files-found: error
          retention-days: 14

  target:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round126-build
          path: .
      - name: Prove the target and sensitive controls
        run: |
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track zandvoort --start 115 --end 115 --out target-z115.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track zandvoort --start 128 --end 128 --out control-z128.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track zandvoort --start 134 --end 134 --out control-z134.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track zandvoort --start 195 --end 195 --out control-z195.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track hungaroring --start 144 --end 144 --out control-h144.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track lemans --start 4 --end 4 --out control-l4.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track hairpin --start 68 --end 68 --out control-hair68.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --track silverstone --start 93 --end 93 --out control-s93.json
          python tracks/round126_compare.py --baseline round126-baseline.jar --candidate round126-candidate.jar --baseline-kind AI2 --candidate-kind AI2 --track zandvoort --start 115 --end 115 --out control-ai2-z115.json
          python - <<'PY'
          import json
          from pathlib import Path

          rows = {path.stem: json.loads(path.read_text()) for path in Path('.').glob('*.json')}
          target = rows['target-z115']
          assert target['counts']['safety_gain'] == 1 and len(target['events']) == 1, target
          for name in ('control-z128', 'control-z134', 'control-h144',
                       'control-l4', 'control-hair68', 'control-s93',
                       'control-ai2-z115'):
              row = rows[name]
              assert row['counts']['identical'] == 1 and not row['events'], (name, row)
          z195 = rows['control-z195']
          bad = sum(z195['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          assert bad == 0, z195
          Path('round126-target-summary.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round126-target
          path: round126-target-summary.json
          if-no-files-found: error
          retention-days: 30

  differential:
    needs: [prepare, target]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { track: circle, end_seed: 150 }
          - { track: triangle, end_seed: 150 }
          - { track: curve, end_seed: 150 }
          - { track: hairpin, end_seed: 150 }
          - { track: chicane, end_seed: 150 }
          - { track: sprint, end_seed: 150 }
          - { track: bigoval, end_seed: 150 }
          - { track: slalom, end_seed: 150 }
          - { track: gear, end_seed: 150 }
          - { track: coil, end_seed: 150 }
          - { track: zigzag, end_seed: 150 }
          - { track: the_long_loop, end_seed: 150 }
          - { track: monaco, end_seed: 150 }
          - { track: hungaroring, end_seed: 150 }
          - { track: interlagos, end_seed: 150 }
          - { track: lemans, end_seed: 150 }
          - { track: spa, end_seed: 150 }
          - { track: silverstone, end_seed: 150 }
          - { track: monza, end_seed: 150 }
          - { track: zandvoort, end_seed: 150 }
          - { track: nurburgring, end_seed: 150 }
          - { track: spielberg, end_seed: 150 }
          - { track: serpentine, end_seed: 50 }
          - { track: serpentine2, end_seed: 50 }
          - { track: spiral, end_seed: 50 }
          - { track: cog, end_seed: 50 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round126-build
          path: .
      - name: Compare exact seeded outcomes
        env:
          TRACK: ${{ matrix.track }}
          END_SEED: ${{ matrix.end_seed }}
        run: |
          python tracks/round126_compare.py \
            --baseline round126-baseline.jar --candidate round126-candidate.jar \
            --track "$TRACK" --start 1 --end "$END_SEED" \
            --out "round126-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round126-result-${{ matrix.track }}
          path: round126-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    outputs:
      viable: ${{ steps.gate.outputs.viable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round126-result-*
          path: round126-results
          merge-multiple: true
      - name: Enforce exact safety and no-slowdown policy
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          summary = {
              'baseline_sha': '453330a1098ed0dfcc092f37faeb190cf3400d5b',
              'candidate': 'equal_speed_false_target_veto',
              'pairs': 0,
              'counts': {},
              'events': [],
              'net_moves': 0,
              'runtime_ratios': {},
          }
          for path in sorted(Path('round126-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('aggregate_faster', 'slower', 'safety_regression', 'redistribution'))
          target = [event for event in summary['events']
                    if event['track'] == 'zandvoort' and event['seed'] == 115
                    and event['classification'] == 'safety_gain']
          summary['bad'] = bad
          summary['viable'] = (
              summary['pairs'] == 3500
              and bad == 0
              and summary['counts'].get('safety_gain', 0) >= 1
              and len(target) == 1
          )
          Path('round126-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('viable=' + ('true' if summary['viable'] else 'false'), file=out)
          assert summary['pairs'] == 3500, summary
          assert bad == 0, summary
          assert len(target) == 1, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round126-summary
          path: round126-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Record exact gate result
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round126-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round126-summary.json round126-run-id.txt
          git commit -m 'Record Round 126 exact safety gate'
          git push origin HEAD:agent/ai-racing-speed-126-equal-speed-veto

  publish:
    needs: [prepare, target, summarize]
    if: needs.summarize.outputs.viable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round126-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: round126-summary
          path: .
      - name: Verify evidence and immutable parent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('round126-summary.json').read_text())
          assert summary['candidate'] == 'equal_speed_false_target_veto', summary
          assert summary['pairs'] == 3500 and summary['bad'] == 0 and summary['viable'], summary
          assert any(e['track'] == 'zandvoort' and e['seed'] == 115
                     and e['classification'] == 'safety_gain'
                     for e in summary['events']), summary
          PY
          EXPECTED=$(cat round126-base-sha.txt)
          test "$EXPECTED" = '453330a1098ed0dfcc092f37faeb190cf3400d5b'
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
      - name: Measure active and control runtime
        run: |
          python - <<'PY'
          import json, re, statistics, subprocess, tempfile, time
          from pathlib import Path

          root = Path.cwd()
          source = root / 'tracks' / 'bench.properties'

          def write_props(path):
              lines = []
              for line in source.read_text().splitlines():
                  if re.match(r'^player[1-8]Kind=', line):
                      line = line.split('=', 1)[0] + '=AI1'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')

          def run(jar, track, seed):
              with tempfile.TemporaryDirectory(prefix='round126-time-') as directory:
                  tmp = Path(directory)
                  props, log = tmp / 'bench.properties', tmp / 'race.log'
                  write_props(props)
                  started = time.perf_counter()
                  result = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(props),
                      '--log', str(log), '--seed', str(seed),
                  ], cwd=root, text=True, capture_output=True, timeout=1800)
                  if result.returncode:
                      raise SystemExit(result.stderr[-3000:])
                  return time.perf_counter() - started

          rows = []
          for track, seed, bounded in [('zandvoort', 115, False),
                                       ('lemans', 4, True), ('circle', 10, True)]:
              run('round126-baseline.jar', track, seed)
              run('round126-candidate.jar', track, seed)
              baseline, candidate = [], []
              for index in range(5):
                  if index % 2:
                      baseline.append(run('round126-baseline.jar', track, seed))
                      candidate.append(run('round126-candidate.jar', track, seed))
                  else:
                      candidate.append(run('round126-candidate.jar', track, seed))
                      baseline.append(run('round126-baseline.jar', track, seed))
              ratio = statistics.median(candidate) / statistics.median(baseline)
              row = {'track': track, 'seed': seed, 'ratio': ratio,
                     'baseline': baseline, 'candidate': candidate}
              rows.append(row)
              if bounded:
                  assert ratio <= 1.50, row
          Path('round126-runtime.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY
      - name: Reproduce, test and publish production source
        run: |
          cp tracks/round126_apply.py /tmp/round126_apply.py
          cp tracks/round126_publish.py /tmp/round126_publish.py
          cp round126.patch /tmp/round126.patch
          cp round126-summary.json /tmp/round126-summary.json
          cp round126-runtime.json /tmp/round126-runtime.json
          EXPECTED=$(cat round126-base-sha.txt)
          git reset --hard
          git clean -fd
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED"
          git checkout -B round126-production origin/master
          python /tmp/round126_apply.py
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git diff -- src/tr/logic/RaceAi.java > /tmp/round126-reproduced.patch
          cmp /tmp/round126.patch /tmp/round126-reproduced.patch
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp /tmp/round126-summary.json round126-summary.json
          python /tmp/round126_publish.py
          python tests/ai1_equal_speed_veto_regression.py
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
          python - <<'PY'
          from pathlib import Path
          for name in ('AI_DEVELOPMENT.md', 'racing-memory.md'):
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tr/logic/RaceAi.java \
            tests/ai1_equal_speed_veto_regression.py \
            AI_DEVELOPMENT.md racing-memory.md
          git commit -m 'Round 126: veto false equal-speed switch targets'
          git push origin HEAD:master
          git rev-parse HEAD > round126-master-sha.txt
          cp /tmp/round126-runtime.json round126-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: round126-promotion
          path: |
            round126-summary.json
            round126-runtime.json
            round126-master-sha.txt
          if-no-files-found: error
          retention-days: 30
