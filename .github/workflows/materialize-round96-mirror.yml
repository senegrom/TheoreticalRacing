name: Materialize Round 96 champion mirror

on:
  push:
    branches:
      - agent/ai-racing-speed-96-champion-promotion
    paths:
      - .github/workflows/materialize-round96-mirror.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact AI2 mirror
        run: |
          sed -i 's/^ diff --git/diff --git/' round96-mirror.patch
          git apply --check round96-mirror.patch
          git apply round96-mirror.patch
      - name: Verify mirrored champion
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_neutral_accel_pace_regression.py
          python -m compileall -q tracks tests
          sh -n build_main.sh run_tests.sh run_golden_tests.sh
          git diff --check
      - name: Commit exact mirror
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java tests/ai1_neutral_accel_pace_regression.py
          git diff --cached --check
          git commit -m 'Round 96: promote neutral finish acceleration'
          git push origin HEAD
