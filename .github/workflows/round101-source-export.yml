name: Export Round 101 source

on:
  push:
    branches:
      - agent/ai-racing-speed-101-source-export
    paths:
      - .github/workflows/round101-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive exact source tree
        run: tar --exclude=.git -czf /tmp/theoretical-racing-round101.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: theoretical-racing-round101-source
          path: /tmp/theoretical-racing-round101.tar.gz
          retention-days: 3
          if-no-files-found: error
