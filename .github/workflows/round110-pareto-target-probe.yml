name: Round 110 per-rival Pareto frontier probe

on:
  push:
    branches:
      - agent/ai-racing-speed-110-pareto-field-proof
    paths:
      - .github/workflows/round110-pareto-target-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build baseline and per-rival candidate
        run: |
          git fetch origin master
          git worktree add /tmp/round110-target origin/master
          cd /tmp/round110-target
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round110_apply_pareto_field.py"
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/candidate.jar"
      - name: Replay acceleration frontier
        run: |
          mkdir -p baseline candidate results
          for spec in \
            'coil 7' 'coil 9' 'coil 12' 'coil 33' \
            'interlagos 26' 'interlagos 38' 'interlagos 40' 'interlagos 54' \
            'monza 39' \
            'silverstone 20' 'silverstone 56' \
            'spa 5' 'spa 7' 'spa 38' 'spa 49' 'spa 57' \
            'zandvoort 99' \
            'hungaroring 144' 'zandvoort 115' 'lemans 4'; do
            set -- $spec
            track=$1
            seed=$2
            python tracks/round109_compare_pace.py run --jar baseline.jar \
              --track "$track" --start "$seed" --end "$seed" \
              --label baseline --directory baseline
            python tracks/round109_compare_pace.py run --jar candidate.jar \
              --track "$track" --start "$seed" --end "$seed" \
              --label candidate --directory candidate
            python tracks/round109_compare_pace.py compare \
              --track "$track" --start "$seed" --end "$seed" \
              --baseline-dir baseline --candidate-dir candidate \
              --out "results/${track}-${seed}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {'variant': 'per_rival_pareto_field', 'pairs': 0,
                     'counts': {}, 'net_moves': 0, 'events': []}
          for path in sorted(Path('results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          Path('round110-pareto-target.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Commit target result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-110-pareto-field-proof
          git add round110-pareto-target.json
          git commit -m 'Record per-rival Pareto frontier probe'
          git push origin HEAD:agent/ai-racing-speed-110-pareto-field-proof
