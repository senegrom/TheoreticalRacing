name: Assemble and validate racecraft review branch
on:
  push:
    branches: [work/racecraft-review-20260926]
    paths:
      - '.review-build/**'
      - '.github/workflows/racecraft-review-assemble.yml'
permissions:
  contents: write
concurrency:
  group: racecraft-review-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/racecraft-review-20260926
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Integrate exact-context source changes
        run: |
          if ! grep -q 'private int reviewProjectedDepth' src/tr/logic/RaceAi.java; then
            python3 .review-build/apply.py
          fi
          if ! grep -q 'boolean reviewTrafficNearby' src/tr/logic/RaceAi.java; then
            python3 .review-build/finalize.py
          fi
          git diff --check
      - name: Build and run contracts
        shell: bash
        run: |
          set -euo pipefail
          sh build_main.sh 2>&1 | tee /tmp/review-build.log
          sh run_tests.sh 2>&1 | tee /tmp/review-tests.log
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee /tmp/review-python.log
          python3 tests/ai1_review_controls_regression.py 2>&1 | tee /tmp/review-controls.log
      - name: Record validation and commit assembled sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/experiments/racecraft-review
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          report = {
            'baseline': '31bf6b986b669831a4ebc0b9d87cac5adb711a96',
            'assembly_input': os.environ['GITHUB_SHA'],
            'workflow_run': os.environ['GITHUB_RUN_ID'],
            'java': subprocess.run(['java', '-version'], capture_output=True, text=True, check=True).stderr.strip(),
            'passed': ['git diff --check', 'sh build_main.sh', 'sh run_tests.sh', "python3 -m unittest discover -s tests -p test_*.py", 'python3 tests/ai1_review_controls_regression.py'],
            'full_fleet_performed': False,
            'promoted': False
          }
          pathlib.Path('docs/experiments/racecraft-review/validation.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tr/logic/RaceAi.java src/tr/logic/RaceGame.java src/tr/logic/RaceAiTactics.java src/tr/logic/RacecraftReview.java tests/tr/logic/RacecraftReviewTests.java run_tests.sh racing-memory.md docs/experiments/racecraft-review/validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce experimental solo boundary and record completed review contracts'
            git push origin HEAD:work/racecraft-review-20260926
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: racecraft-review-assembly-logs
          path: /tmp/review-*.log
          retention-days: 7
