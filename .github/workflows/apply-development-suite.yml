name: Apply development suite

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-development-suite.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reassemble and apply reviewed patch
        run: |
          {
            cat .github/maintenance-patch-v2/chunk-00.b64
            cat .github/maintenance-patch-v2/chunk-01.b64
            head -c 1000 .github/maintenance-patch-v2/chunk-02.b64
            cat .github/maintenance-patch/part-01.b64
            cat .github/maintenance-patch/part-02.b64
            cat .github/maintenance-patch-v2/chunk-07.b64
            cat .github/maintenance-patch-v2/chunk-08.b64
            head -c 1000 .github/maintenance-patch-v2/chunk-09.b64
            cat .github/maintenance-patch/part-04.b64
          } | base64 --decode | gzip --decompress > /tmp/development-suite.patch
          git apply --index /tmp/development-suite.patch
          if git ls-files --error-unmatch theoretical-racing-source.zip >/dev/null 2>&1; then
            git rm -f theoretical-racing-source.zip
          fi
          git rm -r .github/maintenance-patch .github/maintenance-patch-v2
          git rm .github/workflows/apply-development-suite.yml

      - name: Run lint-clean Java tests
        run: sh ./run_tests.sh

      - name: Run headless and frozen-AI golden tests
        run: sh ./run_golden_tests.sh

      - name: Check Python and shell tooling
        run: |
          python -m compileall -q tracks tests
          sh -n build_main.sh run_tests.sh run_golden_tests.sh run_bench_main.sh

      - name: Verify the targeted AI1 improvement
        run: python tracks/ai_probe.py --allow-divergence --seed-start 4 --seeds 1 lemans

      - name: Run a fast benchmark smoke test
        run: python tracks/bench_ai.py --seeds 1 sprint

      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add AI regression gates and round-67 frontier'
          git push origin HEAD:master
# atomically restaged with verified blobs
