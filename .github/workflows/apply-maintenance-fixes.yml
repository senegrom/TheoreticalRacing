name: Apply maintenance fixes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-maintenance-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch exact reviewed defects
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('src/tr/logic/RaceGame.java'),
                  'return gameLogOverride != null ? gameLogOverride : gameLogPath();',
                  'return gameLogOverride != null ? gameLogOverride : TrackIO.gameLogPath();',
              ),
              (
                  Path('src/tr/logic/RaceAi.java'),
                  'if (i == subjectNum || game.players[i].isFinished())',
                  'if (game.players[i].getNumber() == subjectNum || game.players[i].isFinished())',
              ),
          ]
          for path, old, new in replacements:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Build and unit tests
        run: |
          chmod +x build_main.sh run_tests.sh
          ./run_tests.sh
          ./build_main.sh

      - name: Fast race smoke benchmark
        run: python3 tracks/run_bench.py --seeds 1 sprint

      - name: Remove one-off workflow and commit directly
        run: |
          rm .github/workflows/apply-maintenance-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix log fallback and AI player indexing'
          git push origin HEAD:master
