name: Round 168 combined occupancy screen

on:
  push:
    branches:
      - agent/ai-racing-speed-168-combined-occupancy
    paths:
      - .github/workflows/round168-combined-occupancy-screen.yml

permissions:
  contents: write

concurrency:
  group: round168-combined-occupancy-screen
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record screen run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round168-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'state': 'screen-started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- round168-status.json
          git commit -m 'Round 168: record combined occupancy screen' || exit 0
          git push

  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build promoted-master baseline and exact combined candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          git fetch origin \
            '+refs/heads/agent/ai-racing-speed-164-ahead-occupancy-map:refs/remotes/origin/agent/ai-racing-speed-164-ahead-occupancy-map' \
            '+refs/heads/agent/ai-racing-speed-165-live-occupancy-map:refs/remotes/origin/agent/ai-racing-speed-165-live-occupancy-map'
          git show origin/agent/ai-racing-speed-164-ahead-occupancy-map:tracks/round164_apply.py > /tmp/round164_apply.py
          git show origin/agent/ai-racing-speed-164-ahead-occupancy-map:tracks/round164_apply_fixed.py > /tmp/round164_apply_fixed.py
          git show origin/agent/ai-racing-speed-165-live-occupancy-map:tracks/round165_apply.py > /tmp/round165_apply.py
          git show origin/agent/ai-racing-speed-165-live-occupancy-map:tracks/round165_runtime.py > tracks/round168_runtime.py
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round168-base-sha.txt
          git worktree add /tmp/round168-screen "$BASE"
          cd /tmp/round168-screen
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round168-baseline.jar"
          python /tmp/round164_apply_fixed.py
          python /tmp/round165_apply.py
          git diff --name-only | sort > /tmp/round168-changed.txt
          printf '%s\n' src/tr/logic/RaceAi.java | sort > /tmp/round168-expected.txt
          diff -u /tmp/round168-expected.txt /tmp/round168-changed.txt
          test "$(grep -Fc 'final byte[] aheadOccupancy = buildAheadOccupancy' src/tr/logic/RaceAi.java)" = 1
          test "$(grep -Fc 'refreshLiveOccupancy();' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round168-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Measure seven-pair dual-order warm speed
        shell: bash
        run: |
          set +e
          python tracks/round168_runtime.py \
            --baseline round168-baseline.jar \
            --candidate round168-candidate.jar \
            --pairs 7 --aggregate-limit 0.95 --case-limit 1.05 \
            --out round168-runtime.json
          RC=$?
          set -e
          test -s round168-runtime.json
          python - <<'PY'
          import json
          result = json.load(open('round168-runtime.json'))
          assert all(row['byte_identical'] for row in result['cases']), result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          if [ "$RC" -ne 0 ]; then
            echo 'Round 168 did not clear the five-percent aggregate threshold.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round168-combined-occupancy-screen
          path: |
            round168-base-sha.txt
            round168-runtime.json
          if-no-files-found: warn
          retention-days: 30
