name: Observe Round 127 forensics

on:
  push:
    branches:
      - agent/ai-racing-speed-127-z195-forensics
    paths:
      - .github/workflows/round127-observer.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record latest Round 127 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            'repos/${{ github.repository }}/actions/workflows/round127-z195-forensics.yml/runs?branch=agent%2Fai-racing-speed-127-z195-forensics&per_page=5' \
            --jq '.workflow_runs[0] | {id,status,conclusion,head_sha,created_at,updated_at}' \
            > round127-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round127-status.json
          git commit -m 'Record Round 127 forensic status'
          git push origin HEAD:"$GITHUB_REF_NAME"

# branching-window refresh
