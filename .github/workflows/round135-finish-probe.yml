name: Round 135 finish-side runtime probe

on:
  push:
    branches:
      - agent/ai-racing-speed-135-finish-side-reject
    paths:
      - .github/workflows/round135-finish-probe.yml
      - tracks/round135_apply.py
      - tracks/round135_compare.py
      - tracks/round135_runtime.py

permissions:
  contents: write

concurrency:
  group: round135-finish-side-probe
  cancel-in-progress: true

jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish workflow run locator
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round135-probe-status.json').write_text(json.dumps({
              'id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'status_at_locator': 'started',
          }, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round135-probe-status.json
          git commit -m 'Round 135: record finish probe run' || exit 0
          git push

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build current-master baseline and exact candidate
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round135-probe-base-sha.txt
          git worktree add /tmp/round135-probe "$BASE"
          cd /tmp/round135-probe
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round135-probe-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round135_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceGame.java'
          git diff --check
          git diff -- src/tr/logic/RaceGame.java > "$GITHUB_WORKSPACE/round135-probe.patch"
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round135-probe-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
      - name: Run four-pair dual-order runtime probe
        run: |
          set -euxo pipefail
          python tracks/round135_runtime.py \
            --baseline round135-probe-baseline.jar \
            --candidate round135-probe-candidate.jar \
            --pairs 4 --out round135-probe-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round135-finish-probe
          path: |
            round135-probe-base-sha.txt
            round135-probe.patch
            round135-probe-runtime.json
          if-no-files-found: warn
          retention-days: 30
