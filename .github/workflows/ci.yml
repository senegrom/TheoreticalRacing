name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: sh ./run_tests.sh
      - run: sh ./build_main.sh
      - run: java -Djava.awt.headless=true -jar theoreticRacing.jar --list-tracks | grep -q '^silverstone$'

  frozen-ai2:
    name: Frozen AI2 golden races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sh ./build_main.sh
      - run: python tests/headless_smoke.py
      - run: python tests/query_replay_regression.py
      - run: python tests/lap_progress_regression.py
      - run: python tests/golden_races.py
      - name: Run every champion AI regression pin
        shell: bash
        run: |
          for test in tests/ai1_*_regression.py; do
            echo "==> $test"
            python "$test"
          done
      - name: Verify benchmark failures propagate
        run: |
          if python tracks/bench_ai.py --seeds 1 definitely-not-a-track; then
            echo 'benchmark unexpectedly accepted an invalid track' >&2
            exit 1
          fi

  tooling:
    name: Tooling checks
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select browser coverage
        id: scope
        run: python3 web/scripts/ci_scope.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m compileall -q tracks tests
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: sh -n build_main.sh run_tests.sh run_golden_tests.sh tracks/fleet_grid.sh

  # Local calls and checkout resolve to this workflow's exact triggering commit.
  browser:
    needs: tooling
    if: needs.tooling.outputs.browser == 'true'
    uses: ./.github/workflows/browser.yml

  publish:
    name: Publish GitHub Pages
    needs: [java, frozen-ai2, tooling, browser]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Empty the publication staging directory
        run: |
          rm -rf -- "$RUNNER_TEMP/racing-pages"
          mkdir -p "$RUNNER_TEMP/racing-pages"
      - uses: actions/download-artifact@v4
        with:
          name: browser-webapp
          path: ${{ runner.temp }}/racing-pages
      - name: Verify the entire tested artifact and attach matching source
        run: python3 web/scripts/site_artifact.py prepare "$RUNNER_TEMP/racing-pages" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/racing-pages
      - name: Refuse superseded workflow reruns
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web/scripts/deployment_guard.py --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.allowed == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
      - name: Install live-site test browser
        if: steps.current.outputs.allowed == 'true'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify gameplay on the public site
        if: steps.current.outputs.allowed == 'true'
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 web/tests/browser_e2e.py --browser chromium --url "$PAGE_URL" --expected-sha "$GITHUB_SHA" --expected-repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-pages-evidence
          path: web/build/browser-tests/
          retention-days: 7
