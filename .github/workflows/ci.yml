name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: sh ./run_tests.sh
      - run: sh ./build_main.sh
      - run: java -Djava.awt.headless=true -jar theoreticRacing.jar --list-tracks | grep -q '^silverstone$'

  frozen-ai2:
    name: Frozen AI2 golden races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sh ./build_main.sh
      - run: python tests/headless_smoke.py
      - run: python tests/golden_races.py
      - run: python tests/ai1_pace_regression.py
      - run: python tests/ai1_mixed_safety_regression.py
      - run: python tests/ai1_field_neutral_regression.py
      - run: python tests/ai1_staged_pace_regression.py
      - name: Verify benchmark failures propagate
        run: |
          if python tracks/bench_ai.py --seeds 1 definitely-not-a-track; then
            echo 'benchmark unexpectedly accepted an invalid track' >&2
            exit 1
          fi

  tooling:
    name: Tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m compileall -q tracks tests
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: sh -n build_main.sh run_tests.sh run_golden_tests.sh
