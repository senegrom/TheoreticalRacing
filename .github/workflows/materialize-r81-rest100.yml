name: Materialize Round 81 rest-slack candidate

on:
  push:
    branches: [agent/ai-racing-speed-81-rest100]
    paths:
      - .github/workflows/materialize-r81-rest100.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply the checksum-bounded Round 81 change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/tr/logic/RaceAi.java",
              "AI1_STAGED_REST_SLACK\t= 0.25;\t// round 80: near-neutral candidates only",
              "AI1_STAGED_REST_SLACK\t= 1.00;\t// round 81: one scorer point still needs strict rollout and field proof",
          )
          replace_once(
              "tests/ai1_staged_pace_regression.py",
              '"""Pin the Round-80 self-play-only staged-pace boundaries."""',
              '"""Pin the Round-81 self-play-only staged-pace boundaries."""',
          )
          replace_once(
              "tests/ai1_staged_pace_regression.py",
              '    ("silverstone", 18): 589,\n',
              '    ("silverstone", 15): 585,\n    ("silverstone", 18): 589,\n',
          )
          replace_once(
              "tests/ai1_staged_pace_regression.py",
              '        "(Hungaroring gain; Spa, Interlagos and Le Mans no slower; "\n',
              '        "(Hungaroring and Silverstone gains; Spa, Interlagos and Le Mans no slower; "\n',
          )
          for workflow in (".github/workflows/ci.yml", ".github/workflows/promotion-gate.yml"):
              replace_once(
                  workflow,
                  "      - run: python tests/ai1_field_neutral_regression.py\n",
                  "      - run: python tests/ai1_field_neutral_regression.py\n"
                  "      - run: python tests/ai1_staged_pace_regression.py\n",
              )
          PY
      - name: Verify exact candidate
        shell: bash
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
      - name: Commit only the verified candidate
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/materialize-r81-rest100.yml
          git add src/tr/logic/RaceAi.java tests/ai1_staged_pace_regression.py \
            .github/workflows/ci.yml .github/workflows/promotion-gate.yml
          expected=$(printf '%s\n' \
            .github/workflows/ci.yml \
            .github/workflows/materialize-r81-rest100.yml \
            .github/workflows/promotion-gate.yml \
            src/tr/logic/RaceAi.java \
            tests/ai1_staged_pace_regression.py | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git commit -m "Round 81: widen certified near-neutral pace"
          git push origin HEAD:${GITHUB_REF_NAME}
