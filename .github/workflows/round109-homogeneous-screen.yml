name: Round 109 homogeneous ESC confirmation screen

on:
  push:
    branches:
      - agent/ai-racing-speed-109-hungaroring144-probe
    paths:
      - .github/workflows/round109-homogeneous-screen.yml
      - tracks/round109_homogeneous_esc_confirm.py
      - tracks/round109_compare.py

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact live-master baseline and candidate
        run: |
          git fetch origin master
          git rev-parse origin/master > round109-base-sha.txt
          git worktree add /tmp/round109-candidate origin/master
          cd /tmp/round109-candidate
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round109-homogeneous-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round109_homogeneous_esc_confirm.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'homogeneousEscConfirm' src/tr/logic/RaceAi.java)" = 4
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round109-homogeneous-candidate.jar"
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round109-homogeneous.patch"
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python -m compileall -q tracks tests
      - name: Prove target and preserve the equal-speed frontier
        run: |
          mkdir -p round109-homogeneous-results
          python tracks/round109_compare.py \
            --baseline round109-homogeneous-baseline.jar \
            --candidate round109-homogeneous-candidate.jar \
            --track hungaroring --start 144 --end 144 \
            --out round109-homogeneous-results/hungaroring-144.json
          python tracks/round109_compare.py \
            --baseline round109-homogeneous-baseline.jar \
            --candidate round109-homogeneous-candidate.jar \
            --track zandvoort --start 115 --end 115 \
            --out round109-homogeneous-results/zandvoort-115.json
          python - <<'PY'
          import json
          h = json.load(open('round109-homogeneous-results/hungaroring-144.json'))
          z = json.load(open('round109-homogeneous-results/zandvoort-115.json'))
          assert h['counts']['safety_gain'] == 1 and len(h['events']) == 1, h
          assert z['counts']['identical'] == 1 and not z['events'], z
          PY
      - name: Run the sensitive same-policy screen
        run: |
          python tracks/round109_compare.py --baseline round109-homogeneous-baseline.jar --candidate round109-homogeneous-candidate.jar --track hungaroring --start 1 --end 150 --out round109-homogeneous-results/hungaroring-1-150.json > round109-homogeneous-results/hungaroring.stdout &
          python tracks/round109_compare.py --baseline round109-homogeneous-baseline.jar --candidate round109-homogeneous-candidate.jar --track zandvoort --start 106 --end 150 --out round109-homogeneous-results/zandvoort-106-150.json > round109-homogeneous-results/zandvoort.stdout &
          python tracks/round109_compare.py --baseline round109-homogeneous-baseline.jar --candidate round109-homogeneous-candidate.jar --track lemans --start 1 --end 50 --out round109-homogeneous-results/lemans-1-50.json > round109-homogeneous-results/lemans.stdout &
          python tracks/round109_compare.py --baseline round109-homogeneous-baseline.jar --candidate round109-homogeneous-candidate.jar --track gear --start 1 --end 50 --out round109-homogeneous-results/gear-1-50.json > round109-homogeneous-results/gear.stdout &
          wait
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {'pairs': 0, 'counts': {}, 'events': [], 'net_moves': 0}
          for path in sorted(Path('round109-homogeneous-results').glob('*-*.json')):
              if path.name in ('hungaroring-144.json', 'zandvoort-115.json'):
                  continue
              data = json.load(open(path))
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend({'track': data['track'], **event} for event in data['events'])
          Path('round109-homogeneous-results/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          bad = sum(summary['counts'].get(key, 0) for key in ('safety_regression', 'slower', 'redistribution'))
          assert summary['pairs'] == 295, summary
          assert bad == 0, summary
          assert any(event['track'] == 'hungaroring' and event['seed'] == 144
                     and event['classification'] == 'safety_gain'
                     for event in summary['events']), summary
          PY
      - name: Measure the targeted runtime boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, statistics, subprocess, tempfile, time

          root = Path.cwd()
          source = root / 'tracks' / 'bench.properties'

          def props(path):
              text = source.read_text()
              text = re.sub(r'^(player[1-8]Kind)=.*$', r'\1=AI1', text, flags=re.M)
              path.write_text(text)

          def run(jar, track, seed):
              with tempfile.TemporaryDirectory(prefix='r109-time-') as directory:
                  directory = Path(directory)
                  p = directory / 'p.properties'
                  log = directory / 'r.log'
                  props(p)
                  started = time.perf_counter()
                  result = subprocess.run([
                      'java', '-Djava.awt.headless=true', '-jar', str(root / jar),
                      '--auto', '--track', track, '--props', str(p), '--log', str(log),
                      '--seed', str(seed)
                  ], text=True, capture_output=True, timeout=1800)
                  if result.returncode:
                      raise SystemExit(result.stderr[-2000:])
                  return time.perf_counter() - started

          rows = []
          for track, seed in [('hungaroring', 144), ('lemans', 2), ('gear', 1)]:
              run('round109-homogeneous-baseline.jar', track, seed)
              run('round109-homogeneous-candidate.jar', track, seed)
              baseline, candidate = [], []
              for index in range(5):
                  order = ('baseline', 'candidate') if index % 2 else ('candidate', 'baseline')
                  for label in order:
                      value = run(f'round109-homogeneous-{label}.jar', track, seed)
                      (baseline if label == 'baseline' else candidate).append(value)
              ratio = statistics.median(candidate) / statistics.median(baseline)
              row = {'track': track, 'seed': seed, 'ratio': ratio,
                     'baseline': baseline, 'candidate': candidate}
              rows.append(row)
              if ratio > 1.50:
                  raise SystemExit(f'Round-109 runtime regression: {row}')
          Path('round109-homogeneous-results/runtime.json').write_text(
              json.dumps(rows, indent=2) + '\n'
          )
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round109-homogeneous-screen
          path: |
            round109-homogeneous-results
            round109-homogeneous.patch
            round109-base-sha.txt
          if-no-files-found: error
          retention-days: 14
