name: Round 231 measured regression verification
on:
  push:
    branches: [codex/racecraft-own-progress]
    paths:
      - .github/workflows/racecraft-round231-verify.yml
      - docs/experiments/round231/fixtures.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          git apply docs/experiments/round231/checkpoint-production.patch
          git apply docs/experiments/round231/fixtures.patch
          sh build_main.sh
      - run: sh run_tests.sh
      - name: Check measured goldens in ordinary check mode
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
        run: |
          mkdir -p results
          python tests/golden_races.py > results/goldens.txt 2>&1
          cp tests/golden_races.json results/
          sha256sum theoreticRacing.jar > results/build-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round231-final-goldens
          path: results
          if-no-files-found: error
          retention-days: 14
  pins:
    name: Refreshed pins / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          git apply docs/experiments/round231/checkpoint-production.patch
          git apply docs/experiments/round231/fixtures.patch
          sh build_main.sh
      - name: Run unchanged test logic with measured expectations
        env:
          PIN_GROUP: ${{ matrix.group }}
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=2
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          names = ['bounded_uncertain_field', 'finish_sprint_true_confirm', 'pace', 'energy_pace', 'field_neutral', 'private_slack', 'staged_pace']
          out=Path('results'); out.mkdir()
          summary=[]
          for i,name in enumerate(names):
              if i % 4 != int(os.environ['PIN_GROUP']): continue
              test='tests/ai1_'+name+'_regression.py'
              with (out/(name+'.txt')).open('w') as log:
                  run=subprocess.run([sys.executable,'docs/experiments/round231/capture.py',test,str(out/name)],stdout=log,stderr=subprocess.STDOUT,timeout=1200)
              summary.append({'test':test,'returncode':run.returncode})
              print(test+': '+str(run.returncode),flush=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          sys.exit(any(r['returncode'] for r in summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round231-final-pins-${{ matrix.group }}
          path: results
          if-no-files-found: error
          retention-days: 14
