name: Materialize Round 102 stable field acceleration

on:
  push:
    branches:
      - agent/ai-racing-speed-102-stable-field-accel
    paths:
      - .github/workflows/round102-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'Materialize Round 102 stable field acceleration'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply the independently gated AI1 candidate
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/senegrom/TheoreticalRacing/agent/ai-racing-speed-101-guarded-field-v3/tracks/round101_guarded_field_v3.patch \
            -o /tmp/round102.patch
          printf '%s  %s\n' \
            2231c6bf5cd53469c33e83d2055e92e6f140f76562ce52e5fe644a4603da48be \
            /tmp/round102.patch | sha256sum -c -
          git apply --check /tmp/round102.patch
          git apply /tmp/round102.patch
      - name: Mirror the proven rule and add permanent boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          race = Path('src/tr/logic/RaceAi.java')
          source = race.read_text()
          source = source.replace(
              'AI1_FIELD_ACCEL_MIN_SPEED2_GAIN\t= 16;\t// round 101:',
              'AI1_FIELD_ACCEL_MIN_SPEED2_GAIN\t= 16;\t// round 102:',
              1,
          )
          source = source.replace(
              '/** Round 101: recover a one-turn acceleration only in a bounded forward',
              '/** Round 102: recover a one-turn acceleration only in a bounded forward',
              1,
          )
          call = (\
              '\t\t\tchosen = stagedPaceOverride(pos, vel, playerNum, chosen, scoreByDir, scoreNSByDir,\n'\
              '\t\t\t\t\ttrapByDir, uncByDir, poTByDir);\n'\
          )
          mirror = (\
              '\t\t\tchosen = guardedFieldPaceOverride(pos, vel, playerNum, chosen,\n'\
              '\t\t\t\t\ttrapByDir, uncByDir, poTByDir);\n'\
          )
          assert source.count(call) == 2
          assert source.count(mirror) == 1
          parts = source.split(call)
          source = parts[0] + call + parts[1] + call + mirror + parts[2]
          assert source.count(mirror) == 2
          race.write_text(source)

          test = '''#!/usr/bin/env python3
          """Pin Round 102's stable forward-pack acceleration proof."""

          from pathlib import Path
          import sys
          import tempfile

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "tracks"))

          import bench_ai  # noqa: E402

          EXPECTED = {
              ("coil", 9): (7, 0, [58, 59, 60, 61, 61, 62, 62]),
              ("interlagos", 40): (7, 0, [122, 123, 124, 125, 127, 129, 130]),
              ("spa", 7): (7, 0, [79, 80, 81, 83, 84, 85, 86]),
              ("silverstone", 56): (7, 0, [81, 82, 83, 84, 85, 85, 86]),
              ("interlagos", 38): (7, 0, [122, 123, 124, 125, 126, 127, 128]),
              ("spa", 57): (7, 0, [78, 80, 81, 84, 85, 86, 87]),
          }

          PROMOTED_GAINS = {
              ("coil", 9): 428,
              ("spa", 7): 582,
              ("silverstone", 56): 588,
          }


          def main() -> int:
              if not Path(bench_ai.JAR).is_file():
                  raise SystemExit("theoreticRacing.jar not found; run build_main.sh first")

              results = {}
              with tempfile.TemporaryDirectory(prefix="field-accel-regression-") as directory:
                  bench_ai.configure_runtime(directory)
                  bench_ai.set_nplayers(8)
                  for kind in ("AI1", "AI2"):
                      bench_ai.set_all_to(kind)
                      for case in EXPECTED:
                          track, seed = case
                          results[(kind, case)] = bench_ai.run_track(
                              track, timeout=1200, seed=seed
                          )

              for kind in ("AI1", "AI2"):
                  for case, expected in EXPECTED.items():
                      actual = results[(kind, case)]
                      if actual != expected:
                          raise SystemExit(
                              f"Round-102 {case[0]} seed-{case[1]} {kind} regression: "
                              f"{actual}, expected {expected}"
                          )

              for case in EXPECTED:
                  if results[("AI1", case)] != results[("AI2", case)]:
                      raise SystemExit(
                          f"Round-102 champion self-tie lost at {case}: "
                          f"AI1 {results[('AI1', case)]}, AI2 {results[('AI2', case)]}"
                      )

              for case, old_moves in PROMOTED_GAINS.items():
                  new_moves = sum(results[("AI1", case)][2])
                  if new_moves >= old_moves:
                      raise SystemExit(
                          f"Round-102 pace gain lost at {case}: {new_moves} >= {old_moves}"
                      )

              if results[("AI1", ("interlagos", 40))][1] != 0:
                  raise SystemExit("Round-102 Interlagos seed-40 crash rescue lost")

              print(
                  "AIFieldAccelerationRegression: OK "
                  "(mirrored gains, crash rescue, and late-reversal vetoes pinned)"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          import textwrap
          Path('tests/ai_field_acceleration_regression.py').write_text(
              textwrap.dedent(test)
          )

          for filename in ('.github/workflows/ci.yml', '.github/workflows/promotion-gate.yml'):
              path = Path(filename)
              text = path.read_text()
              anchor = '      - run: python tests/ai1_finish_frontier_regression.py\n'
              assert text.count(anchor) == 1
              text = text.replace(
                  anchor,
                  anchor
                  + '      - run: python tests/ai1_thread_fragility_regression.py\n'
                  + '      - run: python tests/ai_field_acceleration_regression.py\n',
                  1,
              )
              path.write_text(text)

          development = Path('AI_DEVELOPMENT.md')
          text = development.read_text()
          anchor = '## Current champion and frontier baseline\n'
          assert text.count(anchor) == 1
          section = '''## Round 102: stable forward-pack acceleration

          Round 102 recovers one-turn accelerations that the normal scorer ranking leaves
          on the table in large homogeneous fields. The candidate is admitted only when
          it is exactly one empty-map turn faster, trap-free, uncertainty-free, and a
          decisive acceleration (`speed²` gain at least 16) inside a bounded two-to-five
          rival forward pack. The same eight-round, six-rival scorer world must strictly
          improve both the mover and aggregate field cost. Narrow-corridor accelerations
          need the full five-rival forward quorum and enough progress separation to
          exceed the incumbent and candidate braking envelopes. Near the finish, slower
          sub-fast lines remain under the existing dual full-finish certificate.

          The rule contains no track, seed, coordinate, or progress constant. Existing
          seal and danger checks remain independent downstream vetoes. The true-rival
          confirmation latch is also instance-scoped, preventing concurrent games in one
          JVM from suppressing one another's confirmation searches.

          Against the Round-100 champion, the exact AI1 differential covered 1,800 races:
          1,786 identical, 13 faster, one crash rescue, no slower race, no safety
          regression, and no equal-sum redistribution. The unchanged-safety races save 32
          finisher moves; Interlagos seed 40 additionally converts six finishers and one
          crash into seven finishers and no crash. The promoted boundaries include Coil
          seeds 7/9/12/33, Interlagos seed 26, Monza seed 39, Silverstone seeds 20/56,
          Spa seeds 5/7/38/49, and Zandvoort seed 99. Counterexamples from the broad arm,
          including Interlagos seeds 38/54 and Spa seed 57, retain the champion line.

          '''
          text = text.replace(anchor, textwrap.dedent(section) + anchor, 1)
          development.write_text(text)
          PY
      - name: Verify exact materialized candidate
        run: |
          rm .github/workflows/round102-materialize.yml
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python tests/ai1_energy_pace_regression.py
          python tests/ai1_cross_model_pace_regression.py
          python tests/ai1_finish_frontier_regression.py
          python tests/ai1_thread_fragility_regression.py
          python tests/ai_field_acceleration_regression.py
          python -m compileall -q tracks tests
          git diff --check
      - name: Commit clean production change
        run: |
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git add \
            src/tr/logic/RaceAi.java \
            tests/ai_field_acceleration_regression.py \
            .github/workflows/ci.yml \
            .github/workflows/promotion-gate.yml \
            AI_DEVELOPMENT.md \
            .github/workflows/round102-materialize.yml
          git commit -m 'Materialize Round 102 stable field acceleration'
          git push origin HEAD:agent/ai-racing-speed-102-stable-field-accel
