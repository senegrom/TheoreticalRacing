name: Finalize tested traffic branch
on:
  push:
    branches: [work/racecraft-outcomes-opening-20260928]
    paths: ['.github/workflows/traffic-opportunities-assemble.yml']
permissions:
  contents: write
concurrency:
  group: traffic-finalize-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/work/racecraft-outcomes-opening-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Retire assembly scaffolding and record completed implementation
        shell: bash
        run: |
          set -euo pipefail
          # Finalization never alters the already tested driving implementation.
          git diff --exit-code 340ec72fc5dd11b73dbe6ee3b025745dcbe0a679 -- src tools run_tests.sh
          git merge-base --is-ancestor 82d259a217c23991cec7adc164c81f48e575c88c HEAD
          git rm -r -- .traffic-20261006 .github/workflows/traffic-opportunities-assemble.yml
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          memory = Path('racing-memory.md')
          text = memory.read_text(encoding='utf-8')
          title, rest = text.split('\n', 1)
          entry = '''

          ## Traffic branch finalization (2026-10-07, not promoted)

          Verified the interrupted implementation was committed as 340ec72 and its
          assembly run 37535808108 passed JDK 25 contracts, Python tests, 32 baseline
          controls, six full-suffix counterfactual cases, 30 independent traffic-arm
          races, all twelve goldens and every champion pin. Removed the temporary
          assembly inputs and self-writing workflow. Persistent read-only CI now pins
          current master 82d259a instead of the old 1c50a5c baseline, runs all six
          traffic arms independently, and adds a separate combined traffic/adaptive
          control plus full-suffix corpus matrix (including manoeuvre policy memory).
          JDK 26 and browser repeats are scheduled, not claimed passed here. No new
          driving changes, default-policy changes, fleet promotion, or place gain.
          '''
          memory.write_text(title + entry + rest, encoding='utf-8')
          record = Path('docs/experiments/traffic-opportunities/validation.json')
          data = json.loads(record.read_text(encoding='utf-8'))
          data['implementationCommit'] = '340ec72fc5dd11b73dbe6ee3b025745dcbe0a679'
          data['finalizationDate'] = '2026-10-07'
          data['finalizationSource'] = os.environ['GITHUB_SHA']
          data['finalizationRun'] = os.environ['GITHUB_RUN_ID']
          data['repeatValidationWorkflow'] = '.github/workflows/racecraft-next.yml'
          data['additionalValidationPending'] = ['JDK 26 and browser repeats', 'Combined new traffic flags: full-race and complete-suffix corpus controls', 'Repeat independent adaptive and traffic controls']
          data['note'] = 'Read-only CI results are authoritative for repeats. Finalization changes no production driving code. Existing six corpus cases used the previous adaptive configuration; the newly added matrix explicitly enables all traffic flags too.'
          record.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git add -- racing-memory.md docs/experiments/traffic-opportunities/validation.json
          git diff --cached --check
          # Never overwrite a concurrently advanced branch, and never write master.
          git fetch origin refs/heads/work/racecraft-outcomes-opening-20260928
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize tested traffic experiments and retire temporary assembly scaffolding'
          git push origin HEAD:refs/heads/work/racecraft-outcomes-opening-20260928
