name: Round 142 primitive boundary screen
on:
  push:
    branches: [agent/ai-racing-speed-142-primitive-boundary-intersection]
    paths: [.github/workflows/round142-primitive-boundary-screen.yml, tracks/round142_primitive_apply.py, tracks/round142_runtime.py]
permissions: {contents: write}
concurrency: {group: round142-primitive-boundary-screen, cancel-in-progress: true}
jobs:
  locator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record run id
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('round142-status.json').write_text(json.dumps({'id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA'],'state':'started'},sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round142-status.json
          git commit -m 'Round 142: record primitive-boundary screen run' || exit 0
          git push
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Build live-master baseline and exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          printf '%s\n' "$BASE" > round142-base-sha.txt
          git worktree add /tmp/round142-work "$BASE"
          cd /tmp/round142-work
          sh ./run_tests.sh && sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round142-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round142_primitive_apply.py"
          printf '%s\n' src/tr/logic/RaceGame.java src/tr/logic/TrackGeometry.java | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          sh ./run_tests.sh && sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round142-candidate.jar"
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python tracks/ai_probe.py
          PYTHONPATH=. python tests/test_tooling.py
          python -m compileall -q tracks tests
      - name: Run dual-order warm screen
        run: python tracks/round142_runtime.py --baseline round142-baseline.jar --candidate round142-candidate.jar --pairs 4 --out round142-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round142-primitive-boundary-screen
          path: |
            round142-base-sha.txt
            round142-runtime.json
          if-no-files-found: warn
          retention-days: 30
