name: Round 112 synchronized far-finish frontier screen

on:
  push:
    branches:
      - agent/ai-racing-speed-112-finish31-frontier
    paths:
      - .github/workflows/round112-finish-far-screen.yml
      - tracks/round112_apply_finish_far.py
      - tracks/round112_compare_pace.py
      - tracks/round109_compare_pace.py

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        max_ttf: [35, 40]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact baseline and finish-frontier candidate
        env:
          MAX_TTF: ${{ matrix.max_ttf }}
        run: |
          git fetch origin master
          git worktree add "/tmp/round112-finish-${MAX_TTF}" origin/master
          cd "/tmp/round112-finish-${MAX_TTF}"
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round112_apply_finish_far.py" "$MAX_TTF" \
            > "$GITHUB_WORKSPACE/apply.log" 2>&1
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/candidate.jar"
      - name: Run permanent pins and exact finish-heavy windows
        env:
          MAX_TTF: ${{ matrix.max_ttf }}
        run: |
          set +e
          FAILED=''
          PASSED=''
          cd "/tmp/round112-finish-${MAX_TTF}"
          for test in \
            tests/headless_smoke.py \
            tests/golden_races.py \
            tests/ai1_pace_regression.py \
            tests/ai1_mixed_safety_regression.py \
            tests/ai1_field_neutral_regression.py \
            tests/ai1_staged_pace_regression.py \
            tests/ai1_energy_pace_regression.py \
            tests/ai1_cross_model_pace_regression.py \
            tests/ai1_finish_frontier_regression.py \
            tests/ai1_thread_fragility_regression.py \
            tests/ai1_esc_true_confirm_regression.py; do
            name=${test##*/}
            python "$test" > "$GITHUB_WORKSPACE/${name}.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED="$name"
              break
            fi
            PASSED="${PASSED}${name},"
          done
          cd "$GITHUB_WORKSPACE"
          mkdir -p baseline-runs candidate-runs results
          if [ -z "$FAILED" ]; then
            for spec in \
              'coil 1 100' \
              'spa 1 100' \
              'silverstone 1 100' \
              'monza 1 100' \
              'interlagos 1 100' \
              'gear 1 60' \
              'bigoval 1 60' \
              'hungaroring 1 60' \
              'zandvoort 1 60'; do
              set -- $spec
              track=$1
              start=$2
              end=$3
              python tracks/round112_compare_pace.py run --jar baseline.jar \
                --track "$track" --start "$start" --end "$end" \
                --label baseline --directory baseline-runs \
                > "${track}-baseline.json" || { FAILED="run-${track}-baseline"; break; }
              python tracks/round112_compare_pace.py run --jar candidate.jar \
                --track "$track" --start "$start" --end "$end" \
                --label candidate --directory candidate-runs \
                > "${track}-candidate.json" || { FAILED="run-${track}-candidate"; break; }
              python tracks/round112_compare_pace.py compare \
                --track "$track" --start "$start" --end "$end" \
                --baseline-dir baseline-runs --candidate-dir candidate-runs \
                --out "results/${track}.json" > "${track}-compare.json" \
                || { FAILED="compare-${track}"; break; }
            done
          fi
          FAILED="$FAILED" PASSED="$PASSED" python - <<'PY'
          import json, os
          from pathlib import Path
          failed = os.environ['FAILED']
          summary = {
              'variant': f"finish_sync_ttf_{os.environ['MAX_TTF']}",
              'max_ttf': int(os.environ['MAX_TTF']),
              'baseline_sha': '0f06698d455b5641eac3c78e39e9c9a9c6188b25',
              'status': 'failed' if failed else 'ok',
              'failed_stage': failed or None,
              'passed_tests': [x for x in os.environ['PASSED'].split(',') if x],
              'pairs': 0,
              'counts': {},
              'net_moves': 0,
              'events': [],
          }
          if failed and Path(failed + '.log').exists():
              summary['failure_tail'] = Path(failed + '.log').read_text(
                  errors='replace')[-5000:]
          for path in sorted(Path('results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          bad = sum(summary['counts'].get(key, 0) for key in
                    ('slower', 'safety_regression', 'redistribution'))
          summary['bad'] = bad
          summary['viable'] = (not failed and bad == 0
              and summary['counts'].get('pareto_faster', 0) > 0)
          Path(f"round112-finish-{os.environ['MAX_TTF']}.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round112-finish-${{ matrix.max_ttf }}
          path: round112-finish-${{ matrix.max_ttf }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: round112-finish-*
          path: results
          merge-multiple: true
      - name: Aggregate far-finish variants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(path.read_text())
                  for path in sorted(Path('results').glob('round112-finish-*.json'))]
          output = {
              'baseline_sha': '0f06698d455b5641eac3c78e39e9c9a9c6188b25',
              'viable': [row['max_ttf'] for row in rows if row.get('viable')],
              'variants': rows,
          }
          Path('round112-finish-far-summary.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n')
          print(json.dumps(output, indent=2, sort_keys=True))
          PY
      - name: Commit measured summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/ai-racing-speed-112-finish31-frontier
          git add round112-finish-far-summary.json
          git commit -m 'Record synchronized far-finish screen'
          git push origin HEAD:agent/ai-racing-speed-112-finish31-frontier
