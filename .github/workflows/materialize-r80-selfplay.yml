name: Materialize Round 80 self-play pace guard

on:
  push:
    branches: [agent/ai-racing-speed-80-staged-energy-selfplay]
    paths:
      - .github/workflows/materialize-r80-selfplay.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and apply the checksum-pinned guard
        shell: bash
        run: |
          set -euo pipefail
          echo 'ccfdfc9a21b9e0422180116cdfafd8b5e57f408f262cf3b7b637da7275f55998  src/tr/logic/RaceAi.java' | sha256sum -c -
          echo 'c8186477b9f02fb72877d363bb2af70bdaaa69ecd8f0ba8004d0b9fc97282591  tests/ai1_staged_pace_regression.py' | sha256sum -c -
          echo '79f1375ca9770f916e0eed9aad2acba410d88a3a7c6b38932d62e20de517a99b  .r80/selfplay-guard.patch' | sha256sum -c -
          git apply --check .r80/selfplay-guard.patch
          git apply .r80/selfplay-guard.patch
          echo '7a2e68f67c17baa5fa7cf75eec1d651ddc68691a5a524a08eadd8e73d984e78e  src/tr/logic/RaceAi.java' | sha256sum -c -
          echo '81a9b65a614a672db3a354707be47dcb9c6becbbc656c6db4b62cfd78d95a10b  tests/ai1_staged_pace_regression.py' | sha256sum -c -
          git diff --check
      - name: Verify source and deterministic boundaries
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          python tests/ai1_pace_regression.py
          python tests/ai1_mixed_safety_regression.py
          python tests/ai1_field_neutral_regression.py
          python tests/ai1_staged_pace_regression.py
          python -m compileall -q tracks tests
      - name: Commit only the verified source and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add src/tr/logic/RaceAi.java tests/ai1_staged_pace_regression.py
          git rm .r80/selfplay-guard.patch .github/workflows/materialize-r80-selfplay.yml
          git commit -m 'Round 80: isolate staged pace to self-play'
          git push origin HEAD:agent/ai-racing-speed-80-staged-energy-selfplay
