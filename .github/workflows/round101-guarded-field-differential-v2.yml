name: Round 101 guarded-field differential v2

on:
  push:
    branches:
      - agent/ai-racing-speed-101-guarded-field
    paths:
      - .github/workflows/round101-guarded-field-differential-v2.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply AI1-only candidate
        run: python tracks/round101_guarded_field_patch.py
      - name: Verify and build
        run: |
          sh ./run_tests.sh
          sh ./build_main.sh
          python tests/headless_smoke.py
          python tests/golden_races.py
          for test in tests/ai1_*_regression.py; do python "$test"; done
          python -m py_compile tracks/round101_compare_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: round101-guarded-field-v2-jar
          path: theoreticRacing.jar
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {track: silverstone, seeds: 60}
          - {track: monza, seeds: 60}
          - {track: spa, seeds: 60}
          - {track: monaco, seeds: 60}
          - {track: spielberg, seeds: 60}
          - {track: nurburgring, seeds: 60}
          - {track: lemans, seeds: 60}
          - {track: interlagos, seeds: 60}
          - {track: zandvoort, seeds: 80}
          - {track: hungaroring, seeds: 60}
          - {track: circle, seeds: 60}
          - {track: the_long_loop, seeds: 60}
          - {track: sprint, seeds: 60}
          - {track: hairpin, seeds: 80}
          - {track: triangle, seeds: 60}
          - {track: chicane, seeds: 60}
          - {track: bigoval, seeds: 60}
          - {track: curve, seeds: 60}
          - {track: zigzag, seeds: 60}
          - {track: coil, seeds: 60}
          - {track: slalom, seeds: 60}
          - {track: gear, seeds: 60}
          - {track: serpentine, seeds: 25}
          - {track: serpentine2, seeds: 25}
          - {track: spiral, seeds: 25}
          - {track: cog, seeds: 25}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: round101-guarded-field-v2-jar
          path: .
      - name: Compare exact races
        run: |
          python tracks/round101_compare_exact.py --jar theoreticRacing.jar \
            --track '${{ matrix.track }}' --seeds '${{ matrix.seeds }}' \
            --out 'round101-${{ matrix.track }}-summary.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round101-v2-${{ matrix.track }}
          path: round101-${{ matrix.track }}-summary.json
          if-no-files-found: error
