name: Validate proved racecraft
on:
  push:
    branches: [master]
    paths: ['.github/workflows/materialize-racecraft.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TREE: 646d041b2ce79179490bab69addd946a8cbc3a77
      JAVA_TOOL_OPTIONS: -Xmx2g
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ea6aadd95262256f009d8d736141a49b590319d5
          persist-credentials: false
      - name: Materialize source while preserving computed starts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          sha = '5f761029e969fd8815756cb9a95f4c1a84df1ffe'
          url = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/blobs/' + sha
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              raw = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
          patch = lzma.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == 'ca394df02bbafae9499797dbac9ed7b547d01328aef58be44c74b9e0bb5f881a'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'racecraft.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--exclude=tests/tr/logic/CoreTests.java', str(path)], check=True)
          core = pathlib.Path('tests/tr/logic/CoreTests.java')
          text = core.read_text()
          anchor = '        FollowupRuleTests.run();'
          assert text.count(anchor) == 1 and 'StartPlacementTests.run();' in text
          core.write_text(text.replace(anchor, anchor + '\n        RaceAiTacticsTests.run();'))
          pathlib.Path('.github/workflows/materialize-racecraft.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == os.environ['EXPECTED_TREE']
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: JDK 25 core, live referee and integration contracts
        run: |
          sh run_tests.sh
          sh build_main.sh
          python3 tests/ai1_racecraft_regression.py
          python3 tests/headless_smoke.py
          python3 tests/query_replay_regression.py
          python3 tests/lap_progress_regression.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: JDK 26 core and production build
        run: |
          sh run_tests.sh
          sh build_main.sh
      - name: Store integrated source objects without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == os.environ['EXPECTED_TREE']
          assert not subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip(), 'tests changed source'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM'], text=True).splitlines()
          entries = []
          for name in paths:
              assert name.startswith(('src/', 'tests/', 'docs/')) and '..' not in pathlib.PurePosixPath(name).parts
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append(dict(path=name, mode=mode, type='blob', content=pathlib.Path(name).read_text()))
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          # Upstream placement tree, with only our temporary workflow removed.
          data = dict(base_tree='4986368164afc36c61cff1368af001d5b9d754f6', tree=entries)
          url = 'https://api.github.com/repos/senegrom/TheoreticalRacing/git/trees'
          with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(data).encode(), headers=headers, method='POST'), timeout=60) as response:
              tree = json.load(response)['sha']
          assert tree == os.environ['EXPECTED_TREE'], tree
          report = dict(base='ea6aadd95262256f009d8d736141a49b590319d5', tree=tree, files=paths)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'racecraft-validated-tree.json').write_text(json.dumps(report, indent=2))
          print('Validated source tree:', tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: racecraft-validated-tree
          path: ${{ runner.temp }}/racecraft-validated-tree.json
          retention-days: 7
