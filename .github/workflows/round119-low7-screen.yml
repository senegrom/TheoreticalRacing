name: Round 119 speed-squared-gain-seven screen

on:
  push:
    branches:
      - agent/ai-racing-speed-119-low7-screen
    paths:
      - .github/workflows/round119-low7-screen.yml
      - tracks/round119_apply.py
      - tracks/round119_compare.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > round119-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add round119-run-id.txt
          git commit -m 'Record Round 119 screen run'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Build exact champion and candidate
        run: |
          BASE=261b71735a1d413527e68a829111a10d51a363b3
          git cat-file -e "$BASE^{commit}"
          printf '%s\n' "$BASE" > round119-base-sha.txt
          git worktree add /tmp/round119 "$BASE"
          cd /tmp/round119
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round119-baseline.jar"
          python "$GITHUB_WORKSPACE/tracks/round119_apply.py"
          test "$(git diff --name-only)" = 'src/tr/logic/RaceAi.java'
          test "$(grep -c 'AI1_FIELD_ACCEL_FRONTIER_MIN_SPEED2_GAIN.*= 7' src/tr/logic/RaceAi.java)" = 1
          git diff --check
          sh ./run_tests.sh
          sh ./build_main.sh
          cp theoreticRacing.jar "$GITHUB_WORKSPACE/round119-candidate.jar"
          git diff -- src/tr/logic/RaceAi.java > "$GITHUB_WORKSPACE/round119.patch"
      - name: Run permanent regression suite
        working-directory: /tmp/round119
        run: |
          for test in \
            tests/headless_smoke.py \
            tests/golden_races.py \
            tests/ai1_pace_regression.py \
            tests/ai1_mixed_safety_regression.py \
            tests/ai1_field_neutral_regression.py \
            tests/ai1_staged_pace_regression.py \
            tests/ai1_energy_pace_regression.py \
            tests/ai1_cross_model_pace_regression.py \
            tests/ai1_finish_frontier_regression.py \
            tests/ai1_thread_fragility_regression.py \
            tests/ai1_esc_true_confirm_regression.py \
            tests/ai1_graduated_field_accel_regression.py \
            tests/ai1_six_ahead_accel_regression.py; do
            python "$test"
          done
          python -m compileall -q tracks tests
      - uses: actions/upload-artifact@v4
        with:
          name: round119-build
          path: |
            round119-baseline.jar
            round119-candidate.jar
            round119-base-sha.txt
            round119.patch
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        track:
          - coil
          - spa
          - silverstone
          - interlagos
          - hungaroring
          - lemans
          - monza
          - zandvoort
          - nurburgring
          - spielberg
          - monaco
          - the_long_loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: round119-build
          path: .
      - name: Compare exact seeded outcomes
        env:
          TRACK: ${{ matrix.track }}
        run: |
          python tracks/round119_compare.py \
            --baseline round119-baseline.jar \
            --candidate round119-candidate.jar \
            --track "$TRACK" --start 1 --end 150 \
            --out "round119-${TRACK}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round119-result-${{ matrix.track }}
          path: round119-${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: round119-result-*
          path: round119-results
          merge-multiple: true
      - name: Aggregate focused screen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              'baseline_sha': '261b71735a1d413527e68a829111a10d51a363b3',
              'candidate': 'moderate_field_accel_min_speed2_gain_7',
              'pairs': 0,
              'counts': {},
              'net_moves': 0,
              'events': [],
              'runtime_ratios': {},
          }
          for path in sorted(Path('round119-results').glob('*.json')):
              data = json.loads(path.read_text())
              summary['pairs'] += data['pairs']
              summary['net_moves'] += data['net_moves']
              summary['runtime_ratios'][data['track']] = data['runtime_ratio']
              for key, value in data['counts'].items():
                  summary['counts'][key] = summary['counts'].get(key, 0) + value
              summary['events'].extend(
                  {'track': data['track'], **event} for event in data['events'])
          assert summary['pairs'] == 1800, summary
          Path('round119-low7-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round119-summary
          path: round119-low7-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish focused summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add round119-low7-summary.json
          git commit -m 'Record Round 119 low-seven screen'
          git push origin HEAD:"$GITHUB_REF_NAME"
