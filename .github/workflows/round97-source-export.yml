name: Export Round 97 source

on:
  push:
    branches:
      - agent/ai-racing-speed-97-source-export
    paths:
      - .github/workflows/round97-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Package exact source tree
        run: tar --exclude=.git -czf /tmp/theoretical-racing-round97.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: theoretical-racing-round97-source
          path: /tmp/theoretical-racing-round97.tar.gz
          if-no-files-found: error
          retention-days: 3
